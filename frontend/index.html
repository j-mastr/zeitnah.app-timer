<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<!-- Progressive web app (files in public/; the service worker is registered at the end of the script) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0A1929" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EEF2F5" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* iOS standalone draws under the status bar (black-translucent). */
    --safe-top:env(safe-area-inset-top,0px);
    /* Height of every control in the top bar (pills, undo/redo), the same on every device. */
    --bar-h:32px;
    --bg:#0A1929; --panel:#112A45; --panel2:#14314F; --text:#EAF0F5; --muted:#7E94A8;
    --accent:#E0A63B; --accent-ink:#2A1C04; --danger:#E0625A; --ok:#3FB37F; --border:rgba(255,255,255,0.09);
    --shade:rgba(2,10,20,0.55);
    /* Capture kinds by role (finish has none: it is the default look). */
    --kind-start:#3FB37F; --kind-split:#5AA9E6; --kind-marker:#C184E6;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#EEF2F5; --panel:#FFFFFF; --panel2:#F4F7F9; --text:#0F2438; --muted:#5C7690;
      --accent:#B9822A; --accent-ink:#FFFFFF; --danger:#B23B32; --ok:#1E8A5A; --border:rgba(15,36,56,0.10);
      --shade:rgba(15,36,56,0.35);
      --kind-start:#1E8A5A; --kind-split:#2F7BB8; --kind-marker:#8A4BAE;
    }
  }
  :root[data-theme="light"]{
    --bg:#EEF2F5; --panel:#FFFFFF; --panel2:#F4F7F9; --text:#0F2438; --muted:#5C7690;
    --accent:#B9822A; --accent-ink:#FFFFFF; --danger:#B23B32; --ok:#1E8A5A; --border:rgba(15,36,56,0.10);
    --shade:rgba(15,36,56,0.35);
    --kind-start:#1E8A5A; --kind-split:#2F7BB8; --kind-marker:#8A4BAE;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  /* Controls the access code doesn't allow (data-perm, see applyPermissions). */
  .perm-hidden{display:none !important;}
  /* Backstop against anything widening the page (iOS then zooms the whole app out).
     `clip`, unlike `hidden`, makes no scroll container, so the sticky clock keeps working. */
  html{scroll-padding-top:var(--safe-top); overflow-x:clip; -webkit-text-size-adjust:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',system-ui,sans-serif; min-height:100%;
    padding-top:var(--safe-top); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:1200px; margin:0 auto; padding:20px 16px 60px;}

  /* ---------- header ---------- */
  .topbar{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .title-row{display:flex; align-items:center; gap:8px; min-width:0;}
  h1{font-size:19px; font-weight:600; margin:0; letter-spacing:.2px; overflow-wrap:anywhere;}
  .title-input{font-size:17px; font-weight:600; max-width:320px;}
  .sub{color:var(--muted); font-size:13px; margin-top:2px;}
  .top-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .status-pill{display:inline-flex; align-items:center; gap:7px; height:var(--bar-h); background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:999px; padding:0 12px; font-size:12px; cursor:pointer; font-family:inherit; max-width:100%;}
  .status-pill span:last-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0;}
  .dot.online{background:var(--ok);}
  .dot.connecting{background:var(--accent); animation:pulse 1.2s ease-in-out infinite;}
  .dot.offline, .dot.outdated{background:var(--danger);}
  @keyframes pulse{50%{opacity:.35;}}
  .settings-btn{display:inline-flex; align-items:center; gap:6px; height:var(--bar-h); background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:999px; padding:0 12px; font-size:12px; cursor:pointer; font-family:inherit;}
  .history-btns{display:inline-flex; height:var(--bar-h); background:var(--panel); border:1px solid var(--border); border-radius:999px; overflow:hidden;}
  .history-btn{background:none; border:0; color:var(--text); height:100%; padding:0 12px; font-size:16px; line-height:1; cursor:pointer; font-family:inherit;}
  .history-btn + .history-btn{border-left:1px solid var(--border);}
  .history-btn:disabled{opacity:.35; cursor:default;}
  .history-btns[hidden], body.archived .history-btns{display:none;}
  .banner{background:var(--panel); border:1px solid var(--accent); border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:14px;}

  /* ---------- app grid: default (narrow window) ---------- */
  .app{
    display:grid;
    /* minmax(0,…) everywhere: no child's intrinsic width may widen the page (a <select>
       reports its longest option as min-content). */
    grid-template-columns:minmax(0,1fr);
    grid-template-areas:"clock" "sorted" "participants" "captures";
    gap:14px;
    align-items:start;
  }
  .clock-card{grid-area:clock;}
  .sorted-panel{grid-area:sorted;}
  .participants-panel{grid-area:participants;}
  .captures-panel{grid-area:captures;}

  .clock-card{
    position:relative;
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:20px 18px; text-align:center;
  }
  body.pin-clock .clock-card{position:sticky; top:var(--safe-top); z-index:5;}
  /* Only while it really sits at the top edge does the card reach over the status bar, so
     nothing scrolls visibly through that strip. Painted, not laid out: no jump on sticking. */
  body.clock-stuck .clock-card{border-top-left-radius:0; border-top-right-radius:0;}
  body.clock-stuck .clock-card::before{
    content:''; position:absolute; left:-1px; right:-1px;
    top:calc(-1 * (var(--safe-top) + 1px)); height:calc(var(--safe-top) + 1px);
    background:var(--panel); border:1px solid var(--border); border-bottom:none;
  }
  /* Its own row rather than an overlay: the clock is as wide as the card on small screens. */
  .clock-tools{display:flex; justify-content:flex-end; margin:-12px -8px -4px;}
  .clock{font-family:'Space Mono',monospace; font-weight:700; font-variant-numeric:tabular-nums; font-size:clamp(38px,11vw,86px); letter-spacing:1px; line-height:1;}
  .clock .cs{font-size:0.45em; color:var(--muted);}
  .date{color:var(--muted); font-size:12px; margin-top:6px; font-family:'Space Mono',monospace;}
  .capture-btn{margin-top:16px; width:100%; max-width:420px; border:none; border-radius:12px; background:var(--accent); color:var(--accent-ink); font-family:'Space Mono',monospace; font-weight:700; font-size:18px; padding:16px; cursor:pointer; letter-spacing:.5px; transition:transform .08s ease;}
  .capture-btn:active{transform:scale(0.97);}
  /* A kind other than finish shows as a stripe in its role colour; a one-shot kind adds a dashed ring. */
  .capture-btn.kind-start{box-shadow:inset 10px 0 0 var(--kind-start);}
  .capture-btn.kind-split{box-shadow:inset 10px 0 0 var(--kind-split);}
  .capture-btn.kind-marker{box-shadow:inset 10px 0 0 var(--kind-marker);}
  .capture-btn.once{outline:2px dashed var(--text); outline-offset:3px;}
  .seg.kind-seg{display:inline-flex; max-width:100%; justify-content:center; margin-top:14px;}
  .kind-seg button{-webkit-touch-callout:none; user-select:none; -webkit-user-select:none;}
  .kind-seg button.once{outline:1px dashed var(--text); outline-offset:-3px;}
  .kind-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:1px; background:transparent; border:1px solid var(--muted);}
  .kind-dot.kind-start{background:var(--kind-start); border-color:var(--kind-start);}
  .kind-dot.kind-split{background:var(--kind-split); border-color:var(--kind-split);}
  .kind-dot.kind-marker{background:var(--kind-marker); border-color:var(--kind-marker);}
  .kind-note{color:var(--muted); font-size:12px; margin-top:8px;}
  .kind-note .link-btn{margin-top:0;}
  /* Another device deleted this device's station: a dismissible note at the bottom of the clock card. */
  .ws-notice{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px 8px; margin-top:12px;
    border:1px solid var(--accent); border-radius:10px; padding:8px 10px; font-size:13px;}
  .ws-notice .btn{padding:6px 10px; font-size:12px;}
  .kind-menu{position:absolute; top:34px; right:12px; z-index:30; min-width:220px; max-width:calc(100% - 24px); text-align:left;
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:6px; box-shadow:0 8px 24px rgba(0,0,0,.3);}
  .kind-opt{display:flex; align-items:center; gap:6px;}
  .kind-pick{flex:1; min-width:0; text-align:left; background:none; border:none; border-radius:6px; color:var(--text); font:inherit; font-size:13px; padding:8px 10px; cursor:pointer;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .kind-pick.active{background:var(--panel2); font-weight:600;}
  .kind-opt .link-btn{margin-top:0; font-size:12px; white-space:nowrap;}
  .kind-menu .kind-new{display:block; margin:4px 0 0; padding:8px 10px;}
  .banner .link-btn{margin:0;}
  .link-btn{display:inline-block; margin-top:10px; background:none; border:none; padding:2px 6px; color:var(--muted); font-family:inherit; font-size:13px; text-decoration:underline; text-underline-offset:3px; cursor:pointer;}
  .link-btn:active{color:var(--text);}
  .hint-line{color:var(--muted); font-size:11px; margin-top:10px; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;}
  .hint-pair{display:inline-flex; align-items:center; gap:4px; white-space:nowrap;}

  /* ---------- wide window: clock on top, participants left / captures right ---------- */
  @media (min-width:700px){
    .app{
      grid-template-columns:minmax(0,320px) minmax(0,1fr);
      grid-template-areas:
        "clock   clock"
        "sorted  captures"
        "participants   captures";
      /* A long finishes list must not push the participants panel away from the ranking:
         the slack of the spanned rows goes to the last one, below the participants. */
      grid-template-rows:auto auto 1fr;
    }
  }

  .panel{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; min-width:0;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:4px;}
  .panel-head h2{margin:0; font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px;}
  .panel-head .count{color:var(--muted); font-weight:400; font-size:12px;}
  .panel .hint-line{justify-content:flex-start; margin:0 0 10px;}

  .toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px;}
  .seg{display:flex; flex-wrap:wrap; gap:3px; background:var(--panel2); padding:3px; border-radius:8px;}
  .seg button{border:none; background:transparent; color:var(--muted); font-size:12px; padding:6px 10px; border-radius:6px; cursor:pointer; font-family:inherit; white-space:nowrap;}
  .seg button.active{background:var(--panel); color:var(--text); font-weight:600;}
  .rank-pill{display:inline-flex; align-items:center; gap:3px; font-size:10px; color:var(--accent); font-family:'Space Mono',monospace; margin-top:2px;}

  .add-row{display:flex; gap:8px; margin-bottom:10px;}
  .input{background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px 12px; font-size:14px; font-family:inherit; width:100%; min-width:0;}
  .input[readonly]{color:var(--muted);}
  .add-row .input{flex:1;}
  .btn{background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px 14px; font-size:14px; cursor:pointer; font-family:inherit; white-space:nowrap;}
  .btn.small{padding:8px 12px; font-size:13px;}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600;}
  .btn.danger{color:var(--danger); border-color:var(--danger); background:transparent;}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  .search-wrap{position:relative; margin-bottom:10px;}
  .search-results{position:absolute; top:100%; left:0; right:0; background:var(--panel); border:1px solid var(--border); border-radius:8px; margin-top:4px; max-height:220px; overflow:auto; z-index:30; box-shadow:0 8px 24px rgba(0,0,0,.3);}
  .search-results .res{padding:9px 12px; font-size:13px; cursor:pointer;}
  .search-results .res.sel{background:var(--panel2);}

  .search-empty{padding:9px 12px; font-size:12px; color:var(--muted);}

  @media (hover: hover){
    .link-btn:hover{color:var(--text);}
    .icon-btn:hover{color:var(--text);}
    .foot-link:hover{color:var(--accent);}
    .mini:hover{color:var(--text); border-color:var(--muted);}
    .search-results .res:hover{background:var(--panel2);}
    .target-x:hover{color:var(--danger);}
  }

  ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;}

  .participant-row, .sorted-row{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:8px 10px;}
  .sorted-row.dragging{opacity:.45;}
  .drag-handle{cursor:grab; color:var(--muted); font-size:16px; padding:2px 6px; touch-action:none; user-select:none; flex-shrink:0;}
  .kbd{display:inline-flex; align-items:center; justify-content:center; min-width:19px; height:19px; padding:0 4px; border:1px solid var(--border); border-radius:5px; background:var(--panel); color:var(--muted); font-family:'Space Mono',monospace; font-size:11px; flex-shrink:0;}
  .participant-main{flex:1 1 110px; min-width:0; cursor:default;}
  .participant-main .nm{font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .participant-main .meta{font-size:11px; color:var(--muted); font-family:'Space Mono',monospace; margin-top:2px;}
  .ops{display:flex; gap:4px; flex-shrink:0; margin-left:auto;}
  .mini{display:inline-flex; align-items:center; justify-content:center; background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:6px; width:26px; height:26px; padding:0; cursor:pointer; font-size:13px; line-height:1; flex-shrink:0; font-family:inherit; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
  .mini.wide{width:auto; padding:6px 9px;}
  .mini:active{color:var(--text); border-color:var(--muted); background:var(--panel);}
  .edit-input{background:var(--panel); border:1px solid var(--accent); color:var(--text); border-radius:6px; padding:5px 7px; font-size:14px; font-family:inherit; width:100%;}
  .empty{color:var(--muted); font-size:13px; padding:8px 2px;}

  .cap-row{display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:10px 12px;}
  /* Fixed flex bases (not `auto`): the width of the time column and the selects must not depend on
     the text of a row ("First", the elapsed time, a date), or the selects jump from row to row. */
  .cap-mid{flex:1 1 180px; min-width:0;}
  .cap-time{font-family:'Space Mono',monospace; font-weight:700; font-size:16px;}
  .cap-delta{color:var(--muted); font-size:11px; font-family:'Space Mono',monospace;}
  .cap-delta:empty::before{content:'\00a0';}   /* a marker has no delta but keeps the row height */
  .cap-date{display:inline-block; white-space:nowrap; color:var(--muted); font-family:'IBM Plex Sans',system-ui,sans-serif; font-weight:400; font-size:11px; margin-left:6px;}
  .pending-mark{display:inline-block; white-space:nowrap; color:var(--accent); font-family:'IBM Plex Sans',system-ui,sans-serif; font-weight:400; font-size:11px; margin-left:6px;}
  .cap-side{display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:6px; flex:1 1 240px; min-width:0;}
  select.assign{flex:1 1 0; min-width:0; background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit;}
  select.assign.kind-select{flex:0 0 40%; border-left-width:4px;}
  /* Several participants on one capture (a protest, a recall): chips, and "+" to add one. */
  select.assign.add-target{flex:0 0 auto; width:4.4em; font-weight:600;}
  .target-chips{flex:1 1 10em; min-width:0; display:flex; flex-wrap:wrap; gap:4px;}
  .target-chip{display:inline-flex; align-items:center; gap:2px; max-width:100%; overflow-wrap:break-word; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:3px 2px 3px 8px; font-size:13px;}
  .target-x{background:none; border:none; color:var(--muted); font-family:inherit; font-size:11px; padding:2px 5px; cursor:pointer;}
  select.kind-select.kind-start{border-left-color:var(--kind-start);}
  select.kind-select.kind-split{border-left-color:var(--kind-split);}
  select.kind-select.kind-marker{border-left-color:var(--kind-marker);}
  .cap-filter{margin:8px 0 4px;}
  .rank{color:var(--muted); font-size:12px; font-family:'Space Mono',monospace; width:26px; text-align:right; flex:0 0 auto;}
  #importFile{display:none;}
  /* Borderless icon buttons: panel headers and the clock's pin. */
  .icon-btn{display:inline-flex; align-items:center; justify-content:center; background:none; border:none; border-radius:8px;
    padding:4px 6px; color:var(--muted); font-size:19px; line-height:1; cursor:pointer; font-family:inherit;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
  .icon-btn:active{color:var(--text);}
  /* The clock's tool buttons share one box. The pin is an inline SVG in the text colour, sized
     like the ⚑ glyph next to it (an emoji draws far larger, and no text pushpin is reliable). */
  .clock-tools .icon-btn{min-width:30px; min-height:30px;}
  /* Shifted down to the optical centre of the ⚑ glyph, whose ink sits low in its line box. */
  .pin-btn svg{width:.8em; height:.8em; display:block; position:relative; top:.1em;}
  /* Muted like the other icon buttons while inactive, in the accent colour while pinned. */
  .pin-btn.on, .pin-btn.on:active{color:var(--accent);}

  /* ---------- touch devices: roomier hit targets (~44 px, WCAG 2.5.5) ---------- */
  @media (hover: none) and (pointer: coarse){
    .link-btn{padding:10px 12px; font-size:14px;}
    /* No hardware keyboard: the hints only take room. They live in the shortcuts dialog. */
    .clock-card .hint-line{display:none;}
    /* No modifier key to press here, so the footer link invites a tap instead. */
    #footShortcutsKey{display:none;}
    .footer-shortcuts .touch-only{display:inline;}
    .icon-btn{padding:9px 11px; font-size:22px;}
    .clock-tools .icon-btn{min-width:44px; min-height:42px;}
    /* iOS zooms into any focused field whose text is smaller than 16px, which enlarges the
       layout and pushes controls out of view. Nothing focusable may be below that here. */
    input, select, textarea, .input, .edit-input, select.assign{font-size:16px;}
    .title-input{font-size:17px;}   /* the rule above must not shrink it */
    .mini{width:42px; height:42px; font-size:17px; border-radius:9px;}
    .mini.wide{width:auto; min-width:42px; padding:0 13px;}
    .ops{gap:6px;}
    .participant-row, .sorted-row{gap:6px; padding:7px 8px;}
    .drag-handle{font-size:20px; padding:9px 7px;}
    .participant-main{padding:2px 0;}
    .seg button{padding:10px 14px; font-size:13px;}
    .btn.small{padding:11px 14px; font-size:14px;}
    select.assign{padding:11px 10px;}
    .target-x{padding:10px 10px;}
    .member-opt{padding:10px 4px;}
    .search-results .res{padding:13px 12px;}
    .cap-side{gap:8px;}
    .kind-pick{padding:12px 10px; font-size:15px;}
    .kind-opt .link-btn{font-size:13px;}
    /* The wider buttons need more room in the fixed left column. */
    @media (min-width:700px){
      .app{grid-template-columns:minmax(0,360px) minmax(0,1fr);}
    }
  }

  /* Actions that need a live server connection (normal) or are blocked in archived races (all). */
  body.lock-normal [data-edit="normal"], body.lock-all [data-edit]{opacity:.4; pointer-events:none;}

  /* Without a station this device has no approaching list. */
  body.no-workset .sorted-panel{display:none;}
  body.no-workset .app{grid-template-areas:"clock" "participants" "captures";}
  @media (min-width:700px){
    body.no-workset .app{grid-template-areas:"clock clock" "participants captures"; grid-template-rows:auto 1fr;}
  }

  /* An archived race records nothing any more: no clock, no sorted list. */
  body.archived .clock-card, body.archived .sorted-panel{display:none;}
  body.archived .app{grid-template-areas:"participants" "captures";}
  @media (min-width:700px){
    body.archived .app{grid-template-areas:"participants captures"; grid-template-rows:auto;}
  }

  /* ---------- settings drawer ---------- */
  .overlay{position:fixed; inset:0; background:var(--shade); z-index:60;}
  /* Shell and sliding panel: the panel slides *inside* the shell, so nothing is ever laid
     out beyond the right edge of the viewport (which iOS Safari counts as page width and
     which then made 100vw — and the drawer with it — wider than the screen). */
  .drawer{position:fixed; top:0; right:0; bottom:0; width:min(420px,100%); z-index:61;
    overflow:hidden; pointer-events:none;}
  .drawer.open{pointer-events:auto;}
  body.scroll-locked{position:fixed; left:0; right:0; width:100%;}
  .drawer-panel{height:100%; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain;
    background:var(--bg); border-left:1px solid var(--border);
    padding:calc(16px + var(--safe-top)) 16px calc(24px + env(safe-area-inset-bottom,0px));
    transform:translateX(100%); transition:transform .22s ease;}
  .drawer.open .drawer-panel{transform:none;}
  .drawer-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .drawer-head h2{margin:0; font-size:16px; font-weight:600;}
  .drawer section{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px;}
  .drawer h3{margin:0 0 10px; font-size:13px; font-weight:600;}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:10px;}
  .field label{font-size:12px; color:var(--muted);}
  .code-input{font-family:'Space Mono',monospace; text-transform:uppercase; letter-spacing:1px;}
  #recentList{display:flex; flex-direction:column; gap:6px;}
  .recent-row{display:flex; align-items:center; gap:6px;}
  .recent-item{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex:1 1 auto; min-width:0; text-align:left;}
  .recent-item .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #recentList .recent-more{align-self:flex-start; margin-top:0;}
  .recent-item .meta{color:var(--muted); font-size:12px; font-family:'Space Mono',monospace; white-space:nowrap;}
  .row{display:flex; gap:8px; align-items:center;}
  .row .input{flex:1;}
  .help{font-size:12px; color:var(--muted); margin:6px 0 0; line-height:1.45; overflow-wrap:anywhere;}
  .error-text{font-size:12px; color:var(--danger); margin-top:8px;}
  .divider{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; margin:12px 0;}
  .divider::before, .divider::after{content:''; flex:1; height:1px; background:var(--border);}
  details.advanced{margin-top:14px;}
  details.advanced summary{cursor:pointer; font-size:12px; color:var(--muted);}
  details.advanced .field{margin-top:10px;}
  .status-line{display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:12px;}
  .status-line .help{margin:0;}
  .link-out{font-size:13px; color:var(--accent); word-break:break-all;}
  .action{margin-top:12px;}
  .action:first-of-type{margin-top:0;}
  .kind-list{margin-bottom:10px;}
  .kind-row{display:flex; gap:6px; align-items:center;}
  .kind-row .input{flex:1 1 auto; min-width:0; padding:8px 10px;}
  .kind-row .input.kind-role, .input.kind-role{flex:0 0 auto; width:auto; padding:8px 6px;}
  .kind-add{flex-wrap:wrap;}
  .kind-add #kindNameInput{flex:1 1 100%;}
  .kind-add .kind-role{flex:1 1 auto;}
  .kind-suggest{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12px; color:var(--muted);}
  .ws-row{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .ws-sub{flex:1 1 100%; display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; padding-left:32px; font-size:11px; color:var(--muted);}
  .ws-sub .ws-code{font-family:'Space Mono',monospace; color:var(--text); letter-spacing:.5px;}
  .ws-sub .link-btn{margin:0; padding:0; font-size:11px;}
  .station-picks{display:flex; flex-direction:column; gap:8px;}
  /* A basis, not 100 %: the row wraps (for its second line), and the name must share the first. */
  .ws-row .input{flex:1 1 120px; width:auto; min-width:0; padding:8px 10px;}
  .ws-row .ws-none{flex:1 1 auto; font-size:13px; color:var(--muted);}
  .ws-pick.on{color:var(--accent); border-color:var(--accent);}
  #addWorksetBtn{margin-top:0;}

  /* ---------- dialog ---------- */
  .modal-backdrop{position:fixed; inset:0; background:var(--shade); z-index:80; display:flex; align-items:center; justify-content:center; padding:16px; overflow-y:auto; overscroll-behavior:contain;}
  .modal{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; max-width:440px; width:100%; max-height:calc(100vh - 32px); overflow-y:auto;}
  .modal h3{margin:0 0 8px; font-size:16px;}
  .modal-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .modal-head h3{margin:0 0 12px;}
  .shortcut-list{margin:0; gap:10px;}
  .shortcut-list li{display:flex; align-items:center; gap:10px; font-size:13px;}
  .shortcut-list .keys{display:inline-flex; align-items:center; gap:4px; flex:0 0 84px;}
  .modal p{margin:0 0 16px; font-size:14px; line-height:1.5;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap;}
  /* Groups: settings blocks per group type, the members dialog, tags on participant rows. */
  .group-type{border:1px solid var(--border); border-radius:10px; padding:8px; margin-bottom:10px; display:flex; flex-direction:column; gap:6px;}
  .group-type-head{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .group-type-head .input{flex:1 1 8em; min-width:0;}
  .group-type-head h4{margin:0; flex:1; font-size:13px; color:var(--muted); font-weight:600;}
  .excl{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); white-space:nowrap;}
  .group-row{display:flex; gap:6px; align-items:center; padding-left:10px;}
  .group-row .input{flex:1 1 0; min-width:0;}
  .group-row .link-btn{margin:0; white-space:nowrap; font-size:12px;}
  .group-type > .link-btn{margin:0; align-self:flex-start; font-size:12px;}
  #membersSearch{width:100%; margin:0 0 10px;}
  .members-list{display:flex; flex-direction:column; gap:2px; max-height:50vh; overflow-y:auto; margin-bottom:14px;}
  .members-list h4{margin:8px 0 4px; font-size:12px; color:var(--muted); font-weight:600;}
  .member-opt{display:flex; align-items:center; gap:8px; padding:6px 4px; border-radius:6px; font-size:14px; cursor:pointer;}
  .member-opt .hint{color:var(--muted); font-size:12px;}
  .member-opt.disabled{opacity:.5; cursor:default;}
  .group-tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:3px;}
  .group-tag{font-size:11px; color:var(--muted); border:1px solid var(--border); border-radius:6px; padding:0 5px;}
  .target-chip.is-group{border-style:dashed;}
  .group-filter{width:100%;}

  .site-footer{margin-top:28px; text-align:center; color:var(--muted); font-size:12px; line-height:1.8;}
  .site-footer p{margin:0;}
  .touch-only{display:none;}
  .foot-link{background:none; border:none; padding:0; font:inherit; color:var(--text); text-decoration:underline; text-underline-offset:3px; cursor:pointer;}

  .toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--panel); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:90; max-width:90vw; text-align:center;}
  .toast.show{opacity:1;}

  @media (prefers-reduced-motion: reduce){
    .dot.connecting{animation:none;}
    .drawer-panel{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div>
      <div class="title-row">
        <h1 id="raceTitle"></h1>
        <button class="mini" id="renameRaceBtn" data-edit="normal" data-perm="race.rename" data-i18n-title="header.rename">✎</button>
      </div>
      <div class="sub" data-i18n="header.subtitle"></div>
    </div>
    <div class="top-actions">
      <div class="history-btns" id="historyBtns" hidden>
        <button class="history-btn" id="undoBtn" type="button" data-edit="critical" disabled>↶</button>
        <button class="history-btn" id="redoBtn" type="button" data-edit="critical" disabled>↷</button>
      </div>
      <button class="status-pill" id="statusPill" type="button"><span class="dot" id="statusDot"></span><span id="statusText"></span></button>
      <button class="status-pill" id="stationPill" type="button" data-i18n-title="worksets.pillTitle" hidden><span id="stationText"></span></button>
      <button class="settings-btn" id="settingsBtn" type="button">⚙ <span data-i18n="settings.title"></span></button>
    </div>
  </header>

  <div class="banner" id="archivedBanner" data-i18n="archived.banner" hidden></div>
  <div class="banner" id="outdatedBanner" role="alert" hidden><span id="outdatedText"></span> <button class="link-btn" id="outdatedReload" type="button" data-i18n="outdated.reload"></button></div>

  <div class="app">
    <div class="clock-card">
      <div class="clock-tools">
        <button class="icon-btn" id="kindMenuBtn" type="button" data-edit="critical" data-i18n-title="kinds.menu" aria-haspopup="menu" aria-expanded="false" aria-controls="kindMenu">⚑</button>
        <button class="icon-btn pin-btn" id="pinClockBtn"><svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><g transform="rotate(45 8 8)"><rect x="4.5" y="0" width="7" height="2.2" rx="1.1"/><path d="M5.8 2.2h4.4l.9 5.4H4.9z"/><rect x="2.6" y="7.4" width="10.8" height="2" rx="1"/><path d="M7.3 9.4h1.4L8 16z"/></g></svg></button>
      </div>
      <div class="kind-menu" id="kindMenu" role="menu" hidden></div>
      <div class="clock" id="clock">00:00:00<span class="cs">.00</span></div>
      <div class="date" id="dateLine"></div>
      <div><div class="seg kind-seg" id="kindSeg" role="radiogroup" data-edit="critical" data-i18n-title="kinds.segHint" hidden></div></div>
      <button class="capture-btn" id="captureBtn" data-edit="critical"></button>
      <div class="ws-notice" id="recordBlocked" hidden>
        <span data-i18n="worksets.chooseToRecord"></span>
        <span id="recordBlockedPicks"></span>
      </div>
      <div class="kind-note" id="kindOnceNote" hidden><span id="kindOnceText"></span> <button class="link-btn" id="kindOnceCancel" data-i18n="kinds.onceCancel"></button></div>
      <div id="captureFreeRow"><button class="link-btn" id="captureFreeBtn" data-edit="critical" data-i18n="clock.captureFree"></button></div>
      <div class="hint-line" id="clockHints">
        <span class="hint-pair"><span class="kbd">␣</span><span id="hintSpace"></span></span>
        <span class="hint-pair" id="hintDirect"><span class="kbd">1–9</span><span data-i18n="clock.hintDirect"></span></span>
        <span class="hint-pair" id="hintFree"><span class="kbd">0</span><span data-i18n="clock.hintFree"></span></span>
      </div>
      <div class="ws-notice" id="worksetNotice" role="status" hidden>
        <span id="worksetNoticeText"></span>
        <span id="worksetNoticePicks"></span>
        <button class="mini" id="worksetNoticeClose" type="button" data-i18n-title="dialog.close">✕</button>
      </div>
    </div>

    <div class="panel sorted-panel">
      <div class="panel-head">
        <h2><span id="sortedTitle"></span> <span class="count" id="sortedCount">0</span></h2>
      </div>
      <div class="hint-line" data-i18n="sorted.hint"></div>
      <div class="search-wrap" data-edit="critical">
        <input class="input" id="rankSearch" type="text" data-i18n-placeholder="sorted.search" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="rankSearchResults">
        <div class="search-results" id="rankSearchResults" role="listbox" hidden></div>
      </div>
      <ul id="sortedList"></ul>
      <div class="empty" id="sortedEmpty" data-i18n="sorted.empty"></div>
    </div>

    <div class="panel participants-panel">
      <div class="panel-head">
        <h2><span data-i18n="participants.title"></span> <span class="count" id="participantCount">0</span></h2>
        <button class="icon-btn" id="groupsBtn" type="button" data-perm="group.add" data-i18n-title="groups.manage">⧉</button>
        <button class="icon-btn" id="importBtn" data-edit="normal" data-perm="participant.add" data-i18n-title="participants.import">↥</button>
        <input type="file" id="importFile" accept=".csv,text/csv,text/plain">
      </div>
      <div class="hint-line" data-i18n="participants.hint"></div>
      <div class="toolbar">
        <div class="seg" id="filterSeg">
          <button data-f="all" data-i18n="filter.all"></button>
          <button data-f="open" data-i18n="filter.open"></button>
          <button data-f="hideSorted" data-i18n="filter.hideSorted"></button>
        </div>
      </div>
      <div class="toolbar" id="groupFilterBar" hidden>
        <select class="input group-filter" id="groupFilter" data-i18n-title="groups.filterLabel"></select>
      </div>
      <div class="toolbar">
        <div class="seg" id="sortFieldSeg">
          <button data-sf="manual" data-i18n="sort.manual"></button>
          <button data-sf="alpha" data-i18n="sort.alpha"></button>
          <button data-sf="time" data-i18n="sort.time"></button>
          <button data-sf="elapsed" data-i18n="sort.elapsed" hidden></button>
        </div>
        <button class="mini wide" id="sortDirBtn" data-i18n-title="sort.dir">↑</button>
      </div>
      <div class="add-row" data-edit="normal" data-perm="participant.add">
        <input class="input" id="participantInput" type="text" data-i18n-placeholder="participants.placeholder" maxlength="60">
        <button class="btn" id="addParticipantBtn" data-i18n="participants.add"></button>
      </div>
      <ul id="participantList"></ul>
      <div class="empty" id="participantEmpty"></div>
    </div>

    <div class="panel captures-panel">
      <div class="panel-head">
        <h2><span id="capTitle"></span> <span class="count" id="capCount">0</span></h2>
        <button class="icon-btn" id="exportBtn" data-i18n-title="captures.export">↧</button>
      </div>
      <div class="seg cap-filter" id="capFilterSeg" hidden></div>
      <ul id="capList" style="margin-top:12px;"></ul>
      <div class="empty" id="capEmpty" data-i18n="captures.empty"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p class="footer-shortcuts"><button class="foot-link" id="footShortcutsBtn">
      <span id="footShortcutsKey"></span><span class="touch-only" data-i18n="footer.shortcutsTouch"></span>
    </button></p>
    <p>
      <span data-i18n="footer.made"></span> ·
      <a class="foot-link" href="https://github.com/j-mastr/zeitnah.app-timer" target="_blank" rel="noopener noreferrer" data-i18n="footer.star"></a>
    </p>
  </footer>
</div>

<!-- ---------- settings drawer ---------- -->
<div class="overlay" id="drawerOverlay" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" inert>
 <div class="drawer-panel">
  <div class="drawer-head">
    <h2 id="drawerTitle" data-i18n="settings.title"></h2>
    <button class="mini" id="drawerClose" data-i18n-title="settings.close">✕</button>
  </div>

  <section>
    <h3 data-i18n="settings.language"></h3>
    <div class="seg" id="langSeg">
      <button data-lang="de">Deutsch</button>
      <button data-lang="en">English</button>
    </div>
  </section>

  <section data-perm="race.setSport">
    <h3 data-i18n="settings.sport"></h3>
    <select class="input" id="sportSelect" data-edit="normal"></select>
  </section>

  <section id="kindsSection">
    <h3 data-i18n="kinds.title"></h3>
    <p class="help" id="kindsHelp" style="margin:0 0 10px;"></p>
    <ul class="kind-list" id="kindList"></ul>
    <div class="add-row kind-add" data-edit="normal" data-perm="kind.add">
      <input class="input" id="kindNameInput" type="text" maxlength="40" autocomplete="off" data-i18n-placeholder="kinds.placeholder">
      <select class="input kind-role" id="kindRoleSelect" data-i18n-title="kinds.role"></select>
      <button class="btn" id="addKindBtn" data-i18n="kinds.add"></button>
    </div>
    <div class="kind-suggest" id="kindSuggest" data-edit="normal" data-perm="kind.add"></div>
    <p class="help" data-i18n="kinds.roleHelp"></p>
  </section>

  <section id="groupsSection">
    <h3 data-i18n="groups.title"></h3>
    <p class="help" data-i18n="groups.help" style="margin:0 0 10px;"></p>
    <div id="groupTypeList"></div>
    <div class="add-row kind-add" data-edit="normal" data-perm="groupType.add">
      <input class="input" id="groupTypeInput" type="text" maxlength="40" autocomplete="off" data-i18n-placeholder="groups.typePlaceholder">
      <button class="btn" id="addGroupTypeBtn" data-i18n="groups.addType"></button>
    </div>
    <div class="kind-suggest" id="groupSuggest" data-edit="normal" data-perm="groupType.add"></div>
  </section>

  <section id="worksetsSection" hidden>
    <h3 data-i18n="worksets.title"></h3>
    <p class="help" id="worksetsHelp" data-i18n="worksets.help" style="margin:0 0 10px;"></p>
    <ul class="kind-list" id="worksetList"></ul>
    <button class="link-btn" id="addWorksetBtn" type="button" data-edit="critical" data-perm="workset.add" data-i18n="worksets.add"></button>
  </section>


  <!-- local storage backend -->
  <div id="localSection">
    <section>
      <div class="status-line"><span class="dot"></span><strong data-i18n="status.local"></strong></div>
      <p class="help" data-i18n="settings.localInfo" style="margin:0 0 14px;"></p>
      <div class="field">
        <label for="codeInput" data-i18n="settings.code"></label>
        <div class="row">
          <input class="input code-input" id="codeInput" type="text" maxlength="16" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123">
          <button class="btn primary" id="connectBtn" data-i18n="settings.connect"></button>
        </div>
      </div>
      <div class="field" id="recentField" hidden>
        <label data-i18n="settings.recent"></label>
        <div id="recentList"></div>
      </div>
      <div class="divider" data-i18n="settings.or"></div>
      <button class="btn block" id="createBtn" data-i18n="settings.create"></button>
      <div class="error-text" id="connectError" hidden></div>
      <details class="advanced" id="advancedLocal">
        <summary data-i18n="settings.advanced"></summary>
        <div class="field">
          <label for="serverUrlInput" data-i18n="settings.serverUrl"></label>
          <input class="input" id="serverUrlInput" type="url" autocomplete="url" spellcheck="false">
          <p class="help" id="serverUrlHelp"></p>
        </div>
      </details>
    </section>
    <section>
      <button class="btn danger block" id="resetLocalBtn" data-i18n="settings.reset"></button>
      <p class="help" data-i18n="settings.resetHint"></p>
    </section>
  </div>

  <!-- server backend -->
  <div id="serverSection" hidden>
    <section>
      <div class="status-line"><span class="dot" id="srvDot"></span><strong id="srvStatus"></strong></div>
      <p class="help" id="srvDetail" style="margin:-6px 0 12px;"></p>
      <div class="field">
        <label for="srvCode" data-i18n="settings.code"></label>
        <input class="input code-input" id="srvCode" type="text" readonly>
      </div>
      <div class="field">
        <label data-i18n="settings.link"></label>
        <div class="row">
          <a class="link-out" id="srvLink" target="_blank" rel="noopener"></a>
          <button class="btn small" id="copyLinkBtn" data-i18n="settings.copy"></button>
        </div>
      </div>
      <details class="advanced">
        <summary data-i18n="settings.advanced"></summary>
        <div class="field">
          <label for="srvUrl" data-i18n="settings.serverUrl"></label>
          <input class="input" id="srvUrl" type="text" readonly>
        </div>
      </details>
      <div class="action">
        <button class="btn block" id="disconnectBtn" data-i18n="settings.disconnect"></button>
        <p class="help" data-i18n="settings.disconnectHint"></p>
      </div>
    </section>
    <section>
      <h3 data-i18n="settings.sync"></h3>
      <div class="action" data-perm="race.merge">
        <button class="btn block" id="mergeBtn" data-i18n="settings.merge"></button>
        <p class="help" id="mergeHelp"></p>
      </div>
      <div class="action">
        <button class="btn block" id="pullBtn" data-i18n="settings.pull"></button>
        <p class="help" data-i18n="settings.pullHint"></p>
      </div>
    </section>
    <section data-perm="race.archive">
      <div id="archiveAction">
        <button class="btn danger block" id="archiveBtn" data-i18n="settings.archive"></button>
        <p class="help" data-i18n="settings.archiveHint"></p>
      </div>
      <p class="help" id="archivedInfo" data-i18n="archived.banner" style="margin:0;" hidden></p>
    </section>
  </div>

  <div class="action"><button class="link-btn" id="showShortcutsBtn" data-i18n="shortcuts.show"></button></div>
 </div>
</aside>

<!-- ---------- shortcuts dialog ---------- -->
<div class="modal-backdrop" id="shortcuts" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="shortcutsTitle">
    <div class="modal-head">
      <h3 id="shortcutsTitle" data-i18n="shortcuts.title"></h3>
      <button class="mini" id="shortcutsClose" data-i18n-title="dialog.close">✕</button>
    </div>
    <ul class="shortcut-list">
      <li><span class="keys"><span class="kbd">␣</span></span><span data-i18n="clock.hintNext"></span></li>
      <li><span class="keys"><span class="kbd">1</span>–<span class="kbd">9</span></span><span data-i18n="clock.hintDirect"></span></li>
      <li><span class="keys"><span class="kbd">0</span></span><span data-i18n="clock.hintFree"></span></li>
      <li><span class="keys"><span class="kbd">K</span></span><span data-i18n="shortcuts.kind"></span></li>
      <li><span class="keys"><span class="kbd">⇧</span><span class="kbd">K</span></span><span data-i18n="shortcuts.kindOnce"></span></li>
      <li><span class="keys"><span class="kbd">F</span></span><span data-i18n="shortcuts.focusSearch"></span></li>
      <li><span class="keys"><span class="kbd">N</span></span><span data-i18n="shortcuts.focusAdd"></span></li>
      <li><span class="keys"><span class="kbd">A</span></span><span data-i18n="shortcuts.filterAll"></span></li>
      <li><span class="keys"><span class="kbd">O</span></span><span data-i18n="shortcuts.filterOpen"></span></li>
      <li><span class="keys"><span class="kbd">H</span></span><span data-i18n="shortcuts.filterHide"></span></li>

// =====================================================================
// Browser storage
// =====================================================================
const KEYS = {
  local: 'zeitnah.local',
  prefs: 'zeitnah.prefs',
  connection: 'zeitnah.connection',
  recent: 'zeitnah.recent',
  cachePrefix: 'zeitnah.cache:',
  worksetPrefix: 'zeitnah.workset:',
};
// Keys used by earlier versions; their data is migrated on load (see migrateLegacyStorage).
const LEGACY_SINGLE_KEY = 'segel-zielzeit-v1';
const LEGACY_PREFIX = 'regatta-timer.';

function readJson(key){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function writeJson(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}
function removeKey(key){
  try{ localStorage.removeItem(key); }catch(e){}
}

/*
 * One-time migration of data written by earlier versions:
 *  - 'segel-zielzeit-v1': a single key holding state and preferences
 *  - 'regatta-timer.*':   same layout as today under another prefix
 * Both used sailing field names (boats/boatId); normalizeState() converts those.
 * Server caches are not migrated: they are rebuilt from the server.
 */
(function migrateLegacyStorage(){
  const single = readJson(LEGACY_SINGLE_KEY);
  if(single){
    if(!readJson(KEYS.local)){
      // Earlier versions only supported sailing; keep that vocabulary for migrated data.
      writeJson(KEYS.local, normalizeState({boats:single.boats, ranking:single.ranking, captures:single.captures, sport:'sailing'}));
    }
    if(!readJson(KEYS.prefs)){
      writeJson(KEYS.prefs, {
        filterOpen: single.filterOpen !== undefined ? !!single.filterOpen : single.listFilter === 'open',
        filterHideSorted: single.filterHideSorted !== undefined ? !!single.filterHideSorted
          : (single.showSortedInList === undefined ? false : !single.showSortedInList),
        sortField: single.sortField || (single.boatSortAlpha ? 'alpha' : 'manual'),
        sortDir: single.sortDir === 'desc' ? 'desc' : 'asc',
      });
    }
    removeKey(LEGACY_SINGLE_KEY);
  }
  for(const name of ['local', 'prefs', 'connection']){
    const old = readJson(LEGACY_PREFIX + name);
    if(old === null) continue;
    if(readJson(KEYS[name]) === null){
      // Earlier versions only supported sailing; keep that vocabulary for migrated data.
      writeJson(KEYS[name], name === 'local' ? normalizeState(Object.assign({sport:'sailing'}, old)) : old);
    }
    removeKey(LEGACY_PREFIX + name);
  }
  try{
    Object.keys(localStorage).filter(k => k.startsWith(LEGACY_PREFIX + 'cache:')).forEach(removeKey);
  }catch(e){}
})();

// Per-device preferences (never synced).
const prefs = Object.assign(
  {lang:null, filterOpen:false, filterHideSorted:false, sortField:'manual', sortDir:'asc', serverUrl:null, pinClock:true, captureFilter:'all', groupFilter:''},
  readJson(KEYS.prefs) || {}
);
if(!['manual','alpha','time','elapsed'].includes(prefs.sortField)) prefs.sortField = 'manual';
if(typeof prefs.captureFilter !== 'string') prefs.captureFilter = 'all';
if(prefs.lang !== 'de' && prefs.lang !== 'en'){
  prefs.lang = (navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en';
}
function savePrefs(){ writeJson(KEYS.prefs, prefs); }

/** The active sport text set: state.sport once a race is loaded, 'generic' before that. */
function currentSport(){
  const sport = backend ? S().sport : null;
  return TEXTS[sport] ? sport : 'generic';
}
function t(key, vars){
  const lookup = (lang) => {
    const sport = TEXTS[currentSport()][lang], common = TEXTS.common[lang];
    return (sport && sport[key] !== undefined) ? sport[key] : (common ? common[key] : undefined);
  };
  let s = lookup(prefs.lang);
  if(s === undefined) s = lookup('de');
  if(s === undefined) s = key;
  if(vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
  return s;
}
function locale(){ return prefs.lang === 'de' ? 'de-DE' : 'en-GB'; }

// =====================================================================
// Race state and operations
// =====================================================================
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
function clone(v){ return JSON.parse(JSON.stringify(v)); }
function emptyState(){

      const kind = reqCaptureKind(op.kind);
      const w = findWorkset(s, id);
      if(w && isKnownKind(s, kind)) w.captureKind = kind;
      return s;
    }
    case 'workset.ranking.add': {
      const w = findWorkset(s, reqId(op.worksetId, 'workset_id'));
      const id = reqId(op.participantId, 'participant_id');
      if(w && findParticipant(s, id) && !w.ranking.includes(id)) w.ranking.push(id);
      return s;
    }
    case 'workset.ranking.remove': {
      const w = findWorkset(s, reqId(op.worksetId, 'workset_id'));
      const id = reqId(op.participantId, 'participant_id');
      if(w) w.ranking = w.ranking.filter(x => x !== id);
      return s;
    }
    case 'workset.ranking.move': {
      const w = findWorkset(s, reqId(op.worksetId, 'workset_id'));
      const id = reqId(op.participantId, 'participant_id');
      const before = optId(op.beforeId, 'before_id');
      if(!w || !w.ranking.includes(id)) return s;
      const ranking = w.ranking.filter(x => x !== id);
      const pos = (before === null || before === id) ? -1 : ranking.indexOf(before);
      if(pos < 0) ranking.push(id); else ranking.splice(pos, 0, id);
      w.ranking = ranking;
      return s;
    }
    case 'state.merge': {
      let src = op.state;
      if(!src || typeof src !== 'object') throw new OpError('invalid_state');
      // A state of an earlier schema version is migrated first (no version = 1).
      const version = schemaOf(src);
      if(!Number.isInteger(version) || version < 1 || version > SCHEMA_VERSION) throw new OpError('invalid_schema');
      src = runMigrations(src, version);
      const participants = src.participants || [], kinds = src.kinds || [], worksets = src.worksets || [], captures = src.captures || [];
      const groupTypes = src.groupTypes === undefined || src.groupTypes === null ? [] : src.groupTypes;
      const groups = src.groups === undefined || src.groups === null ? [] : src.groups;
      if(!Array.isArray(participants) || !Array.isArray(kinds) || !Array.isArray(worksets) || !Array.isArray(captures)
        || !Array.isArray(groupTypes) || !Array.isArray(groups)
        || participants.length > 5000 || kinds.length > 500 || worksets.length > 500 || captures.length > 20000
        || groupTypes.length > 500 || groups.length > 5000) throw new OpError('invalid_state');
      const idMap = new Map();
      for(const b of participants){
        const id = reqId(b && b.id, 'participant_id');
        const name = reqName(b && b.name, 60, 'participant_name');
        let target = findParticipant(s, id) || findParticipantByName(s, name);
        if(!target){ target = {id, name}; s.participants.push(target); }
        idMap.set(id, target.id);
      }
      // Custom kinds are matched by id or (case-insensitive) name, like participants.
      const kindMap = new Map();
      for(const raw of kinds){
        const k = reqCustomKind(raw);
        let target = findKind(s, k.id) || findKindByName(s, k.name);
        if(!target){ target = k; s.kinds.push(k); }
        kindMap.set(k.id, target.id);
      }
      // Worksets: a new one keeps its kind and gets the next number; an existing one keeps
      // its kind, and only its ranking is extended.
      const worksetMap = new Map();
      for(const raw of worksets){
        if(!raw || typeof raw !== 'object') throw new OpError('invalid_workset');
        const id = reqId(raw.id, 'workset_id');
        const name = optName(raw.name, 40, 'workset_name');
        const ranking = reqRankingList(raw.ranking);
        let kind = reqCaptureKind(raw.captureKind);
        let target = findWorkset(s, id) || (name !== null ? findWorksetByName(s, name) : undefined);
        if(!target){
          if(kindMap.has(kind)) kind = kindMap.get(kind);
          target = {id, number: nextWorksetNumber(s), name, ranking: [], captureKind: isKnownKind(s, kind) ? kind : DEFAULT_KIND};
          s.worksets.push(target);
        }
        worksetMap.set(id, target.id);
        for(const pid of ranking){
          const mapped = idMap.get(pid);
          if(mapped !== undefined && !target.ranking.includes(mapped)) target.ranking.push(mapped);
        }
      }
      // Group types are matched by id or name; groups by id or by (type, name). Their members
      // are united, once every group exists, mapped like everything else.
      const typeMap = new Map();
      for(const raw of groupTypes){
        const x = reqGroupType(raw);
        let target = findGroupType(s, x.id) || findGroupTypeByName(s, x.name);
        if(!target){ target = x; s.groupTypes.push(x); }
        typeMap.set(x.id, target.id);
      }
      const groupMap = new Map(), sourceMembers = new Map();
      for(const g of groups){
        if(!g || typeof g !== 'object') throw new OpError('invalid_group');
        const id = reqId(g.id, 'group_id');
        let typeId = optId(g.typeId, 'group_type_id');
        const name = reqName(g.name, 40, 'group_name');
        sourceMembers.set(id, reqMembers(g.members === undefined || g.members === null ? [] : g.members));
        typeId = typeId === null ? null : (typeMap.has(typeId) ? typeMap.get(typeId) : (findGroupType(s, typeId) ? typeId : null));
        let target = findGroup(s, id) || findGroupByName(s, typeId, name);
        if(!target){ target = {id, typeId, name, members:[]}; s.groups.push(target); }
        groupMap.set(id, target.id);
      }
      const mapRef = (r) => {
        const map = r.type === 'group' ? groupMap : idMap;
        return map.has(r.id) ? {type:r.type, id:map.get(r.id)} : null;
      };
      for(const [id, members] of sourceMembers) addMembers(s, groupMap.get(id), members.map(mapRef).filter(Boolean));
      for(const c of captures){
        if(!c || typeof c !== 'object') throw new OpError('invalid_capture');
        const id = reqId(c.id, 'capture_id');
        const ts = reqTs(c.ts);
        const tzOffset = optTzOffset(c.tzOffset);
        const targets = reqTargets(c.targets === undefined || c.targets === null ? [] : c.targets);
        const kind = reqCaptureKind(c.kind);
        const wid = optId(c.worksetId, 'workset_id');
        if(findCapture(s, id)) continue;
        // Targets are mapped to what they were matched with; unknown ones are dropped.
        const mapped = [];
        for(const t of targets){
          const ref = mapRef(t);
          if(ref !== null && !mapped.some(x => sameTarget(x, ref))) mapped.push(ref);
        }
        s.captures.push({id, ts, tzOffset, targets: mapped,
          kind: kindMap.has(kind) ? kindMap.get(kind) : kind,
          worksetId: wid !== null && worksetMap.has(wid) ? worksetMap.get(wid) : wid});
      }
      if(s.name === null && typeof src.name === 'string' && cleanText(src.name) !== '') s.name = reqName(src.name, 80, 'name');
      if(src.sport !== undefined && src.sport !== null){
        if(typeof src.sport !== 'string' || !SPORTS.includes(src.sport)) throw new OpError('invalid_sport');
        // Only fills in a sport the race hasn't chosen yet (it still has the default).
        if(s.sport === DEFAULT_SPORT) s.sport = src.sport;
      }
      return s;
    }
    default:
      throw new OpError('unknown_type');
  }
}

// Operations that stay possible without a server connection: they are buffered and sent later.
const OFFLINE_OPS = new Set(['capture.add', 'capture.assign', 'capture.delete', 'capture.setKind', 'capture.target.add', 'capture.target.remove',
  'workset.add', 'workset.setKind', 'workset.ranking.add', 'workset.ranking.remove', 'workset.ranking.move']);

// =====================================================================
// Access rules
// =====================================================================
/*
 * Mirror of App\Access\Permissions (PHP), line by line; tests/access-parity.mjs keeps both
 * identical. A permission is a path of [name, id|null] segments (`workset[w1].ranking.add`);
 * a rule grants a path pattern, `revoke:` in front takes it away (a revoke always wins).
 * A segment without an id matches every id, `*` one segment or, last, everything after it.
 * The server enforces the rules; the client only hides and blocks what would be refused.
 */
const FULL_ACCESS = ['*'];
const RULE_SEGMENT_RE = /^([A-Za-z]+)(?:\[([A-Za-z0-9_-]{1,40})\])?$/;
const parsedRules = new Map();
function parseRule(path){
  if(parsedRules.has(path)) return parsedRules.get(path);
  let segments = [];
  for(const segment of path.split('.')){
    const m = RULE_SEGMENT_RE.exec(segment);
    if(segment === '*') segments.push(['*', null]);
    else if(m) segments.push([m[1], m[2] !== undefined ? m[2] : null]);
    else{ segments = null; break; }
  }
  parsedRules.set(path, segments);
  return segments;
}
function ruleMatches(rule, path){
  const last = rule.length - 1;
  for(let i = 0; i < rule.length; i++){
    const [name, id] = rule[i];
    if(path[i] === undefined) return false;
    if(name === '*'){
      if(i === last) return true;
      continue;
    }
    if(path[i][0] !== name || (id !== null && path[i][1] !== id)) return false;
  }
  return rule.length === path.length;
}
function rulesAllow(rules, path){
  let granted = false;
  for(const rule of rules){
    if(typeof rule !== 'string') continue;
    const revoke = rule.startsWith('revoke:');
    const parsed = parseRule(revoke ? rule.slice(7) : rule);
    if(parsed === null || !ruleMatches(parsed, path)) continue;
    if(revoke) return false;
    granted = true;
  }
  return granted;
}
/** Whether the rules only reach particular worksets (see Permissions::restrictedToWorksets). */
function restrictedToWorksets(rules){
  if(rulesAllow(rules, [['workset', ''], ['view', null]])) return false;
  return rules.some(rule => {
    if(typeof rule !== 'string' || rule.startsWith('revoke:')) return false;
    const parsed = parseRule(rule);
    return parsed !== null && parsed[0][0] === 'workset' && parsed[0][1] !== null;
  });
}
const worksetSegment = (id) => ['workset', typeof id === 'string' ? id : ''];
/** Path prefix of a capture: `workset[w1].capture`, or `capture` without a workset. */
function captureScope(worksetId){
  return worksetId === null || worksetId === undefined ? [['capture', null]] : [worksetSegment(worksetId), ['capture', null]];
}
/** The permission an operation needs, or null when it needs none (see Permissions::operationPath). */
function operationPath(s, op){
  const type = typeof op.type === 'string' ? op.type : '';
  const parts = type.split('.');
  switch(type){
    case 'race.rename': case 'race.setSport': case 'race.archive':
    case 'participant.rename': case 'participant.delete':
    case 'kind.add': case 'kind.update': case 'kind.delete':
    case 'groupType.add': case 'groupType.update': case 'groupType.delete':
    case 'group.add': case 'group.update': case 'group.delete':
    case 'workset.add':
      return [[parts[0], null], [parts[1], null]];
    case 'group.members.add': case 'group.members.remove':
      return [['group', null], ['members', null]];
    case 'participants.add':
      return [['participant', null], ['add', null]];
    case 'state.merge':
      return [['race', null], ['merge', null]];
    case 'workset.rename': case 'workset.delete': case 'workset.makeDefault': case 'workset.setKind':
    case 'workset.ranking.add': case 'workset.ranking.remove': case 'workset.ranking.move':
      return [worksetSegment(op.worksetId), ...parts.slice(1).map(p => [p, null])];
    case 'capture.add': {
      const c = op.capture && typeof op.capture === 'object' && !Array.isArray(op.capture) ? op.capture : {};
      return [...captureScope(c.worksetId === undefined ? null : c.worksetId), ['add', null]];
    }
    case 'capture.assign': case 'capture.delete': case 'capture.setKind':
    case 'capture.target.add': case 'capture.target.remove': {
      const c = (s.captures || []).find(x => x.id === op.captureId);
      // Changing a capture's targets is assigning it.
      return c ? [...captureScope(c.worksetId === undefined ? null : c.worksetId), [parts.length > 2 ? 'assign' : parts[1], null]] : null;
    }
    default:
      return null;
  }
}

// =====================================================================
// Undo / redo (per device, in memory)
// =====================================================================
/*
 * Undo sends compensating operations: before an operation is dispatched, historyEntry()
 * derives from the current state the operations that reverse it. They are ordinary
 * operations, synced like any other, so neither reducer knows about undo.
 * An entry names the parts of the state its operation touches (`parts`); the history keeps
 * their footprint before and after. Undo requires the current footprint to still be the
 * "after" one (nobody changed those parts since) and checks on a copy that its operations
 * lead back to the "before" one; redo works the other way round.
 */
// Operations that can't be undone; they clear the history instead.
const HISTORY_BARRIER_OPS = new Set(['race.archive', 'state.merge']);

function rankedNext(w, id){
  const i = w.ranking.indexOf(id);
  return i < 0 ? null : (w.ranking[i + 1] || null);
}
/*
 * Parts are [kind, id, worksetId]. Ranking parts ('ranked', 'next') and 'captureKind' belong to
 * one workset; 'workset' is the whole workset (for adding and deleting it), 'worksetName' only
 * its name and 'worksetOrder' the order of all worksets (which one is the default). 'groupType'
 * and 'group' are one of them with their position, 'groupsOfType' which groups have a type and
 * 'memberOf' (id = ref key 'type:id') which groups contain a participant or group.
 */
function footprint(s, parts){
  return JSON.stringify(parts.map(([kind, id, ws]) => {
    const w = ws === undefined ? null : findWorkset(s, ws);
    switch(kind){
      case 'name': return s.name;
      case 'sport': return s.sport;
      case 'participant': { const p = findParticipant(s, id); return p ? p.name : null; }
      case 'ranked': return w ? w.ranking.includes(id) : null;
      case 'next': return w && w.ranking.includes(id) ? (rankedNext(w, id) || '$end') : null;
      case 'capture': { const c = findCapture(s, id); return c ? [c.ts, c.tzOffset, c.targets, c.kind, c.worksetId] : null; }
      case 'captureKind': return w ? w.captureKind : null;
      case 'kind': { const k = findKind(s, id); return k ? [k.name, k.role] : null; }
      case 'workset': {
        const i = s.worksets.findIndex(x => x.id === id);
        if(i < 0) return null;
        const x = s.worksets[i];
        return [x.number, x.name, x.ranking, x.captureKind, s.worksets[i + 1] ? s.worksets[i + 1].id : null];
      }
      case 'worksetName': { const x = findWorkset(s, id); return x ? x.name : '$none'; }
      case 'worksetOrder': return s.worksets.map(x => x.id);
      case 'groupType': {
        const i = s.groupTypes.findIndex(x => x.id === id);
        return i < 0 ? null : [s.groupTypes[i].name, s.groupTypes[i].exclusive, s.groupTypes[i + 1] ? s.groupTypes[i + 1].id : null];
      }
      case 'groupsOfType': return s.groups.filter(g => g.typeId === id).map(g => g.id);
      case 'group': {
        const i = s.groups.findIndex(x => x.id === id);
        if(i < 0) return null;
        const g = s.groups[i];
        return [g.typeId, g.name, g.members, s.groups[i + 1] ? s.groups[i + 1].id : null];
      }
      // `id` is a ref key ('participant:p1'): the groups it is a member of.
      case 'memberOf': return s.groups.filter(g => g.members.some(m => m.type + ':' + m.id === id)).map(g => g.id);
    }
  }));
}
/** Operations that put a participant back into a workset's ranking at the position it has in `s`. */
function rerankOps(s, id, worksetId){
  const w = worksetId ? findWorkset(s, worksetId) : null;
  if(!id || !w || !w.ranking.includes(id)) return [];
  return [{type:'workset.ranking.add', worksetId, participantId:id},
    {type:'workset.ranking.move', worksetId, participantId:id, beforeId:rankedNext(w, id)}];
}
/**
 * Operations that put the participants among `targets` back into a workset's ranking at their
 * positions in `s` — the last one first, so the neighbour each is moved before is back already.
 */
function rerankTargetsOps(s, targets, worksetId){
  const w = worksetId ? findWorkset(s, worksetId) : null;
  if(!w) return [];
  return targets.filter(t => w.ranking.includes(t.id)).sort((a, b) => w.ranking.indexOf(b.id) - w.ranking.indexOf(a.id))
    .flatMap(t => rerankOps(s, t.id, worksetId));
}
/** Operations that put a participant or group back into the groups it is a member of in `s`. */
function memberOfOps(s, ref){
  return s.groups.filter(g => g.members.some(m => sameTarget(m, ref))).map(g => ({type:'group.members.add', groupId:g.id, refs:[ref]}));
}
/** The state after `op` on a copy of `s`, or null when it fails or changes nothing. */
function changes(s, op){
  let after;
  try{ after = applyOp(clone(s), clone(op)); }catch(e){ return null; }
  return JSON.stringify(after) === JSON.stringify(s) ? null : after;
}
/** The parts for a participant's place in every workset's ranking. */
const rankedParts = (s, id) => s.worksets.map(w => ['ranked', id, w.id]);
/**
 * The history entry for `op` applied to state `s`: {type, parts, undo:[ops], redo:[ops]},
 * or null when the operation has nothing to undo (unknown references, invalid input).
 */
function historyEntry(s, op){
  const entry = (parts, undo) => ({type:op.type, parts, undo, redo:[op]});
  switch(op.type){
    case 'race.rename':
      return entry([['name']], [{type:'race.rename', name:s.name}]);
    case 'race.setSport':
      return entry([['sport']], [{type:'race.setSport', sport:s.sport}]);
    case 'participants.add': {
      let next;
      try{ next = applyOp(clone(s), op); }catch(e){ return null; }
      const added = next.participants.filter(p => !findParticipant(s, p.id));
      if(!added.length) return null;
      return {
        type:op.type,
        parts: added.flatMap(p => [['participant', p.id], ...rankedParts(s, p.id)]),
        undo: added.map(p => ({type:'participant.delete', participantId:p.id})),
        // Only what was really added: the rest were duplicates the first time too.
        redo: [{type:'participants.add', participants: added.map(p => ({id:p.id, name:p.name}))}],
      };
    }
    case 'participant.rename': {
      const p = findParticipant(s, op.participantId);
      return p ? entry([['participant', p.id]], [{type:'participant.rename', participantId:p.id, name:p.name}]) : null;
    }
    case 'participant.delete': {
      const p = findParticipant(s, op.participantId);
      if(!p) return null;
      const ref = {type:'participant', id:p.id};
      return entry([['participant', p.id], ...rankedParts(s, p.id), ['memberOf', 'participant:' + p.id]],
        [{type:'participants.add', participants:[{id:p.id, name:p.name}]}, ...s.worksets.flatMap(w => rerankOps(s, p.id, w.id)), ...memberOfOps(s, ref)]);
    }
    case 'groupType.add': {
      let x;
      try{ x = reqGroupType(op.groupType); }catch(e){ return null; }
      if(findGroupType(s, x.id) || findGroupTypeByName(s, x.name)) return null;
      return entry([['groupType', x.id], ['groupsOfType', x.id]], [{type:'groupType.delete', groupTypeId:x.id}]);
    }
    case 'groupType.update': {
      const x = findGroupType(s, op.groupTypeId);
      return x ? entry([['groupType', x.id]], [{type:'groupType.update', groupTypeId:x.id, name:x.name, exclusive:x.exclusive}]) : null;
    }
    case 'groupType.delete': {
      const i = s.groupTypes.findIndex(x => x.id === op.groupTypeId);
      if(i < 0) return null;
      const x = s.groupTypes[i], typed = s.groups.filter(g => g.typeId === x.id);
      // Its groups lose their type: undo gives it back to them.
      return entry([['groupType', x.id], ['groupsOfType', x.id], ...typed.map(g => ['group', g.id])],
        [{type:'groupType.add', groupType:{...x}, beforeId: s.groupTypes[i + 1] ? s.groupTypes[i + 1].id : null},
          ...typed.map(g => ({type:'group.update', groupId:g.id, name:g.name, typeId:x.id}))]);
    }
    case 'group.add': {
      const id = op.group && typeof op.group === 'object' ? op.group.id : null;
      if(typeof id !== 'string' || findGroup(s, id) || !changes(s, op)) return null;
      return entry([['group', id], ['memberOf', 'group:' + id]], [{type:'group.delete', groupId:id}]);
    }
    case 'group.update': {
      const g = findGroup(s, op.groupId);
      return g ? entry([['group', g.id]], [{type:'group.update', groupId:g.id, name:g.name, typeId:g.typeId}]) : null;
    }
    case 'group.delete': {
      const i = s.groups.findIndex(g => g.id === op.groupId);
      if(i < 0) return null;
      const g = s.groups[i];
      // Other groups lose it as a member: undo puts it back there.
      return entry([['group', g.id], ['memberOf', 'group:' + g.id]],
        [{type:'group.add', group:clone(g), beforeId: s.groups[i + 1] ? s.groups[i + 1].id : null}, ...memberOfOps(s, {type:'group', id:g.id})]);
    }
    case 'group.members.add': case 'group.members.remove': {
      const g = findGroup(s, op.groupId);
      const after = g && changes(s, op);
      if(!after) return null;
      const now = findGroup(after, g.id).members;
      const has = (list, r) => list.some(m => sameTarget(m, r));
      // Only what really changed (known, not a member yet, no cycle) is undone.
      const added = now.filter(r => !has(g.members, r)), removed = g.members.filter(r => !has(now, r));
      return entry([['group', g.id]], [
        ...(added.length ? [{type:'group.members.remove', groupId:g.id, refs:added}] : []),
        ...(removed.length ? [{type:'group.members.add', groupId:g.id, refs:removed}] : []),
      ]);
    }
    case 'workset.ranking.add':
      return entry([['ranked', op.participantId, op.worksetId]],
        [{type:'workset.ranking.remove', worksetId:op.worksetId, participantId:op.participantId}]);
    case 'workset.ranking.remove':
      return entry([['ranked', op.participantId, op.worksetId]], rerankOps(s, op.participantId, op.worksetId));
    case 'workset.ranking.move': {
      const w = findWorkset(s, op.worksetId);
      if(!w) return null;
      return entry([['next', op.participantId, w.id]],
        [{type:'workset.ranking.move', worksetId:w.id, participantId:op.participantId, beforeId:rankedNext(w, op.participantId)}]);
    }
    case 'capture.add': {
      const c = op.capture;
      if(!c || typeof c.id !== 'string' || findCapture(s, c.id)) return null;
      let targets;
      try{ targets = captureTargetsOf(c); }catch(e){ return null; }
      const ws = typeof c.worksetId === 'string' ? c.worksetId : null;
      // Recording a time for ranked participants takes them out of the ranking: undo puts them back.
      return entry([['capture', c.id], ...(ws ? targets.map(t => ['ranked', t.id, ws]) : [])],
        [{type:'capture.delete', captureId:c.id}, ...rerankTargetsOps(s, targets, ws)]);
    }
    case 'capture.setKind': {
      const c = findCapture(s, op.captureId);
      return c ? entry([['capture', c.id]], [{type:'capture.setKind', captureId:c.id, kind:c.kind}]) : null;
    }
    case 'kind.add': {
      let k;
      try{ k = reqCustomKind(op.kind); }catch(e){ return null; }
      if(findKind(s, k.id) || findKindByName(s, k.name)) return null;
      // Deleting the kind again resets the selected kind of worksets that picked it meanwhile.
      return entry([['kind', k.id], ...s.worksets.map(w => ['captureKind', null, w.id])], [{type:'kind.delete', kindId:k.id}]);
    }
    case 'kind.update': {
      const k = findKind(s, op.kindId);
      return k ? entry([['kind', k.id]], [{type:'kind.update', kindId:k.id, name:k.name, role:k.role}]) : null;
    }
    case 'kind.delete': {
      const k = findKind(s, op.kindId);
      if(!k) return null;
      return entry([['kind', k.id], ...s.worksets.map(w => ['captureKind', null, w.id])],
        [{type:'kind.add', kind:{...k}}, ...s.worksets.filter(w => w.captureKind === k.id).map(w => ({type:'workset.setKind', worksetId:w.id, kind:k.id}))]);

/*
 * The local race. Data written by a newer version of the app (isNewerSchema) is shown as well
 * as possible but never written back: `tooNew` blocks saving until the page is reloaded.
 */
const localStore = {
  tooNew: false,
  load(){
    const raw = readJson(KEYS.local);
    this.tooNew = !!raw && isNewerSchema(raw);
    return normalizeState(raw);
  },
  save(state){ if(!this.tooNew) writeJson(KEYS.local, state); },
  reset(){ if(!this.tooNew) writeJson(KEYS.local, emptyState()); },
};

class LocalBackend {
  constructor(handlers){
    this.kind = 'local';
    this.handlers = handlers;
    this.state = localStore.load();
    this.state.archived = false;
  }
  getState(){ return this.state; }
  getStatus(){ return 'local'; }
  pendingCount(){ return 0; }
  clientCount(){ return null; }
  worksetClientCount(){ return null; }
  pendingCaptureIds(){ return new Set(); }
  blockReason(){ return localStore.tooNew ? 'lock.outdated' : null; }
  /** 'storage' while the local data comes from a newer version of the app. */
  outdatedReason(){ return localStore.tooNew ? 'storage' : null; }
  isReady(){ return true; }
  announceWorkset(){}
  /** Local data is this device's own: everything is allowed. */
  accessInfo(){ return {rules: FULL_ACCESS}; }
  dispatch(op){
    try{ applyOp(this.state, op); }catch(e){ console.warn('operation rejected locally', op, e); return null; }
    localStore.save(this.state);
    this.handlers.onChange();
    return null;
  }
  reload(){ this.state = localStore.load(); this.handlers.onReload(); }
  destroy(){}
}

class ApiError extends Error {
  constructor(code, status){ super(code); this.code = code; this.status = status; }
}
async function api(serverUrl, path, options = {}){
  // Race requests carry this client's schema version; an older one than the server's is refused.
  if(path.startsWith('/api/races')) path += (path.includes('?') ? '&' : '?') + 'schema=' + SCHEMA_VERSION;
  let res;
  try{
    res = await fetch(serverUrl + path, {
      method: options.method || 'GET',
      headers: options.body !== undefined ? {'Content-Type':'application/json'} : undefined,
      body: options.body !== undefined ? JSON.stringify(options.body) : undefined,
      cache: 'no-store',
    });
  }catch(e){
    throw new ApiError('network', 0);
  }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new ApiError((data && data.error) || ('http_' + res.status), res.status);
  return data;
}

 */
class ServerBackend {
  constructor(serverUrl, code, handlers){
    this.kind = 'server';
    this.serverUrl = serverUrl;
    this.code = code;
    this.handlers = handlers;
    this.cacheKey = KEYS.cachePrefix + serverUrl + '|' + code;
    const cache = readJson(this.cacheKey);
    // A cache written by a newer version of the app is shown but never written back or sent.
    this.cacheTooNew = !!(cache && cache.state) && isNewerSchema(cache.state);
    this.outdatedError = null;   // 'client_outdated' once the server refused this version
    this.confirmed = normalizeState(cache && cache.state);
    this.seq = cache && Number.isInteger(cache.seq) ? cache.seq : 0;
    this.pending = cache && Array.isArray(cache.pending) ? cache.pending : [];
    // What this code may do and see: {code, rules, codes?} from the server.
    this.access = cache && cache.access && Array.isArray(cache.access.rules) ? cache.access : null;
    this.hasSnapshot = !!cache;

    this.clients = null;         // clients on this race, only known over WebSocket
    this.worksetClients = {};    // clients per workset, likewise
    this.worksetId = null;       // this device's workset, announced for the presence counts
    this.wsUrl = undefined;      // undefined = not fetched yet, null = disabled
    this.ws = null;
    this.wsFailures = 0;
    this.sent = new Set();       // opIds sent on the current connection, awaiting confirmation
    this.waiters = new Map();

    }

}

const DEFAULT_SERVER_URL = (window.TIMER_CONFIG && window.TIMER_CONFIG.serverUrl) || '';
let backend = null;
const S = () => backend.getState();

const backendHandlers = {
  onChange(){ renderAll(); },
  // The local data was replaced (reset, another tab): the history no longer applies.
  onReload(){ clearHistory(); renderAll(); },
  onStatus(){ renderStatus(); renderSettings(); },
  // What this code may do or see changed (worksets added or deleted, codes created).
  onAccess(){ renderAll(); },
  onRejected(op, error){
    // The server state differs from what the history was recorded against.
    clearHistory();
    if(error === 'access_revoked'){ onAccessRevoked(); return; }
    toast(error === 'forbidden' ? t('lock.forbidden') : t('err.rejected', {error: error || '?'}));
  },
  onFatal(error){
    if(error === 'not_found'){ useLocal(); toast(t('err.gone')); }
    else if(error === 'access_revoked') onAccessRevoked();
  },
  // Versions don't match (docs/groups.md, "Schema versioning"). An outdated client stays on
  // the race with the reload notice; with an older server the device carries on locally (the
  // cache with its pending operations stays for a later connection).
  onOutdated(error){
    if(error === 'server_outdated'){ useLocal(); toast(t('err.serverOutdated')); }
    else renderAll();
  },
};

/*
 * The code no longer grants access (its stations were all deleted). Times not sent yet would
 * be lost with the cache: offer them as CSV first. Then the connection's cache and station go,
 * the device carries on locally; the race stays in the recent list (undoing the deletion
 * elsewhere brings the access back).
 */
let revoking = false;
async function onAccessRevoked(){
  if(revoking || backend.kind !== 'server') return;
  revoking = true;
  const server = backend;
  server.destroy();
  try{
    const unsent = server.pendingCaptureIds().size;
    if(unsent){
      const ok = await askConfirm({title:t('revoked.title'), text:t('revoked.text', {n: unsent}), ok:t('revoked.export'), cancel:t('revoked.discard')});
      if(ok) await exportCsv();
    }
    removeKey(server.cacheKey);
    removeKey(KEYS.worksetPrefix + server.serverUrl + '|' + server.code);
    useLocal();
    toast(t('err.revoked'));
  }finally{
    revoking = false;
  }
}

function normalizeCode(code){ return String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function normalizeServerUrl(value){
  let v = String(value || '').trim();
  if(!v) return '';
  if(!/^https?:\/\//i.test(v)) v = 'https://' + v;
  return v.replace(/\/+$/, '');
}
function currentServerUrl(){ return normalizeServerUrl(prefs.serverUrl) || DEFAULT_SERVER_URL; }
function raceLink(serverUrl, code){ return serverUrl + '/#r=' + code; }

function parseFragment(){
  const m = location.hash.match(/(?:^#|&)r=([A-Za-z0-9-]+)/);
  return m ? normalizeCode(m[1]) : null;
}
function setFragment(code){
  try{ history.replaceState(null, '', location.pathname + location.search + (code ? '#r=' + code : '')); }catch(e){}
}

// are kept; the settings show the latest RECENT_MAX, so removing one brings the next one up,
// and "show more" reveals RECENT_MAX further ones at a time (until the settings are reopened).
const RECENT_MAX = 3;

function recentConnections(){
  const list = readJson(KEYS.recent);
  return Array.isArray(list) ? list.filter(e => e && typeof e.serverUrl === 'string' && typeof e.code === 'string') : [];
}
/**
 * Moves a race to the top of the list. `keepKnown` means "the name isn't known yet" (while
