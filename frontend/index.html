<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<!-- Progressive web app (files in public/; the service worker is registered at the end of the script) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0A1929" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EEF2F5" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1929; --panel:#112A45; --panel2:#14314F; --text:#EAF0F5; --muted:#7E94A8;
    --accent:#E0A63B; --accent-ink:#2A1C04; --danger:#E0625A; --ok:#3FB37F; --border:rgba(255,255,255,0.09);
    --shade:rgba(2,10,20,0.55);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#EEF2F5; --panel:#FFFFFF; --panel2:#F4F7F9; --text:#0F2438; --muted:#5C7690;
      --accent:#B9822A; --accent-ink:#FFFFFF; --danger:#B23B32; --ok:#1E8A5A; --border:rgba(15,36,56,0.10);
      --shade:rgba(15,36,56,0.35);
    }
  }
  :root[data-theme="light"]{
    --bg:#EEF2F5; --panel:#FFFFFF; --panel2:#F4F7F9; --text:#0F2438; --muted:#5C7690;
    --accent:#B9822A; --accent-ink:#FFFFFF; --danger:#B23B32; --ok:#1E8A5A; --border:rgba(15,36,56,0.10);
    --shade:rgba(15,36,56,0.35);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',system-ui,sans-serif; min-height:100%;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:1200px; margin:0 auto; padding:20px 16px 60px;}

  /* ---------- header ---------- */
  .topbar{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .title-row{display:flex; align-items:center; gap:8px; min-width:0;}
  h1{font-size:19px; font-weight:600; margin:0; letter-spacing:.2px; overflow-wrap:anywhere;}
  .title-input{font-size:17px; font-weight:600; max-width:320px;}
  .sub{color:var(--muted); font-size:13px; margin-top:2px;}
  .top-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .status-pill{display:inline-flex; align-items:center; gap:7px; background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:999px; padding:7px 12px; font-size:12px; cursor:pointer; font-family:inherit; max-width:100%;}
  .status-pill span:last-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0;}
  .dot.online{background:var(--ok);}
  .dot.connecting{background:var(--accent); animation:pulse 1.2s ease-in-out infinite;}
  .dot.offline{background:var(--danger);}
  @keyframes pulse{50%{opacity:.35;}}
  .settings-btn{display:inline-flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:999px; padding:7px 12px; font-size:12px; cursor:pointer; font-family:inherit;}
  .banner{background:var(--panel); border:1px solid var(--accent); border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:14px;}

  /* ---------- app grid: default (narrow window) ---------- */
  .app{
    display:grid;
    grid-template-columns:1fr;
    grid-template-areas:"clock" "sorted" "participants" "captures";
    gap:14px;
    align-items:start;
  }
  .clock-card{grid-area:clock;}
  .sorted-panel{grid-area:sorted;}
  .participants-panel{grid-area:participants;}
  .captures-panel{grid-area:captures;}

  .clock-card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:20px 18px; text-align:center;
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  }
  .clock{font-family:'Space Mono',monospace; font-weight:700; font-variant-numeric:tabular-nums; font-size:clamp(38px,11vw,86px); letter-spacing:1px; line-height:1;}
  .clock .cs{font-size:0.45em; color:var(--muted);}
  .date{color:var(--muted); font-size:12px; margin-top:6px; font-family:'Space Mono',monospace;}
  .capture-btn{margin-top:16px; width:100%; max-width:420px; border:none; border-radius:12px; background:var(--accent); color:var(--accent-ink); font-family:'Space Mono',monospace; font-weight:700; font-size:18px; padding:16px; cursor:pointer; letter-spacing:.5px; transition:transform .08s ease;}
  .capture-btn:active{transform:scale(0.97);}
  .link-btn{display:inline-block; margin-top:10px; background:none; border:none; padding:2px 6px; color:var(--muted); font-family:inherit; font-size:13px; text-decoration:underline; text-underline-offset:3px; cursor:pointer;}
  .link-btn:active{color:var(--text);}
  .hint-line{color:var(--muted); font-size:11px; margin-top:10px; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;}
  .hint-pair{display:inline-flex; align-items:center; gap:4px; white-space:nowrap;}

  /* ---------- wide window: clock on top, participants left / captures right ---------- */
  @media (min-width:700px){
    .app{
      grid-template-columns:320px 1fr;
      grid-template-areas:
        "clock   clock"
        "sorted  captures"
        "participants   captures";
    }
    .clock-card{position:static;}
  }

  .panel{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:4px;}
  .panel-head h2{margin:0; font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px;}
  .panel-head .count{color:var(--muted); font-weight:400; font-size:12px;}
  .panel .hint-line{justify-content:flex-start; margin:0 0 10px;}

  .toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px;}
  .seg{display:flex; flex-wrap:wrap; gap:3px; background:var(--panel2); padding:3px; border-radius:8px;}
  .seg button{border:none; background:transparent; color:var(--muted); font-size:12px; padding:6px 10px; border-radius:6px; cursor:pointer; font-family:inherit; white-space:nowrap;}
  .seg button.active{background:var(--panel); color:var(--text); font-weight:600;}
  .rank-pill{display:inline-flex; align-items:center; gap:3px; font-size:10px; color:var(--accent); font-family:'Space Mono',monospace; margin-top:2px;}

  .add-row{display:flex; gap:8px; margin-bottom:10px;}
  .input{background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px 12px; font-size:14px; font-family:inherit; width:100%; min-width:0;}
  .input[readonly]{color:var(--muted);}
  .add-row .input{flex:1;}
  .btn{background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px 14px; font-size:14px; cursor:pointer; font-family:inherit; white-space:nowrap;}
  .btn.small{padding:8px 12px; font-size:13px;}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600;}
  .btn.danger{color:var(--danger); border-color:var(--danger); background:transparent;}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  .search-wrap{position:relative; margin-bottom:10px;}
  .search-results{position:absolute; top:100%; left:0; right:0; background:var(--panel); border:1px solid var(--border); border-radius:8px; margin-top:4px; max-height:220px; overflow:auto; z-index:30; box-shadow:0 8px 24px rgba(0,0,0,.3);}
  .search-results .res{padding:9px 12px; font-size:13px; cursor:pointer;}

  .search-empty{padding:9px 12px; font-size:12px; color:var(--muted);}

  @media (hover: hover){
    .link-btn:hover{color:var(--text);}
    .mini:hover{color:var(--text); border-color:var(--muted);}
    .search-results .res:hover{background:var(--panel2);}
  }

  ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;}

  .participant-row, .sorted-row{display:flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:8px 10px;}
  .sorted-row{touch-action:none;}
  .sorted-row.dragging{opacity:.45;}
  .drag-handle{cursor:grab; color:var(--muted); font-size:16px; padding:2px 6px; touch-action:none; user-select:none; flex-shrink:0;}
  .kbd{display:inline-flex; align-items:center; justify-content:center; min-width:19px; height:19px; padding:0 4px; border:1px solid var(--border); border-radius:5px; background:var(--panel); color:var(--muted); font-family:'Space Mono',monospace; font-size:11px; flex-shrink:0;}
  .participant-main{flex:1; min-width:0; cursor:default;}
  .participant-main .nm{font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .participant-main .meta{font-size:11px; color:var(--muted); font-family:'Space Mono',monospace; margin-top:2px;}
  .ops{display:flex; gap:4px; flex-shrink:0;}
  .mini{display:inline-flex; align-items:center; justify-content:center; background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:6px; width:26px; height:26px; padding:0; cursor:pointer; font-size:13px; line-height:1; flex-shrink:0; font-family:inherit; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
  .mini.wide{width:auto; padding:6px 9px;}
  .mini:active{color:var(--text); border-color:var(--muted); background:var(--panel);}
  .edit-input{background:var(--panel); border:1px solid var(--accent); color:var(--text); border-radius:6px; padding:5px 7px; font-size:14px; font-family:inherit; width:100%;}
  .empty{color:var(--muted); font-size:13px; padding:8px 2px;}

  .cap-row{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:10px 12px;}
  .cap-time{font-family:'Space Mono',monospace; font-weight:700; font-size:16px; white-space:nowrap;}
  .cap-delta{color:var(--muted); font-size:11px; font-family:'Space Mono',monospace;}
  .cap-date{color:var(--muted); font-family:'IBM Plex Sans',system-ui,sans-serif; font-weight:400; font-size:11px; margin-left:6px;}
  .pending-mark{color:var(--accent); font-family:'IBM Plex Sans',system-ui,sans-serif; font-weight:400; font-size:11px; margin-left:6px;}
  .cap-side{display:flex; flex-direction:column; gap:6px; align-items:end;}
  select.assign{width:100%; background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit;}
  .rank{color:var(--muted); font-size:12px; font-family:'Space Mono',monospace; width:26px; text-align:right;}
  .footer-actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .footer-actions input[type=file]{display:none;}

  /* ---------- touch devices: roomier hit targets (~44 px, WCAG 2.5.5) ---------- */
  @media (hover: none) and (pointer: coarse){
    .link-btn{padding:10px 12px; font-size:14px;}
    .mini{width:42px; height:42px; font-size:17px; border-radius:9px;}
    .mini.wide{width:auto; min-width:42px; padding:0 13px;}
    .ops{gap:6px;}
    .participant-row, .sorted-row{gap:6px; padding:7px 8px;}
    .drag-handle{font-size:20px; padding:9px 7px;}
    .participant-main{padding:2px 0;}
    .seg button{padding:10px 14px; font-size:13px;}
    .btn.small{padding:11px 14px; font-size:14px;}
    select.assign{padding:11px 10px; font-size:14px;}
    .search-results .res{padding:13px 12px;}
    .cap-side{gap:8px;}
    /* The wider buttons need more room in the fixed left column. */
    @media (min-width:700px){
      .app{grid-template-columns:360px 1fr;}
    }
  }

  /* Actions that need a live server connection (normal) or are blocked in archived races (all). */
  body.lock-normal [data-edit="normal"], body.lock-all [data-edit]{opacity:.4; pointer-events:none;}

  /* An archived race records nothing any more: no clock, no sorted list. */
  body.archived .clock-card, body.archived .sorted-panel{display:none;}
  body.archived .app{grid-template-areas:"participants" "captures";}
  @media (min-width:700px){
    body.archived .app{grid-template-areas:"participants captures";}
  }

  /* ---------- settings drawer ---------- */
  .overlay{position:fixed; inset:0; background:var(--shade); z-index:60;}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:min(420px,100vw); background:var(--bg); border-left:1px solid var(--border); z-index:61;
    transform:translateX(100%); visibility:hidden; transition:transform .22s ease, visibility .22s;
    overflow-y:auto; padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));}
  .drawer.open{transform:none; visibility:visible;}
  .drawer-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .drawer-head h2{margin:0; font-size:16px; font-weight:600;}
  .drawer section{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px;}
  .drawer h3{margin:0 0 10px; font-size:13px; font-weight:600;}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:10px;}
  .field label{font-size:12px; color:var(--muted);}
  .code-input{font-family:'Space Mono',monospace; text-transform:uppercase; letter-spacing:1px;}
  .row{display:flex; gap:8px; align-items:center;}
  .row .input{flex:1;}
  .help{font-size:12px; color:var(--muted); margin:6px 0 0; line-height:1.45;}
  .error-text{font-size:12px; color:var(--danger); margin-top:8px;}
  .divider{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; margin:12px 0;}
  .divider::before, .divider::after{content:''; flex:1; height:1px; background:var(--border);}
  details.advanced{margin-top:14px;}
  details.advanced summary{cursor:pointer; font-size:12px; color:var(--muted);}
  details.advanced .field{margin-top:10px;}
  .status-line{display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:12px;}
  .status-line .help{margin:0;}
  .link-out{font-size:13px; color:var(--accent); word-break:break-all;}
  .action{margin-top:12px;}
  .action:first-of-type{margin-top:0;}

  /* ---------- dialog ---------- */
  .modal-backdrop{position:fixed; inset:0; background:var(--shade); z-index:80; display:flex; align-items:center; justify-content:center; padding:16px;}
  .modal{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; max-width:440px; width:100%;}
  .modal h3{margin:0 0 8px; font-size:16px;}
  .modal p{margin:0 0 16px; font-size:14px; line-height:1.5;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap;}

  .toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--panel); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:90; max-width:90vw; text-align:center;}
  .toast.show{opacity:1;}

  @media (prefers-reduced-motion: reduce){
    .dot.connecting{animation:none;}
    .drawer{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div>
      <div class="title-row">
        <h1 id="raceTitle"></h1>
        <button class="mini" id="renameRaceBtn" data-edit="normal" data-i18n-title="header.rename">✎</button>
      </div>
      <div class="sub" data-i18n="header.subtitle"></div>
    </div>
    <div class="top-actions">
      <button class="status-pill" id="statusPill" type="button"><span class="dot" id="statusDot"></span><span id="statusText"></span></button>
      <button class="settings-btn" id="settingsBtn" type="button">⚙ <span data-i18n="settings.title"></span></button>
    </div>
  </header>

  <div class="banner" id="archivedBanner" data-i18n="archived.banner" hidden></div>

  <div class="app">
    <div class="clock-card">
      <div class="clock" id="clock">00:00:00<span class="cs">.00</span></div>
      <div class="date" id="dateLine"></div>
      <button class="capture-btn" id="captureBtn" data-edit="critical" data-i18n="clock.capture"></button>
      <div><button class="link-btn" id="captureFreeBtn" data-edit="critical" data-i18n="clock.captureFree"></button></div>
      <div class="hint-line">
        <span class="hint-pair"><span class="kbd">␣</span><span data-i18n="clock.hintNext"></span></span>
        <span class="hint-pair"><span class="kbd">1–9</span><span data-i18n="clock.hintDirect"></span></span>
        <span class="hint-pair"><span class="kbd">0</span><span data-i18n="clock.hintFree"></span></span>
      </div>
    </div>

    <div class="panel sorted-panel">
      <div class="panel-head">
        <h2><span data-i18n="sorted.title"></span> <span class="count" id="sortedCount">0</span></h2>
      </div>
      <div class="hint-line" data-i18n="sorted.hint"></div>
      <div class="search-wrap" data-edit="critical">
        <input class="input" id="rankSearch" type="text" data-i18n-placeholder="sorted.search" autocomplete="off">
        <div class="search-results" id="rankSearchResults" hidden></div>
      </div>
      <ul id="sortedList"></ul>
      <div class="empty" id="sortedEmpty" data-i18n="sorted.empty"></div>
    </div>

    <div class="panel participants-panel">
      <div class="panel-head">
        <h2><span data-i18n="participants.title"></span> <span class="count" id="participantCount">0</span></h2>
      </div>
      <div class="hint-line" data-i18n="participants.hint"></div>
      <div class="toolbar">
        <div class="seg" id="filterSeg">
          <button data-f="all" data-i18n="filter.all"></button>
          <button data-f="open" data-i18n="filter.open"></button>
          <button data-f="hideSorted" data-i18n="filter.hideSorted"></button>
        </div>
      </div>
      <div class="toolbar">
        <div class="seg" id="sortFieldSeg">
          <button data-sf="manual" data-i18n="sort.manual"></button>
          <button data-sf="alpha" data-i18n="sort.alpha"></button>
          <button data-sf="time" data-i18n="sort.time"></button>
        </div>
        <button class="mini wide" id="sortDirBtn" data-i18n-title="sort.dir">↑</button>
      </div>
      <div class="add-row" data-edit="normal">
        <input class="input" id="participantInput" type="text" data-i18n-placeholder="participants.placeholder" maxlength="60">
        <button class="btn" id="addParticipantBtn" data-i18n="participants.add"></button>
      </div>
      <ul id="participantList"></ul>
      <div class="empty" id="participantEmpty"></div>
      <div class="footer-actions">
        <button class="btn small" id="importBtn" data-edit="normal" data-i18n="participants.import"></button>
        <input type="file" id="importFile" accept=".csv,text/csv,text/plain">
      </div>
    </div>

    <div class="panel captures-panel">
      <div class="panel-head">
        <h2><span data-i18n="captures.title"></span> <span class="count" id="capCount">0</span></h2>
      </div>
      <ul id="capList" style="margin-top:12px;"></ul>
      <div class="empty" id="capEmpty" data-i18n="captures.empty"></div>
      <div class="footer-actions">
        <button class="btn small" id="exportBtn" data-i18n="captures.export"></button>
      </div>
    </div>
  </div>
</div>

<!-- ---------- settings drawer ---------- -->
<div class="overlay" id="drawerOverlay" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer-head">
    <h2 id="drawerTitle" data-i18n="settings.title"></h2>
    <button class="mini" id="drawerClose" data-i18n-title="settings.close">✕</button>
  </div>

  <section>
    <h3 data-i18n="settings.language"></h3>
    <div class="seg" id="langSeg">
      <button data-lang="de">Deutsch</button>
      <button data-lang="en">English</button>
    </div>
  </section>

  <section>
    <h3 data-i18n="settings.sport"></h3>
    <select class="input" id="sportSelect" data-edit="normal"></select>
  </section>

  <!-- local storage backend -->
  <div id="localSection">
    <section>
      <div class="status-line"><span class="dot"></span><strong data-i18n="status.local"></strong></div>
      <p class="help" data-i18n="settings.localInfo" style="margin:0 0 14px;"></p>
      <div class="field">
        <label for="codeInput" data-i18n="settings.code"></label>
        <div class="row">
          <input class="input code-input" id="codeInput" type="text" maxlength="16" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123">
          <button class="btn primary" id="connectBtn" data-i18n="settings.connect"></button>
        </div>
      </div>
      <div class="divider" data-i18n="settings.or"></div>
      <button class="btn block" id="createBtn" data-i18n="settings.create"></button>
      <div class="error-text" id="connectError" hidden></div>
      <details class="advanced" id="advancedLocal">
        <summary data-i18n="settings.advanced"></summary>
        <div class="field">
          <label for="serverUrlInput" data-i18n="settings.serverUrl"></label>
          <input class="input" id="serverUrlInput" type="url" autocomplete="url" spellcheck="false">
          <p class="help" id="serverUrlHelp"></p>
        </div>
      </details>

// =====================================================================
// Browser storage
// =====================================================================
const KEYS = {
  local: 'zeitnah.local',
  prefs: 'zeitnah.prefs',
  connection: 'zeitnah.connection',
  cachePrefix: 'zeitnah.cache:',
};
// Keys used by earlier versions; their data is migrated on load (see migrateLegacyStorage).
const LEGACY_SINGLE_KEY = 'segel-zielzeit-v1';
const LEGACY_PREFIX = 'regatta-timer.';

function readJson(key){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function writeJson(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}
function removeKey(key){
  try{ localStorage.removeItem(key); }catch(e){}
}

/*
 * One-time migration of data written by earlier versions:
 *  - 'segel-zielzeit-v1': a single key holding state and preferences
 *  - 'regatta-timer.*':   same layout as today under another prefix
 * Both used sailing field names (boats/boatId); normalizeState() converts those.
 * Server caches are not migrated: they are rebuilt from the server.
 */
(function migrateLegacyStorage(){
  const single = readJson(LEGACY_SINGLE_KEY);
  if(single){
    if(!readJson(KEYS.local)){
      // Earlier versions only supported sailing; keep that vocabulary for migrated data.
      writeJson(KEYS.local, normalizeState({boats:single.boats, ranking:single.ranking, captures:single.captures, sport:'sailing'}));
    }
    if(!readJson(KEYS.prefs)){
      writeJson(KEYS.prefs, {
        filterOpen: single.filterOpen !== undefined ? !!single.filterOpen : single.listFilter === 'open',
        filterHideSorted: single.filterHideSorted !== undefined ? !!single.filterHideSorted
          : (single.showSortedInList === undefined ? false : !single.showSortedInList),
        sortField: single.sortField || (single.boatSortAlpha ? 'alpha' : 'manual'),
        sortDir: single.sortDir === 'desc' ? 'desc' : 'asc',
      });
    }
    removeKey(LEGACY_SINGLE_KEY);
  }
  for(const name of ['local', 'prefs', 'connection']){
    const old = readJson(LEGACY_PREFIX + name);
    if(old === null) continue;
    if(readJson(KEYS[name]) === null){
      // Earlier versions only supported sailing; keep that vocabulary for migrated data.
      writeJson(KEYS[name], name === 'local' ? normalizeState(Object.assign({sport:'sailing'}, old)) : old);
    }
    removeKey(LEGACY_PREFIX + name);
  }
  try{
    Object.keys(localStorage).filter(k => k.startsWith(LEGACY_PREFIX + 'cache:')).forEach(removeKey);
  }catch(e){}
})();

// Per-device preferences (never synced).
const prefs = Object.assign(
  {lang:null, filterOpen:false, filterHideSorted:false, sortField:'manual', sortDir:'asc', serverUrl:null},
  readJson(KEYS.prefs) || {}
);
if(!['manual','alpha','time'].includes(prefs.sortField)) prefs.sortField = 'manual';
if(prefs.lang !== 'de' && prefs.lang !== 'en'){
  prefs.lang = (navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en';
}
function savePrefs(){ writeJson(KEYS.prefs, prefs); }

/** The active sport text set: state.sport once a race is loaded, 'generic' before that. */
function currentSport(){
  const sport = backend ? S().sport : null;
  return TEXTS[sport] ? sport : 'generic';
}
function t(key, vars){
  const lookup = (lang) => {
    const sport = TEXTS[currentSport()][lang], common = TEXTS.common[lang];
    return (sport && sport[key] !== undefined) ? sport[key] : (common ? common[key] : undefined);
  };
  let s = lookup(prefs.lang);
  if(s === undefined) s = lookup('de');
  if(s === undefined) s = key;
  if(vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
  return s;
}
function locale(){ return prefs.lang === 'de' ? 'de-DE' : 'en-GB'; }

// =====================================================================
// Race state and operations
// =====================================================================
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
function clone(v){ return JSON.parse(JSON.stringify(v)); }
function emptyState(){ return {name:null, archived:false, sport:DEFAULT_SPORT, participants:[], ranking:[], captures:[]}; }

/** Sanitises a stored state. Also accepts the field names of earlier versions (boats, boatId). */
function normalizeState(s){
  if(!s || typeof s !== 'object') return emptyState();
  const rawParticipants = Array.isArray(s.participants) ? s.participants : (Array.isArray(s.boats) ? s.boats : []);
  const participants = rawParticipants
    .filter(p => p && typeof p.id === 'string' && typeof p.name === 'string')
    .map(p => ({id:p.id, name:p.name}));
  const participantIds = new Set(participants.map(p => p.id));
  const ranking = Array.isArray(s.ranking) ? [...new Set(s.ranking.filter(id => participantIds.has(id)))] : [];
  const captures = Array.isArray(s.captures)
    ? s.captures.filter(c => c && typeof c.id === 'string' && Number.isFinite(c.ts)).map(c => {
        const pid = c.participantId !== undefined ? c.participantId : c.boatId;
        return {id:c.id, ts:Math.round(c.ts), tzOffset:normTzOffset(c.tzOffset), participantId: typeof pid === 'string' ? pid : null};
      })
    : [];
  const sport = SPORTS.includes(s.sport) ? s.sport : 'generic';
  return {name: typeof s.name === 'string' && s.name ? s.name : null, archived: !!s.archived, sport, participants, ranking, captures};
}
function hasData(s){ return !!s.name || s.participants.length > 0 || s.captures.length > 0; }

/*
 * Mirror of App\Race\OperationReducer (PHP). The server is authoritative; this copy
 * applies operations optimistically and replays the server's event stream.
 * Keep both implementations in sync.
 */
const ID_RE = /^[A-Za-z0-9_-]{1,40}$/;
class OpError extends Error {}
function cleanText(v){ return v.replace(/^\s+|\s+$/gu, '').replace(/\s+/gu, ' '); }
function nameKey(v){ return cleanText(v).toLowerCase(); }
function reqId(v, field){ if(typeof v !== 'string' || !ID_RE.test(v)) throw new OpError('invalid_' + field); return v; }
function optId(v, field){ return v === null || v === undefined ? null : reqId(v, field); }
function reqName(v, max, field){
  if(typeof v !== 'string') throw new OpError('invalid_' + field);
  const s = cleanText(v);
  if(!s || [...s].length > max) throw new OpError('invalid_' + field);
  return s;
}
function reqTs(v){ if(!Number.isInteger(v) || v < 0 || v > 1e14) throw new OpError('invalid_ts'); return v; }
/** Time zone of the recording device in minutes east of UTC; null when unknown (older clients). */
function optTzOffset(v){
  if(v === null || v === undefined) return null;
  if(!Number.isInteger(v) || v < -900 || v > 900) throw new OpError('invalid_tz_offset');
  return v;
}
function normTzOffset(v){ return Number.isInteger(v) && v >= -900 && v <= 900 ? v : null; }
/** The device's current offset, stored with every capture it records. */
function currentTzOffset(){ return -new Date().getTimezoneOffset(); }
const findParticipant = (s, id) => s.participants.find(b => b.id === id);
const findParticipantByName = (s, name) => s.participants.find(b => nameKey(b.name) === nameKey(name));
const findCapture = (s, id) => s.captures.find(c => c.id === id);

function applyOp(s, op){
  if(!op || typeof op.type !== 'string') throw new OpError('invalid_type');
  switch(op.type){
    case 'race.rename': {
      const n = op.name;
      s.name = (n === null || n === undefined || (typeof n === 'string' && cleanText(n) === '')) ? null : reqName(n, 80, 'name');
      return s;
    }
    case 'race.archive':
      s.archived = true;
      // An archived race is read-only, so the expected crossing order is meaningless.
      s.ranking = [];
      return s;
    case 'race.setSport': {
      const sport = op.sport;
      if(typeof sport !== 'string' || !SPORTS.includes(sport)) throw new OpError('invalid_sport');
      s.sport = sport;
      return s;
    }
    case 'participants.add': {
      if(!Array.isArray(op.participants) || op.participants.length > 2000) throw new OpError('invalid_participants');
      for(const b of op.participants){
        const id = reqId(b && b.id, 'participant_id');
        const name = reqName(b && b.name, 60, 'participant_name');
        if(findParticipant(s, id) || findParticipantByName(s, name)) continue;
        s.participants.push({id, name});
      }
      return s;
    }
    case 'participant.rename': {
      const id = reqId(op.participantId, 'participant_id');
      const name = reqName(op.name, 60, 'participant_name');
      const b = findParticipant(s, id);
      if(b) b.name = name;
      return s;
    }
    case 'participant.delete': {
      const id = reqId(op.participantId, 'participant_id');
      s.participants = s.participants.filter(b => b.id !== id);
      s.ranking = s.ranking.filter(x => x !== id);
      return s;
    }
    case 'ranking.add': {
      const id = reqId(op.participantId, 'participant_id');
      if(findParticipant(s, id) && !s.ranking.includes(id)) s.ranking.push(id);
      return s;
    }
    case 'ranking.remove': {
      const id = reqId(op.participantId, 'participant_id');
      s.ranking = s.ranking.filter(x => x !== id);
      return s;
    }
    case 'ranking.move': {
      const id = reqId(op.participantId, 'participant_id');
      const before = optId(op.beforeId, 'before_id');
      if(!s.ranking.includes(id)) return s;
      const ranking = s.ranking.filter(x => x !== id);
      const pos = (before === null || before === id) ? -1 : ranking.indexOf(before);
      if(pos < 0) ranking.push(id); else ranking.splice(pos, 0, id);
      s.ranking = ranking;
      return s;
    }
    case 'capture.add': {
      const c = op.capture;
      if(!c || typeof c !== 'object') throw new OpError('invalid_capture');
      const id = reqId(c.id, 'capture_id');
      const ts = reqTs(c.ts);
      const tzOffset = optTzOffset(c.tzOffset);
      let participantId = optId(c.participantId, 'participant_id');
      if(findCapture(s, id)) return s;
      if(participantId !== null && !findParticipant(s, participantId)) participantId = null;
      s.captures.push({id, ts, tzOffset, participantId});
      if(participantId !== null) s.ranking = s.ranking.filter(x => x !== participantId);
      return s;
    }
    case 'capture.assign': {
      const cid = reqId(op.captureId, 'capture_id');
      const bid = optId(op.participantId, 'participant_id');
      const c = findCapture(s, cid);
      if(!c || (bid !== null && !findParticipant(s, bid))) return s;
      c.participantId = bid;
      return s;
    }
    case 'capture.delete': {
      const cid = reqId(op.captureId, 'capture_id');
      s.captures = s.captures.filter(c => c.id !== cid);
      return s;
    }
    case 'state.merge': {
      const src = op.state;
      if(!src || typeof src !== 'object') throw new OpError('invalid_state');
      const participants = src.participants || [], ranking = src.ranking || [], captures = src.captures || [];
      if(!Array.isArray(participants) || !Array.isArray(ranking) || !Array.isArray(captures)
        || participants.length > 5000 || ranking.length > 5000 || captures.length > 20000) throw new OpError('invalid_state');
      const idMap = new Map();
      for(const b of participants){
        const id = reqId(b && b.id, 'participant_id');
        const name = reqName(b && b.name, 60, 'participant_name');
        let target = findParticipant(s, id) || findParticipantByName(s, name);
        if(!target){ target = {id, name}; s.participants.push(target); }
        idMap.set(id, target.id);
      }
      for(const rid of ranking){
        const mapped = idMap.get(reqId(rid, 'participant_id'));
        if(mapped !== undefined && !s.ranking.includes(mapped)) s.ranking.push(mapped);
      }
      for(const c of captures){
        if(!c || typeof c !== 'object') throw new OpError('invalid_capture');
        const id = reqId(c.id, 'capture_id');
        const ts = reqTs(c.ts);
        const tzOffset = optTzOffset(c.tzOffset);
        const bid = optId(c.participantId, 'participant_id');
        if(findCapture(s, id)) continue;
        s.captures.push({id, ts, tzOffset, participantId: bid !== null && idMap.has(bid) ? idMap.get(bid) : null});
      }
      if(s.name === null && typeof src.name === 'string' && cleanText(src.name) !== '') s.name = reqName(src.name, 80, 'name');
      if(src.sport !== undefined && src.sport !== null){
        if(typeof src.sport !== 'string' || !SPORTS.includes(src.sport)) throw new OpError('invalid_sport');
        // Only fills in a sport the race hasn't chosen yet (it still has the default).
        if(s.sport === DEFAULT_SPORT) s.sport = src.sport;
      }
      return s;
    }
    default:
      throw new OpError('unknown_type');
  }
}

// Operations that stay possible without a server connection: they are buffered and sent later.
const OFFLINE_OPS = new Set(['capture.add', 'capture.assign', 'capture.delete', 'ranking.add', 'ranking.remove', 'ranking.move']);

// =====================================================================
// Backends
// =====================================================================
const localStore = {
  load(){ return normalizeState(readJson(KEYS.local)); },
  save(state){ writeJson(KEYS.local, state); },
  reset(){ writeJson(KEYS.local, emptyState()); },
};

class LocalBackend {
  constructor(handlers){
    this.kind = 'local';
    this.handlers = handlers;
    this.state = localStore.load();
    this.state.archived = false;
  }
  getState(){ return this.state; }
  getStatus(){ return 'local'; }
  pendingCount(){ return 0; }
  clientCount(){ return null; }
  pendingCaptureIds(){ return new Set(); }
  blockReason(){ return null; }
  dispatch(op){
    try{ applyOp(this.state, op); }catch(e){ console.warn('operation rejected locally', op, e); return null; }
    localStore.save(this.state);
    this.handlers.onChange();
    return null;
  }
  reload(){ this.state = localStore.load(); this.handlers.onChange(); }
  destroy(){}
}

class ApiError extends Error {
  constructor(code, status){ super(code); this.code = code; this.status = status; }
}
async function api(serverUrl, path, options = {}){
  let res;
  try{
    res = await fetch(serverUrl + path, {
      method: options.method || 'GET',
      headers: options.body !== undefined ? {'Content-Type':'application/json'} : undefined,
      body: options.body !== undefined ? JSON.stringify(options.body) : undefined,
      cache: 'no-store',
    });
  }catch(e){
    throw new ApiError('network', 0);
  }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new ApiError((data && data.error) || ('http_' + res.status), res.status);
  return data;
}

/**
 * Server backend with optimistic updates.
 *   confirmed = server state at sequence number `seq`
 *   pending   = local operations not yet confirmed by the server
 *   view      = confirmed + pending (what the UI shows)
 * Both are cached in localStorage, so buffered operations survive reloads while offline.
 * Transport: WebSocket (push) with HTTP polling as fallback.
 */
class ServerBackend {
  constructor(serverUrl, code, handlers){
    this.kind = 'server';
    this.serverUrl = serverUrl;
    this.code = code;
    this.handlers = handlers;
    this.cacheKey = KEYS.cachePrefix + serverUrl + '|' + code;
    const cache = readJson(this.cacheKey);
    this.confirmed = normalizeState(cache && cache.state);
    this.seq = cache && Number.isInteger(cache.seq) ? cache.seq : 0;
    this.pending = cache && Array.isArray(cache.pending) ? cache.pending : [];
    this.hasSnapshot = !!cache;
    this.status = 'connecting';
    this.transport = null;       // 'ws' | 'poll' | null
    this.clients = null;         // clients on this race, only known over WebSocket
    this.wsUrl = undefined;      // undefined = not fetched yet, null = disabled
    this.ws = null;
    this.wsFailures = 0;
    this.sent = new Set();       // opIds sent on the current connection, awaiting confirmation
    this.waiters = new Map();
    this.timers = {};
    this.httpBusy = false;
    this.needSnapshot = !this.hasSnapshot;
    this.destroyed = false;
    this.recompute(false);
  }

  // ----- public interface -----
  getState(){ return this.view; }
  getStatus(){ return this.status; }
  pendingCount(){ return this.pending.length; }
  /** Number of clients on this race, or null while polling (the HTTP API can't tell). */
  clientCount(){ return this.transport === 'ws' ? this.clients : null; }
  pendingCaptureIds(){
    return new Set(this.pending.filter(o => o.type === 'capture.add' && o.capture).map(o => o.capture.id));
  }
  blockReason(op){
    if(this.view.archived) return 'lock.archived';
    if(OFFLINE_OPS.has(op.type)) return null;
    return this.status === 'online' ? null : 'lock.offline';
  }
  dispatch(op){
    op.opId = op.opId || uid();
    this.pending.push(op);
    this.persist();
    this.recompute();
    this.flush();
    return op.opId;
  }
  /** Resolves true once the server has applied the operation, false if it was rejected. */
  waitFor(opId){ return new Promise(resolve => this.waiters.set(opId, resolve)); }
  start(){ this.connect(); }
  destroy(){
    this.destroyed = true;
    Object.values(this.timers).forEach(id => clearTimeout(id));
    this.closeWs();
  }

  // ----- state bookkeeping -----
  persist(){ writeJson(this.cacheKey, {seq:this.seq, state:this.confirmed, pending:this.pending}); }
  recompute(notify = true){
    const view = clone(this.confirmed);
    for(const op of this.pending){ try{ applyOp(view, op); }catch(e){} }
    this.view = view;
    if(notify) this.handlers.onChange();
  }
  setStatus(status){
    if(this.status !== status){ this.status = status; this.handlers.onStatus(); }
  }
  settle(opId, ok, error){
    const i = this.pending.findIndex(o => o.opId === opId);
    const op = i >= 0 ? this.pending.splice(i, 1)[0] : null;
    this.sent.delete(opId);
    const waiter = this.waiters.get(opId);
    if(waiter){ this.waiters.delete(opId); waiter(ok); }
    if(!ok && op) this.handlers.onRejected(op, error);
    return !!op;
  }
  applySnapshot(seq, state){
    this.confirmed = normalizeState(state);
    this.seq = seq;
    this.hasSnapshot = true;
    this.needSnapshot = false;
    this.persist();
    this.recompute();
  }
  applyEvents(events){
    let changed = false;
    for(const e of [...events].sort((a, b) => a.seq - b.seq)){
      if(e.seq <= this.seq) continue;
      if(e.seq !== this.seq + 1){ this.resync(); break; }
      try{ applyOp(this.confirmed, e.op); }catch(err){ console.warn('could not apply server event', e, err); }
      this.seq = e.seq;
      changed = true;
      if(e.op && e.op.opId) this.settle(e.op.opId, true);
    }
    if(changed){ this.persist(); this.recompute(); }
  }
  resync(){
    if(this.transport === 'ws' && this.ws && this.ws.readyState === 1) this.send({type:'hello', code:this.code});
    else this.needSnapshot = true;
  }
  fatal(error){ if(!this.destroyed) this.handlers.onFatal(error); }
  later(name, fn, ms){ clearTimeout(this.timers[name]); this.timers[name] = setTimeout(fn, ms); }

  // ----- connection -----
  async connect(){
    if(this.destroyed) return;
    if(this.wsUrl === undefined){
      try{
        const config = await api(this.serverUrl, '/api/config');
        this.wsUrl = (config && config.wsUrl) || null;
      }catch(e){
        this.setStatus('offline');
        this.later('connect', () => this.connect(), 4000);
        return;
      }
    }
    if(this.destroyed) return;
    if(this.wsUrl) this.openWs();
    else this.startPolling();
  }

  openWs(){
    if(this.destroyed || this.ws) return;
    let ws;
    try{ ws = new WebSocket(this.wsUrl); }catch(e){ this.onWsDown(); return; }
    this.ws = ws;
    this.lastMessageAt = Date.now();
    this.later('wsOpen', () => { if(ws.readyState !== 1) ws.close(); }, 6000);
    ws.onopen = () => {
      clearTimeout(this.timers.wsOpen);
      this.send({type:'hello', code:this.code});
      this.startHeartbeat();
    };
    ws.onmessage = (event) => {
      this.lastMessageAt = Date.now();
      let msg; try{ msg = JSON.parse(event.data); }catch(e){ return; }
      this.onWsMessage(msg);
    };
    ws.onclose = () => {
      if(this.ws !== ws) return;
      this.ws = null;
      this.onWsDown();
    };
    ws.onerror = () => {};
  }
  onWsMessage(msg){
    switch(msg.type){
      case 'snapshot':
        this.transport = 'ws';
        this.wsFailures = 0;
        this.stopPolling();
        this.sent.clear();
        this.applySnapshot(msg.seq, msg.state);
        this.setStatus('online');
        this.flush();
        break;
      case 'events': this.applyEvents(msg.events || []); break;
      case 'presence':
        if(Number.isInteger(msg.clients) && msg.clients !== this.clients){ this.clients = msg.clients; this.handlers.onStatus(); }
        break;
      case 'ack': this.settle(msg.opId, true); this.persist(); this.recompute(); break;
      case 'rejected': this.settle(msg.opId, false, msg.error); this.persist(); this.recompute(); break;
      case 'error': if(msg.error === 'not_found') this.fatal('not_found'); break;
    }
  }
  onWsDown(){
    clearTimeout(this.timers.heartbeat);
    if(this.destroyed) return;
    this.transport = null;
    this.clients = null;
    this.sent.clear();
    this.wsFailures++;
    // The status text carries the transport and the client count, and neither is known now.
    this.handlers.onStatus();
    // Fall back to HTTP right away and retry the WebSocket with backoff.
    this.startPolling();
    this.later('wsRetry', () => this.openWs(), Math.min(30000, 1000 * 2 ** Math.min(this.wsFailures, 5)));
  }
  closeWs(){
    clearTimeout(this.timers.heartbeat);
    if(this.ws){ const ws = this.ws; this.ws = null; ws.onclose = null; try{ ws.close(); }catch(e){} }
  }
  startHeartbeat(){
    this.later('heartbeat', () => {
      if(!this.ws) return;
      if(Date.now() - this.lastMessageAt > 45000){ this.ws.close(); return; }
      this.send({type:'ping'});
      this.startHeartbeat();
    }, 15000);
  }
  send(msg){
    if(this.ws && this.ws.readyState === 1){ this.ws.send(JSON.stringify(msg)); return true; }
    return false;
  }

  startPolling(){
    if(this.polling) return;
    this.polling = true;
    this.pollOnce();
  }
  stopPolling(){
    this.polling = false;
    clearTimeout(this.timers.poll);
  }
  async pollOnce(){
    if(this.destroyed || !this.polling) return;
    let ok = false;
    try{
      await this.flushHttp();
      if(this.needSnapshot){
        const snap = await api(this.serverUrl, '/api/races/' + this.code);
        this.applySnapshot(snap.seq, snap.state);
      }else{
        const res = await api(this.serverUrl, '/api/races/' + this.code + '/events?since=' + this.seq);
        if(res.reset) this.applySnapshot(res.seq, res.state);
        else this.applyEvents(res.events || []);
      }
      ok = true;
    }catch(e){
      if(e.code === 'not_found'){ this.fatal('not_found'); return; }
      this.sent.clear();
    }
    if(!this.polling || this.destroyed) return;
    if(ok){
      this.transport = 'poll';
      this.setStatus('online');
      if(this.pending.some(o => !this.sent.has(o.opId))) this.flush();
    }else{
      this.transport = null;
      this.setStatus('offline');
    }
    this.later('poll', () => this.pollOnce(), ok ? 1500 : 3000);
  }

  flush(){
    if(this.transport === 'ws'){
      const ops = this.pending.filter(o => !this.sent.has(o.opId));
      if(ops.length && this.send({type:'ops', ops})) ops.forEach(o => this.sent.add(o.opId));
    }else if(this.transport === 'poll'){
      this.flushHttp().then(() => this.later('poll', () => this.pollOnce(), 50)).catch(() => {});
    }
  }
  async flushHttp(){
    if(this.httpBusy) return;
    const ops = this.pending.filter(o => !this.sent.has(o.opId)).slice(0, 100);
    if(!ops.length) return;
    this.httpBusy = true;
    try{
      const res = await api(this.serverUrl, '/api/races/' + this.code + '/ops', {method:'POST', body:{ops}});
      let settled = false;
      for(const r of res.results || []){
        if(r.status === 'applied') this.sent.add(r.opId);
        else settled = this.settle(r.opId, r.status === 'duplicate', r.error) || settled;
      }
      if(settled){ this.persist(); this.recompute(); }
    }finally{
      this.httpBusy = false;
    }
  }
}

// =====================================================================
// App wiring
// =====================================================================
const DEFAULT_SERVER_URL = (window.TIMER_CONFIG && window.TIMER_CONFIG.serverUrl) || '';
let backend = null;
const S = () => backend.getState();

const backendHandlers = {
  onChange(){ renderAll(); },
  onStatus(){ renderStatus(); renderSettings(); },
  onRejected(op, error){ toast(t('err.rejected', {error: error || '?'})); },
  onFatal(error){
    if(error === 'not_found'){ useLocal(); toast(t('err.gone')); }
  },
};

function normalizeCode(code){ return String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function normalizeServerUrl(value){
  let v = String(value || '').trim();
  if(!v) return '';
  if(!/^https?:\/\//i.test(v)) v = 'https://' + v;
  return v.replace(/\/+$/, '');
}
function currentServerUrl(){ return normalizeServerUrl(prefs.serverUrl) || DEFAULT_SERVER_URL; }
function raceLink(serverUrl, code){ return serverUrl + '/#r=' + code; }

function parseFragment(){
  const m = location.hash.match(/(?:^#|&)r=([A-Za-z0-9-]+)/);
  return m ? normalizeCode(m[1]) : null;
}
function setFragment(code){
  try{ history.replaceState(null, '', location.pathname + location.search + (code ? '#r=' + code : '')); }catch(e){}
}

function setBackend(next){
  if(backend) backend.destroy();
  backend = next;
  renderAll();
  renderStatus();
  renderSettings();
}
function useLocal(){
  removeKey(KEYS.connection);
  setFragment(null);
  setBackend(new LocalBackend(backendHandlers));
}
function useServer(serverUrl, code){
  writeJson(KEYS.connection, {serverUrl, code});
  setFragment(code);
  const next = new ServerBackend(serverUrl, code, backendHandlers);
  setBackend(next);
  next.start();
  return next;
}

/**
 * Connects to a race. When the race is still empty on the server and this browser
 * has local data, offers to upload it. With interactive=false (link / page load) a
 * server that can't be reached doesn't abort: the client keeps retrying in the background.
 */
async function connectToRace(serverUrl, code, {interactive = true} = {}){
  let snapshot = null;
  try{
    snapshot = await api(serverUrl, '/api/races/' + code);
  }catch(e){
    if(e.code === 'not_found' || interactive) throw e;
  }
  const local = localStore.load();
  let upload = false;
  if(snapshot && snapshot.seq === 0 && hasData(local)){
    upload = await askConfirm({
      title: t('init.title'),
      text: t('init.text', {code, participants: local.participants.length, captures: local.captures.length}),
      ok: t('init.yes'), cancel: t('init.no'),
    });
  }
  const server = useServer(serverUrl, code);
  toast(t('conn.connected', {code}));
  if(upload){
    const opId = server.dispatch({type:'state.merge', state:mergePayload(local)});
    if(await server.waitFor(opId)){
      toast(t('init.done'));
      renderSettings();
    }
  }
}
function mergePayload(s){ return {name:s.name, sport:s.sport, participants:s.participants, ranking:s.ranking, captures:s.captures}; }
function errorMessage(e, code){
  if(e && e.code === 'not_found') return t('err.notFound', {code});
  if(e && e.code === 'network') return t('err.network');
  return t('err.generic', {msg: (e && (e.code || e.message)) || '?'});
}

/** Runs an operation through the active backend unless it is blocked (offline / archived). */
function perform(op){
  const reason = backend.blockReason(op);
  if(reason){ toast(t(reason)); return null; }
  return backend.dispatch(op) || true;
}

// =====================================================================
// Formatting helpers
// =====================================================================
function two(n){ return String(n).padStart(2, '0'); }
function fmtClockParts(d){
  return {main:`${two(d.getHours())}:${two(d.getMinutes())}:${two(d.getSeconds())}`, cs:String(d.getMilliseconds()).padStart(3, '0').slice(0, 2)};
}
/**
 * A capture is stored as the instant `ts` plus the `tzOffset` of the device that recorded
 * it, so it is always rendered in the time zone it was taken in (falling back to this
 * device's zone for data without an offset). `shifted()` moves the instant so that the
 * UTC getters read the local wall clock of that zone.
 */
function captureZone(tzOffset){ return Number.isInteger(tzOffset) ? tzOffset : -new Date().getTimezoneOffset(); }
function shifted(ts, tzOffset){ return new Date(ts + captureZone(tzOffset) * 60000); }
function fmtTime(ts, tzOffset){
  const d = shifted(ts, tzOffset);
  return `${two(d.getUTCHours())}:${two(d.getUTCMinutes())}:${two(d.getUTCSeconds())}.${String(d.getUTCMilliseconds()).padStart(3, '0').slice(0, 2)}`;
}
/** YYYY-MM-DD in the capture's own time zone. */
function fmtDate(ts, tzOffset){
  const d = shifted(ts, tzOffset);
  return `${d.getUTCFullYear()}-${two(d.getUTCMonth() + 1)}-${two(d.getUTCDate())}`;
}
/** The date as the user reads it, e.g. "25. September 2026". */
function fmtDateLong(ts, tzOffset){
  return shifted(ts, tzOffset).toLocaleDateString(locale(), {year:'numeric', month:'long', day:'numeric', timeZone:'UTC'});
}
/** Full ISO 8601 timestamp with date and time zone, e.g. 2026-09-25T14:33:12.45+02:00. */
function fmtIso(ts, tzOffset){
  const off = captureZone(tzOffset), sign = off < 0 ? '-' : '+', abs = Math.abs(off);
  return `${fmtDate(ts, tzOffset)}T${fmtTime(ts, tzOffset)}${sign}${two(Math.floor(abs / 60))}:${two(abs % 60)}`;
}
/** True while the capture falls on the same local day as this device's current date. */
function isToday(ts, tzOffset){
  const now = new Date();
  return fmtDate(ts, tzOffset) === `${now.getFullYear()}-${two(now.getMonth() + 1)}-${two(now.getDate())}`;
}
function fmtDelta(ms){
  if(ms < 0) ms = 0;
  const totalCs = Math.floor(ms / 10), cs = totalCs % 100, totalSec = Math.floor(totalCs / 100);
  const s = totalSec % 60, m = Math.floor(totalSec / 60) % 60, h = Math.floor(totalSec / 3600);
  return (h > 0 ? two(h) + ':' : '') + two(m) + ':' + two(s) + '.' + two(cs);
}

// ---------- clock ----------
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('dateLine');
let lastDateText = '';
function tickClock(){
  const d = new Date();
  const p = fmtClockParts(d);
  clockEl.innerHTML = `${p.main}<span class="cs">.${p.cs}</span>`;
  const dateText = d.toLocaleDateString(locale(), {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  if(dateText !== lastDateText){ dateEl.textContent = dateText; lastDateText = dateText; }
  requestAnimationFrame(tickClock);
}
requestAnimationFrame(tickClock);

// ---------- toast ----------
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ---------- confirmation dialog ----------
const dialogEl = document.getElementById('dialog');
function askConfirm({title, text, ok, cancel, danger = false}){
  return new Promise(resolve => {
    document.getElementById('dialogTitle').textContent = title;
    document.getElementById('dialogText').textContent = text;
    const okBtn = document.getElementById('dialogOk');
    const cancelBtn = document.getElementById('dialogCancel');
    okBtn.textContent = ok;
    cancelBtn.textContent = cancel || t('dialog.cancel');
    okBtn.className = 'btn ' + (danger ? 'danger' : 'primary');
    const previousFocus = document.activeElement;
    dialogEl.hidden = false;
    okBtn.focus();
    const close = (result) => {
      dialogEl.hidden = true;
      okBtn.onclick = cancelBtn.onclick = null;
      dialogEl.onkeydown = null;
      if(previousFocus && previousFocus.focus) previousFocus.focus();
      resolve(result);
    };
    okBtn.onclick = () => close(true);
    cancelBtn.onclick = () => close(false);
    dialogEl.onkeydown = (e) => { if(e.key === 'Escape'){ e.preventDefault(); close(false); } };
  });
}

// ---------- double-activate (dblclick / double-tap) ----------
const lastTap = new WeakMap();
function onDoubleActivate(el, cb){
  el.addEventListener('click', (e) => {
    const now = Date.now();
    if(now - (lastTap.get(el) || 0) < 450){ lastTap.set(el, 0); cb(e); }
    else lastTap.set(el, now);
  });
}

// ---------- participant helpers ----------
const participantById = (id) => S().participants.find(b => b.id === id);
function participantCaptureInfo(participantId){
  const list = S().captures.filter(c => c.participantId === participantId).sort((a, b) => b.ts - a.ts);
  if(!list.length) return null;
  return {last:list[0], first:list[list.length - 1], count:list.length};
}
function metaText(participantId){
  const info = participantCaptureInfo(participantId);
  return info ? fmtTime(info.last.ts, info.last.tzOffset) + (info.count > 1 ? ` +${info.count - 1}` : '') : '';
}
// "Finish time" sorting: ascending by first recorded time, descending by last recorded time.
function timeSortKey(participantId, dir){
  const info = participantCaptureInfo(participantId);
  return info ? (dir === 'desc' ? info.last.ts : info.first.ts) : null;
}

// Fuzzy matching: prefix > substring > characters in order.
function fuzzyScore(query, text){
  query = query.toLowerCase().trim();
  text = text.toLowerCase();
  if(!query) return 0;
  if(text.startsWith(query)) return 100 - (text.length - query.length) * 0.1;
  const idx = text.indexOf(query);
  if(idx >= 0) return 70 - idx * 0.5 - (text.length - query.length) * 0.05;
  let ti = 0, matched = 0, first = -1, last = -1;
  for(const ch of query){
    let found = false;
    while(ti < text.length){
      if(text[ti] === ch){ if(first < 0) first = ti; last = ti; ti++; matched++; found = true; break; }
      ti++;
    }
    if(!found) break;
  }
  return matched === query.length ? 40 - (last - first + 1) * 0.5 : -1;
}

let editingParticipantId = null;
function buildParticipantRow(participant, opts){
  const row = document.createElement('li');
  row.className = opts.sorted ? 'sorted-row' : 'participant-row';
  row.dataset.id = participant.id;

  if(opts.sorted){
    const handle = document.createElement('span');
    handle.className = 'drag-handle';
    handle.textContent = '⠿';
    handle.dataset.edit = 'critical';
    handle.setAttribute('aria-label', t('action.drag'));
    row.appendChild(handle);
    initSortedDrag(handle);
    const key = shortcutIds().indexOf(participant.id);
    if(key >= 0){
      const kbd = document.createElement('span');
      kbd.className = 'kbd';
      kbd.textContent = String(key + 1);
      row.appendChild(kbd);
    }
  }

  const main = document.createElement('span');
  main.className = 'participant-main';
  if(editingParticipantId === participant.id){
    const input = document.createElement('input');
    input.className = 'edit-input';
    input.value = participant.name;
    input.maxLength = 60;
    main.appendChild(input);
    setTimeout(() => { input.focus(); input.select(); }, 0);
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); input.blur(); }
      else if(e.key === 'Escape'){ e.preventDefault(); input.dataset.cancel = '1'; editingParticipantId = null; renderAll(); }
    });
    input.addEventListener('blur', () => {
      if(input.dataset.cancel === '1') return;
      editingParticipantId = null;
      const name = cleanText(input.value);
      if(name && name !== participant.name) perform({type:'participant.rename', participantId:participant.id, name});
      renderAll();
    });
  }else{
    const nm = document.createElement('div');
    nm.className = 'nm';
    nm.dataset.edit = 'critical';
    nm.textContent = participant.name;
    onDoubleActivate(nm, () => recordTime(participant.id));
    main.appendChild(nm);
    const meta = metaText(participant.id);
    if(meta){
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = meta;
      main.appendChild(m);
    }
    if(!opts.sorted && S().ranking.includes(participant.id)){
      const pill = document.createElement('div');
      pill.className = 'rank-pill';
      pill.textContent = t('sorted.pill', {n: S().ranking.indexOf(participant.id) + 1});
      main.appendChild(pill);
    }
  }
  row.appendChild(main);

  const ops = document.createElement('span');
  ops.className = 'ops';
  const button = (label, titleKey, edit, onClick) => {
    const b = document.createElement('button');
    b.className = 'mini';
    b.textContent = label;
    b.title = t(titleKey);
    b.setAttribute('aria-label', b.title);
    b.dataset.edit = edit;
    b.addEventListener('click', (e) => { e.stopPropagation(); onClick(); });
    ops.appendChild(b);
  };
  if(opts.sorted){
    button('▲', 'action.up', 'critical', () => moveInRanking(participant.id, -1));
    button('▼', 'action.down', 'critical', () => moveInRanking(participant.id, 1));
    button('↩', 'action.unsort', 'critical', () => perform({type:'ranking.remove', participantId:participant.id}));
  }else{
    button('✎', 'action.rename', 'normal', () => { editingParticipantId = participant.id; renderAll(); });
    if(S().ranking.includes(participant.id)){
      button('↩', 'action.unsort', 'critical', () => perform({type:'ranking.remove', participantId:participant.id}));
    }else{
      button('→', 'action.sort', 'critical', () => perform({type:'ranking.add', participantId:participant.id}));
      button('✕', 'action.delete', 'normal', async () => {
        const ok = await askConfirm({title:t('participants.deleteTitle'), text:t('participants.deleteText', {name:participant.name}), ok:t('action.delete'), danger:true});
        if(ok) perform({type:'participant.delete', participantId:participant.id});
      });
    }
  }
  row.appendChild(ops);
  return row;
}

// ---------- sorted list ----------
const sortedList = document.getElementById('sortedList');
function renderSorted(){
  const s = S();
  sortedList.innerHTML = '';
  document.getElementById('sortedCount').textContent = s.ranking.length;
  document.getElementById('sortedEmpty').hidden = s.ranking.length > 0;
  s.ranking.forEach((id, i) => {
    const participant = participantById(id);
    if(participant) sortedList.appendChild(buildParticipantRow(participant, {sorted:true, rankIndex:i}));
  });
}
function moveInRanking(id, dir){
  const ranking = S().ranking;
  const i = ranking.indexOf(id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= ranking.length) return;
  // Moving up: insert before the previous participant. Moving down: insert before the participant after next.
  const beforeId = dir < 0 ? ranking[j] : (ranking[j + 1] !== undefined ? ranking[j + 1] : null);
  perform({type:'ranking.move', participantId:id, beforeId});
}

// Drag & drop with pointer events (mouse + touch). The listeners live on the document
// for the duration of a drag so the row keeps following the pointer off the handle.
let dragCtx = null;
function onDragMove(e){
  if(!dragCtx) return;
  const siblings = [...sortedList.querySelectorAll('.sorted-row')].filter(r => r !== dragCtx.row);
  let placed = false;
  for(const r of siblings){
    const rect = r.getBoundingClientRect();
    if(e.clientY < rect.top + rect.height / 2){ sortedList.insertBefore(dragCtx.row, r); placed = true; break; }
  }
  if(!placed) sortedList.appendChild(dragCtx.row);
}
function endDrag(){
  if(!dragCtx) return;
  const {row, originalNext} = dragCtx;
  dragCtx = null;
  row.classList.remove('dragging');
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', endDrag);
  document.removeEventListener('pointercancel', endDrag);
  const next = row.nextElementSibling;
  const beforeId = next ? next.dataset.id : null;
  if(beforeId !== originalNext) perform({type:'ranking.move', participantId:row.dataset.id, beforeId});
  renderSorted();
}
function initSortedDrag(handle){
  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const row = handle.closest('.sorted-row');
    const next = row.nextElementSibling;
    dragCtx = {row, originalNext: next ? next.dataset.id : null};
    row.classList.add('dragging');
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', endDrag);
    document.addEventListener('pointercancel', endDrag);
  });
}

  else if(btn.dataset.f === 'open') prefs.filterOpen = !prefs.filterOpen;
  else prefs.filterHideSorted = !prefs.filterHideSorted;

});
