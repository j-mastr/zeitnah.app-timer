function rememberConnection(serverUrl, code, name, keepKnown = false, worksetName = null){
  const list = recentConnections();
  const known = list.find(e => e.serverUrl === serverUrl && e.code === code);
  const next = name || (keepKnown && known ? known.name : null) || null;
  // A code bound to a station names it, so several codes of one race can be told apart.
  const station = worksetName || (keepKnown && known ? known.worksetName : null) || null;
  writeJson(KEYS.recent, [{serverUrl, code, name: next, worksetName: station}, ...list.filter(e => e !== known)]);

/**
 * Removes a race from the list. Its cached data and station go too, unless changes are still
 * waiting to be sent: then the cache stays, so connecting again later still delivers them.
 */
function forgetConnection(serverUrl, code){
  writeJson(KEYS.recent, recentConnections().filter(e => !(e.serverUrl === serverUrl && e.code === code)));
  const cacheKey = KEYS.cachePrefix + serverUrl + '|' + code;
  const cache = readJson(cacheKey);
  if(!(cache && Array.isArray(cache.pending) && cache.pending.length)){
    removeKey(cacheKey);
    removeKey(KEYS.worksetPrefix + serverUrl + '|' + code);
  }
}

function setBackend(next){
  if(backend) backend.destroy();
  backend = next;
  undoStack = [];
  redoStack = [];
  loadDeviceWorkset();
  renderAll();
  renderStatus();
  renderSettings();
}
function useLocal(){
  removeKey(KEYS.connection);
  setFragment(null);
  setBackend(new LocalBackend(backendHandlers));
}
function useServer(serverUrl, code, snapshot = null){
  writeJson(KEYS.connection, {serverUrl, code});
  rememberConnection(serverUrl, code, null, true);
  rememberedName = null;   // the name of this race is asserted again on the next render
  setFragment(code);
  const next = new ServerBackend(serverUrl, code, backendHandlers);
  next.seed(snapshot);
  setBackend(next);
  next.start();
  return next;
}

/**
 * Connects to a race. When the race is still empty on the server and this browser
 * has local data, offers to upload it. With interactive=false (link / page load) a
 * server that can't be reached doesn't abort: the client keeps retrying in the background.
 */
async function connectToRace(serverUrl, code, {interactive = true} = {}){
  let snapshot = null;
  try{
    snapshot = await api(serverUrl, '/api/races/' + code);
  }catch(e){
    if(e.code === 'not_found' || interactive) throw e;
  }
  if(snapshot && isOlderServer(snapshot)) throw new ApiError('server_outdated', 0);
  // The server names the code to keep (the same one, for now).
  if(snapshot && snapshot.access && typeof snapshot.access.code === 'string') code = snapshot.access.code;
  const local = localStore.load();
  const mayMerge = !snapshot || !snapshot.access || rulesAllow(snapshot.access.rules, [['race', null], ['merge', null]]);
  let upload = false;
  if(snapshot && snapshot.seq === 0 && hasData(local) && mayMerge && !localStore.tooNew){
    upload = await askConfirm({
      title: t('init.title'),
      text: t('init.text', {code, participants: local.participants.length, captures: local.captures.length}),
      ok: t('init.yes'), cancel: t('init.no'),
    });
  }
  const server = useServer(serverUrl, code, snapshot);
  toast(t('conn.connected', {code}));
  if(upload){
    const opId = server.dispatch({type:'state.merge', state:mergePayload(local)});
    if(await server.waitFor(opId)){
      toast(t('init.done'));
      renderSettings();
    }
  }
}
function mergePayload(s){
  return {schema:SCHEMA_VERSION, name:s.name, sport:s.sport, participants:s.participants, kinds:s.kinds,
    groupTypes:s.groupTypes, groups:s.groups, worksets:s.worksets, captures:s.captures};
}
function errorMessage(e, code){
  if(e && e.code === 'not_found') return t('err.notFound', {code});
  if(e && e.code === 'access_revoked') return t('err.revoked');
  if(e && e.code === 'client_outdated') return t('err.clientOutdated');
  if(e && e.code === 'server_outdated') return t('err.serverOutdated');
  if(e && e.code === 'network') return t('err.network');
  return t('err.generic', {msg: (e && (e.code || e.message)) || '?'});
}

/**
 * Runs operations through the active backend unless one of them is blocked (offline /
 * archived). Several operations (an array) are one step in the history, e.g. creating a
 * workset together with the ranking that needed it.
 */
function perform(opOrOps){
  const ops = Array.isArray(opOrOps) ? opOrOps : [opOrOps];
  const reason = ops.map(op => backend.blockReason(op)).find(Boolean);
  if(reason){ toast(t(reason)); return null; }
  if(ops.some(op => HISTORY_BARRIER_OPS.has(op.type))){
    clearHistory();
    let result = true;
    for(const op of ops) result = dispatchOp(op) || true;
    return result;
  }
  const entry = combinedEntry(S(), ops);
  const before = entry && footprint(S(), entry.parts);
  let result = true;
  for(const op of ops) result = dispatchOp(op) || true;
  const after = entry && footprint(S(), entry.parts);
  // Operations that changed nothing (duplicates, unknown references) aren't recorded.
  if(entry && after !== before){
    undoStack.push({...entry, before, after});
    if(undoStack.length > HISTORY_LIMIT) undoStack.shift();
    redoStack = [];
    renderHistory();
  }
  return result;
}

/** Sends one operation; remembers the worksets this device deletes itself (see syncDeviceWorkset). */
function dispatchOp(op){
  if(op.type === 'workset.delete') removedLocally.add(op.worksetId);
  return backend.dispatch(op);
}
/** One history entry for several operations: undone in reverse order, redone in order. */
function combinedEntry(s, ops){
  if(ops.length === 1) return historyEntry(s, ops[0]);
  const probe = clone(s), entries = [];
  for(const op of ops){
    const e = historyEntry(probe, op);
    if(e) entries.push(e);
    try{ applyOp(probe, clone(op)); }catch(err){}
  }
  if(!entries.length) return null;
  return {type: entries[entries.length - 1].type, parts: entries.flatMap(e => e.parts),
    undo: [...entries].reverse().flatMap(e => e.undo), redo: entries.flatMap(e => e.redo)};
}

// ---------- undo / redo ----------
const HISTORY_LIMIT = 50;
let undoStack = [];
let redoStack = [];
function clearHistory(){
  undoStack = [];
  redoStack = [];
  renderHistory();
}
const HISTORY_LABELS = {
  'race.rename': () => t('header.rename'),
  'race.setSport': () => t('history.sport'),
  'participants.add': () => t('history.participantsAdd'),
  'participant.rename': () => t('history.participantRename'),
  'participant.delete': () => t('history.participantDelete'),
  'workset.ranking.add': () => t('action.sort'),
  'workset.ranking.remove': () => t('action.unsort'),
  'workset.ranking.move': () => t('history.rankingMove'),
  'workset.add': () => t('history.worksetAdd'),
  'workset.rename': () => t('history.worksetRename'),
  'workset.delete': () => t('history.worksetDelete'),
  'workset.makeDefault': () => t('history.worksetDefault'),
  'capture.add': () => t('history.captureAdd'),
  'capture.assign': () => t('history.captureAssign'),
  'capture.target.add': () => t('history.captureAssign'),
  'capture.target.remove': () => t('history.captureAssign'),
  'capture.delete': () => t('history.captureDelete'),
  'capture.setKind': () => t('history.captureKind'),
  'workset.setKind': () => t('history.worksetKind'),
  'kind.add': () => t('history.kindAdd'),
  'kind.update': () => t('history.kindUpdate'),
  'kind.delete': () => t('history.kindDelete'),
  'groupType.add': () => t('history.groupTypeAdd'),
  'groupType.update': () => t('history.groupTypeUpdate'),
  'groupType.delete': () => t('history.groupTypeDelete'),
  'group.add': () => t('history.groupAdd'),
  'group.update': () => t('history.groupUpdate'),
  'group.delete': () => t('history.groupDelete'),
  'group.members.add': () => t('history.groupMembers'),
  'group.members.remove': () => t('history.groupMembers'),
};
const historyLabel = (entry) => HISTORY_LABELS[entry.type]();

/**
 * Undoes (redo = false) or redoes the latest entry. An entry whose parts were changed
 * elsewhere in the meantime is refused with a toast and dropped, so the next step can
 * go on with the one below it.
 */
function stepHistory(redo){
  const from = redo ? redoStack : undoStack;
  const to = redo ? undoStack : redoStack;
  const entry = from[from.length - 1];
  if(!entry) return;
  const ops = redo ? entry.redo : entry.undo;
  const reason = ops.map(op => backend.blockReason(op)).find(Boolean);
  if(reason){ toast(t(reason)); return; }
  const expected = redo ? entry.before : entry.after;
  const target = redo ? entry.after : entry.before;
  from.pop();
  if(footprint(S(), entry.parts) !== expected || footprintAfter(S(), ops, entry.parts) !== target){
    const action = historyLabel(entry);
    toast(redo ? t('history.redoConflict', {action}) : t('history.undoConflict', {action}));
    renderHistory();
    return;
  }
  to.push(entry);
  // Fresh copies: a dispatched operation gets its opId attached, and a resent opId
  // would be taken for a duplicate.
  for(const op of ops){
    const copy = clone(op);
    delete copy.opId;
    dispatchOp(copy);
  }
  renderHistory();
  const action = historyLabel(entry);
  toast(redo ? t('history.redone', {action}) : t('history.undone', {action}));
}
const undoBtn = document.getElementById('undoBtn');
const redoBtn = document.getElementById('redoBtn');
function renderHistory(){
  const undo = undoStack[undoStack.length - 1], redo = redoStack[redoStack.length - 1];
  // Discreet until used: the pair appears with the first step that can be undone.
  document.getElementById('historyBtns').hidden = !undo && !redo;
  undoBtn.disabled = !undo;
  redoBtn.disabled = !redo;
  undoBtn.title = (undo ? t('history.undo', {action: historyLabel(undo)}) : t('history.undoNone')) + ` (${keyCombo(UNDO_KEYS)})`;
  redoBtn.title = (redo ? t('history.redo', {action: historyLabel(redo)}) : t('history.redoNone')) + ` (${keyCombo(REDO_KEYS)})`;
  undoBtn.setAttribute('aria-label', undoBtn.title);
  redoBtn.setAttribute('aria-label', redoBtn.title);
}
undoBtn.addEventListener('click', () => stepHistory(false));
redoBtn.addEventListener('click', () => stepHistory(true));

// =====================================================================
// Formatting helpers
// =====================================================================
function two(n){ return String(n).padStart(2, '0'); }
function fmtClockParts(d){
  return {main:`${two(d.getHours())}:${two(d.getMinutes())}:${two(d.getSeconds())}`, cs:String(d.getMilliseconds()).padStart(3, '0').slice(0, 2)};
}
/**
 * A capture is stored as the instant `ts` plus the `tzOffset` of the device that recorded
 * it, so it is always rendered in the time zone it was taken in (falling back to this
 * device's zone for data without an offset). `shifted()` moves the instant so that the
 * UTC getters read the local wall clock of that zone.
 */
function captureZone(tzOffset){ return Number.isInteger(tzOffset) ? tzOffset : -new Date().getTimezoneOffset(); }
function shifted(ts, tzOffset){ return new Date(ts + captureZone(tzOffset) * 60000); }
function fmtTime(ts, tzOffset){
  const d = shifted(ts, tzOffset);
  return `${two(d.getUTCHours())}:${two(d.getUTCMinutes())}:${two(d.getUTCSeconds())}.${String(d.getUTCMilliseconds()).padStart(3, '0').slice(0, 2)}`;
}
/** YYYY-MM-DD in the capture's own time zone. */
function fmtDate(ts, tzOffset){
  const d = shifted(ts, tzOffset);
  return `${d.getUTCFullYear()}-${two(d.getUTCMonth() + 1)}-${two(d.getUTCDate())}`;
}
/** The date as the user reads it, e.g. "25. September 2026". */
function fmtDateLong(ts, tzOffset){
  return shifted(ts, tzOffset).toLocaleDateString(locale(), {year:'numeric', month:'long', day:'numeric', timeZone:'UTC'});
}
/** Full ISO 8601 timestamp with date and time zone, e.g. 2026-09-25T14:33:12.45+02:00. */
function fmtIso(ts, tzOffset){
  const off = captureZone(tzOffset), sign = off < 0 ? '-' : '+', abs = Math.abs(off);
  return `${fmtDate(ts, tzOffset)}T${fmtTime(ts, tzOffset)}${sign}${two(Math.floor(abs / 60))}:${two(abs % 60)}`;
}
/** True while the capture falls on the same local day as this device's current date. */
function isToday(ts, tzOffset){
  const now = new Date();
  return fmtDate(ts, tzOffset) === `${now.getFullYear()}-${two(now.getMonth() + 1)}-${two(now.getDate())}`;
}
function fmtDelta(ms){
  if(ms < 0) ms = 0;
  const totalCs = Math.floor(ms / 10), cs = totalCs % 100, totalSec = Math.floor(totalCs / 100);
  const s = totalSec % 60, m = Math.floor(totalSec / 60) % 60, h = Math.floor(totalSec / 3600);
  return (h > 0 ? two(h) + ':' : '') + two(m) + ':' + two(s) + '.' + two(cs);
}

// ---------- clock ----------
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('dateLine');
let lastDateText = '';
function tickClock(){
  const d = new Date();
  const p = fmtClockParts(d);
  clockEl.innerHTML = `${p.main}<span class="cs">.${p.cs}</span>`;
  const dateText = d.toLocaleDateString(locale(), {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  if(dateText !== lastDateText){ dateEl.textContent = dateText; lastDateText = dateText; }
  requestAnimationFrame(tickClock);
}
requestAnimationFrame(tickClock);

// ---------- toast ----------
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ---------- confirmation dialog ----------
const dialogEl = document.getElementById('dialog');
function askConfirm({title, text, ok, cancel, danger = false}){
  return new Promise(resolve => {
    document.getElementById('dialogTitle').textContent = title;
    document.getElementById('dialogText').textContent = text;
    const okBtn = document.getElementById('dialogOk');
    const cancelBtn = document.getElementById('dialogCancel');
    okBtn.textContent = ok;
    cancelBtn.textContent = cancel || t('dialog.cancel');
    okBtn.className = 'btn ' + (danger ? 'danger' : 'primary');
    const previousFocus = document.activeElement;
    lockScroll(true);
    dialogEl.hidden = false;
    okBtn.focus({preventScroll: true});
    const close = (result) => {
      dialogEl.hidden = true;
      lockScroll(false);
      okBtn.onclick = cancelBtn.onclick = null;
      dialogEl.onkeydown = null;
      if(previousFocus && previousFocus.focus) previousFocus.focus({preventScroll: true});
      resolve(result);
    };
    okBtn.onclick = () => close(true);
    cancelBtn.onclick = () => close(false);
    dialogEl.onkeydown = (e) => { if(e.key === 'Escape'){ e.preventDefault(); close(false); } };
  });
}

// ---------- background scroll lock ----------
// While an overlay covers the app, only the overlay scrolls. `overflow:hidden` on the body
// is ignored by iOS Safari, so the body is fixed at the current offset and restored after.
let scrollLocks = 0;
let scrollLockY = 0;
function lockScroll(on){
  if(on){
    if(scrollLocks++ > 0) return;
    scrollLockY = window.scrollY;
    document.body.classList.add('scroll-locked');
    document.body.style.top = -scrollLockY + 'px';
  }else{
    if(scrollLocks === 0 || --scrollLocks > 0) return;
    document.body.classList.remove('scroll-locked');
    document.body.style.top = '';
    window.scrollTo(0, scrollLockY);
  }
}

// ---------- shortcuts dialog ----------
// Opens from the settings link, or while Ctrl/Cmd is held down (it closes on release).
const shortcutsEl = document.getElementById('shortcuts');
const APPLE = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent || '');
const MOD_KEY = APPLE ? '⌘' : 'Ctrl';
// Platform conventions: ⌘Z / ⇧⌘Z on Apple devices, Ctrl+Z / Ctrl+Y (or Ctrl+Shift+Z) elsewhere.
const UNDO_KEYS = [MOD_KEY, 'Z'];
const REDO_KEYS = APPLE ? ['⇧', '⌘', 'Z'] : ['Ctrl', 'Y'];
const keyCombo = (keys) => keys.join(APPLE ? '' : '+');
function renderKeycaps(el, keys){
  el.replaceChildren(...keys.map(key => Object.assign(document.createElement('span'), {className:'kbd', textContent:key})));
}
let shortcutsHeld = false;      // opened by holding a key, so the release closes it again
let shortcutsFocus = null;
function openShortcuts(held){
  if(!shortcutsEl.hidden) return;
  shortcutsHeld = !!held;
  shortcutsFocus = document.activeElement;
  lockScroll(true);
  shortcutsEl.hidden = false;
  if(!held) document.getElementById('shortcutsClose').focus({preventScroll: true});
}
function closeShortcuts(){
  if(shortcutsEl.hidden) return;
  shortcutsHeld = false;
  shortcutsEl.hidden = true;
  lockScroll(false);
  if(shortcutsFocus && shortcutsFocus.focus) shortcutsFocus.focus({preventScroll: true});
  shortcutsFocus = null;
}
document.getElementById('showShortcutsBtn').addEventListener('click', () => openShortcuts(false));
document.getElementById('footShortcutsBtn').addEventListener('click', () => openShortcuts(false));
document.getElementById('shortcutsClose').addEventListener('click', closeShortcuts);
shortcutsEl.addEventListener('click', (e) => { if(e.target === shortcutsEl) closeShortcuts(); });

// Ctrl/Cmd opens the list only when it is held on its own: a combination like ⌘C presses
// another key within the delay and cancels it.
const SHORTCUTS_HOLD_MS = 1500;
let shortcutsHoldTimer = null;
function cancelShortcutsHold(){ clearTimeout(shortcutsHoldTimer); shortcutsHoldTimer = null; }
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && !shortcutsEl.hidden){ e.preventDefault(); closeShortcuts(); return; }
  if(e.key !== 'Control' && e.key !== 'Meta'){ cancelShortcutsHold(); return; }
  if(e.repeat || shortcutsHoldTimer || !dialogEl.hidden || !shortcutsEl.hidden || !document.getElementById('stationDialog').hidden
    || !document.getElementById('membersDialog').hidden) return;
  // Not while typing: there Ctrl/Cmd starts an editing shortcut, not a lookup.
  const el = document.activeElement;
  const tag = (el && el.tagName) || '';
  if(['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) || (el && el.isContentEditable)) return;
  shortcutsHoldTimer = setTimeout(() => { shortcutsHoldTimer = null; openShortcuts(true); }, SHORTCUTS_HOLD_MS);
});
document.addEventListener('keyup', (e) => {
  if(e.key !== 'Control' && e.key !== 'Meta') return;
  cancelShortcutsHold();
  if(shortcutsHeld) closeShortcuts();
});
// A key combination can take the focus away before the release arrives (⌘Tab).
window.addEventListener('blur', () => { cancelShortcutsHold(); if(shortcutsHeld) closeShortcuts(); });

// ---------- double-activate (dblclick / double-tap) ----------
const lastTap = new WeakMap();
function onDoubleActivate(el, cb){
  el.addEventListener('click', (e) => {
    const now = Date.now();
    if(now - (lastTap.get(el) || 0) < 450){ lastTap.set(el, 0); cb(e); }
    else lastTap.set(el, now);
  });
}

// ---------- participant helpers ----------
const participantById = (id) => S().participants.find(b => b.id === id);
/*
 * Group membership is resolved when reading, from the groups as they are now (docs/groups.md):
 * a capture targeting a group applies to the participants in it — directly or through nested
 * groups. Cached per render (reset in renderAll()).
 */
let groupMembersCache = null;
/** The ids of the participants in a group, through nested groups; cycle-safe. */
function groupParticipantIds(s, groupId){
  if(!groupMembersCache) groupMembersCache = new Map();
  if(groupMembersCache.has(groupId)) return groupMembersCache.get(groupId);
  const ids = new Set(), seen = new Set(), queue = [groupId];
  while(queue.length){
    const g = findGroup(s, queue.shift());
    if(!g || seen.has(g.id)) continue;
    seen.add(g.id);
    for(const m of g.members) (m.type === 'group' ? queue.push(m.id) : ids.add(m.id));
  }
  groupMembersCache.set(groupId, ids);
  return ids;
}
/** The participant ids refs resolve to: participants themselves, groups to their members. */
function resolveRefs(s, refs){
  const ids = new Set();
  for(const r of refs){
    if(r.type === 'participant') ids.add(r.id);
    else for(const id of groupParticipantIds(s, r.id)) ids.add(id);
  }
  return ids;
}
/** The ids of the participants a capture applies to (its targets, groups resolved). */
const captureParticipantIds = (c) => [...resolveRefs(S(), c.targets)];
/** The groups a participant is in, directly or through nested groups. */
const participantGroups = (s, id) => s.groups.filter(g => groupParticipantIds(s, g.id).has(id));
/** The participant's finishes (captures of the finish kind), or null without any. */
function participantCaptureInfo(participantId){
  const s = S();
  const list = s.captures.filter(c => captureParticipantIds(c).includes(participantId) && kindRole(s, c.kind) === 'finish').sort((a, b) => b.ts - a.ts);
  if(!list.length) return null;
  return {last:list[0], first:list[list.length - 1], count:list.length};
}
function metaText(participantId){
  const info = participantCaptureInfo(participantId);
  if(!info) return '';
  const elapsed = elapsedFor(info.last, participantId);
  return fmtTime(info.last.ts, info.last.tzOffset) + (info.count > 1 ? ` +${info.count - 1}` : '')
    + (elapsed !== null ? ' · ' + t('captures.elapsed', {time: fmtDelta(elapsed)}) : '');
}
// "Finish time" sorting: ascending by first recorded time, descending by last recorded time.
// "Elapsed" works the same way with the elapsed time of those finishes.
function timeSortKey(participantId, dir, elapsed = false){
  const info = participantCaptureInfo(participantId);
  if(!info) return null;
  const c = dir === 'desc' ? info.last : info.first;
  return elapsed ? elapsedFor(c, participantId) : c.ts;
}

// ---------- access (what this device's code allows) ----------
const accessRules = () => backend.accessInfo().rules;
/** Whether the code allows a permission path (a rule-like string or segments). */
function can(path){
  return rulesAllow(accessRules(), typeof path === 'string' ? (parseRule(path) || []) : path);
}
/** A code bound to particular stations (it can't see or manage the others). */
const restrictedAccess = () => restrictedToWorksets(accessRules());
/** Recording needs `capture.add` on this device's station, or a plain one without a station. */
function canRecord(){
  const w = currentWorkset();
  return can([...captureScope(w ? w.id : null), ['add', null]]);
}
/** Hides what the code doesn't allow (elements marked data-perm="<path>"). */
function applyPermissions(){
  document.querySelectorAll('[data-perm]').forEach(el => el.classList.toggle('perm-hidden', !can(el.dataset.perm)));
}

// ---------- this device's station (workset) ----------
/*
 * A device works on one workset at a time. It is stored per connection (never synced) as
 * {id}: a workset id, or null for "no station" (an explicit choice). Nothing stored means the
 * device never joined one, which only lasts while the race has no worksets: as soon as one
 * exists the device joins the default, explicitly (syncDeviceWorkset). From then on only the
 * stored id counts; nothing falls back to the default implicitly.
 */
let deviceWorkset;               // string | null | undefined, see above
let deviceWorksetLabel = '';     // the current station's label, for the notice once it is gone
let worksetNotice = null;        // {name} after another device deleted this device's station
const removedLocally = new Set();   // worksets this device deleted itself: no notice for those
function worksetStorageKey(){
  return KEYS.worksetPrefix + (backend.kind === 'server' ? backend.serverUrl + '|' + backend.code : 'local');
}
function loadDeviceWorkset(){
  const v = readJson(worksetStorageKey());
  deviceWorkset = v && (v.id === null || (typeof v.id === 'string' && ID_RE.test(v.id))) ? v.id : undefined;
  worksetNotice = null;
  backend.announceWorkset(deviceWorkset || null);
}
function storeDeviceWorkset(id){
  deviceWorkset = id;
  if(id === undefined) removeKey(worksetStorageKey()); else writeJson(worksetStorageKey(), {id});
  if(id) worksetNotice = null;
  backend.announceWorkset(id || null);
}
function currentWorkset(s = S()){ return deviceWorkset ? findWorkset(s, deviceWorkset) || null : null; }
const currentRanking = () => { const w = currentWorkset(); return w ? w.ranking : []; };
/** The kind this device's captures get: its workset's, finish without one. */
const stickyKind = () => { const w = currentWorkset(); return w ? w.captureKind : DEFAULT_KIND; };
const worksetLabel = (w) => w.name || t('worksets.defaultName', {n: w.number});
function worksetLabelById(id, s = S()){
  const w = findWorkset(s, id);
  // A code bound to stations doesn't see the others: an unknown one may just be out of sight.
  return w ? worksetLabel(w) : t(restrictedAccess() ? 'worksets.other' : 'worksets.deleted');
}
/** Keeps the device's station explicit (see above). Runs before every render. */
function syncDeviceWorkset(){
  if(!backend.isReady()) return;
  const s = S();
  if(deviceWorkset === undefined){
    if(!s.worksets.length) return;
    storeDeviceWorkset(s.worksets[0].id);
  }
  if(deviceWorkset === null){
    // No workset left at all: as if there never had been one.
    if(!s.worksets.length) storeDeviceWorkset(undefined);
    return;
  }
  const w = findWorkset(s, deviceWorkset);
  if(w){
    deviceWorksetLabel = worksetLabel(w);
    removedLocally.delete(w.id);
    return;
  }
  // The station is gone.
  const own = removedLocally.delete(deviceWorkset);
  if(!s.worksets.length){ storeDeviceWorkset(undefined); return; }
  // A device that may record without a station carries on without one and says so.
  if(own || can([['capture', null], ['add', null]])){
    storeDeviceWorkset(null);
    if(!own) worksetNotice = {name: deviceWorksetLabel};
    return;
  }
  // Otherwise it needs another one right away: the only one left, or the one the user picks.
  if(s.worksets.length === 1){
    storeDeviceWorkset(s.worksets[0].id);
    toast(t('worksets.switched', {name: deviceWorksetLabel, next: worksetLabel(s.worksets[0])}));
    return;
  }
  storeDeviceWorkset(null);
  chooseStation(deviceWorksetLabel);
}

function ensureWorkset(){

// ---------- capture kinds ----------
function kindLabel(kind, s = S()){
  if(BUILTIN_KINDS.includes(kind)) return t(`kind.${kind}`);
  const k = findKind(s, kind);
  return k ? k.name : t('kinds.deleted');
}
const allKinds = (s = S()) => [...BUILTIN_KINDS, ...s.kinds.map(k => k.id)];
const roleClass = (kind, s = S()) => 'kind-' + kindRole(s, kind);
// The kind for the next capture only (this device, in memory); afterwards the workset's kind applies again.
let nextKind = null;
function effectiveKind(){
  return nextKind && isKnownKind(S(), nextKind) ? nextKind : stickyKind();
}
/** Kinds stay out of sight until somebody uses them: a kind picked, a custom kind, a typed capture. */
function kindsUnlocked(){
  const s = S();
  return !!nextKind || s.worksets.some(w => w.captureKind !== DEFAULT_KIND) || s.kinds.length > 0 || s.captures.some(c => c.kind !== DEFAULT_KIND);
}
/** Sticky choice: synced to every device on this device's station (created if there is none). */
function setStickyKind(kind){
  nextKind = null;
  if(kind !== stickyKind()) performOnWorkset(worksetId => ({type:'workset.setKind', worksetId, kind}));
  renderAll();
}
function armNextKind(kind){
  nextKind = kind && kind !== stickyKind() ? kind : null;
  renderAll();
}
function cycleKind(once){
  const kinds = allKinds();
  const current = once ? effectiveKind() : stickyKind();
  const next = kinds[(kinds.indexOf(current) + 1) % kinds.length];
  if(once) armNextKind(next); else setStickyKind(next);
}

/*
 * Derived facts per capture, computed once per render: its role, its place among the
 * captures of the same kind, the previous capture of that kind, the number of a split-role
 * capture among the participant's captures of that kind (only for a capture of exactly one
 * participant), and the elapsed time of a finish per participant (`elapsedBy`: since its own
 * latest start, else the latest start of a group it is in, else the latest unassigned start
 * before it) — `elapsed` is that time when it is the same for all of them (or the unassigned
 * start's for an unassigned finish), else null.
 */
let factsCache = null;   // reset in renderAll(), like groupMembersCache
function captureFacts(){
  if(factsCache) return factsCache;
  const s = S();
  const facts = new Map(), count = new Map(), last = new Map(), numbers = new Map(), ownStart = new Map(), groupStart = new Map();
  let freeStart = null;
  for(const c of sortedCaptures(s)){
    const role = kindRole(s, c.kind);
    const place = (count.get(c.kind) || 0) + 1;
    count.set(c.kind, place);
    const prev = last.get(c.kind) || null;
    last.set(c.kind, c);
    const pids = captureParticipantIds(c);
    let number = null, elapsed = null, elapsedBy = null;
    if(role === 'split' && pids.length === 1){
      const key = c.kind + '|' + pids[0];
      number = (numbers.get(key) || 0) + 1;
      numbers.set(key, number);
    }
    if(role === 'start'){
      // A start for a group (e.g. a fleet) is the start of each of its members.
      const direct = c.targets.filter(x => x.type === 'participant').map(x => x.id);
      if(!c.targets.length) freeStart = c;
      direct.forEach(p => ownStart.set(p, c));
      pids.filter(p => !direct.includes(p)).forEach(p => groupStart.set(p, c));
    }else if(role === 'finish'){
      const elapsedOf = (p) => { const start = (p && (ownStart.get(p) || groupStart.get(p))) || freeStart; return start ? c.ts - start.ts : null; };
      elapsedBy = new Map(pids.map(p => [p, elapsedOf(p)]));
      const values = pids.length ? [...elapsedBy.values()] : [elapsedOf(null)];
      elapsed = values.every(v => v === values[0]) ? values[0] : null;
    }
    facts.set(c.id, {role, place, prev, number, elapsed, elapsedBy});
  }
  return (factsCache = facts);
}
/** The elapsed time of a finish for one of its participants. */
function elapsedFor(c, participantId){
  const f = captureFacts().get(c.id);
  return f.elapsedBy && f.elapsedBy.has(participantId) ? f.elapsedBy.get(participantId) : f.elapsed;
}
function sortedCaptures(s){ return [...s.captures].sort((a, b) => a.ts - b.ts || (a.id < b.id ? -1 : 1)); }
/** Label of a capture's kind, with its number for split-role kinds ("Mark rounding 2"). */
function captureKindText(c){
  const f = captureFacts().get(c.id);
  return kindLabel(c.kind) + (f && f.number ? ' ' + f.number : '');
}

// Fuzzy matching: prefix > substring > characters in order.
function fuzzyScore(query, text){
  query = query.toLowerCase().trim();
  text = text.toLowerCase();
  if(!query) return 0;
  if(text.startsWith(query)) return 100 - (text.length - query.length) * 0.1;
  const idx = text.indexOf(query);
  if(idx >= 0) return 70 - idx * 0.5 - (text.length - query.length) * 0.05;
  let ti = 0, matched = 0, first = -1, last = -1;
  for(const ch of query){
    let found = false;
    while(ti < text.length){
      if(text[ti] === ch){ if(first < 0) first = ti; last = ti; ti++; matched++; found = true; break; }
      ti++;
    }
    if(!found) break;
  }
  return matched === query.length ? 40 - (last - first + 1) * 0.5 : -1;
}

let editingParticipantId = null;
function buildParticipantRow(participant, opts){

  if(opts.sorted){

      kbd.textContent = String(key + 1);

  }

  const main = document.createElement('span');

    input.maxLength = 60;

    setTimeout(() => { input.focus(); input.select(); }, 0);
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); input.blur(); }
      else if(e.key === 'Escape'){ e.preventDefault(); input.dataset.cancel = '1'; editingParticipantId = null; renderAll(); }
    });
    input.addEventListener('blur', () => {
      if(input.dataset.cancel === '1') return;

      const name = cleanText(input.value);

      renderAll();
    });
  }else{
    const nm = document.createElement('div');
    nm.className = 'nm';
    nm.dataset.edit = 'critical';
    nm.textContent = participant.name;
    onDoubleActivate(nm, () => recordTime(participant.id));
    main.appendChild(nm);
    const meta = metaText(participant.id);
    if(meta){
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = meta;
      main.appendChild(m);
    }
    // The groups it is in directly, once there are groups at all.
    const groups = S().groups.filter(g => g.members.some(m => m.type === 'participant' && m.id === participant.id));
    if(groups.length){
      const tags = document.createElement('div');
      tags.className = 'group-tags';
      tags.replaceChildren(...groups.map(g => {
        const tag = document.createElement('span');
        tag.className = 'group-tag';
        tag.textContent = g.name;
        return tag;
      }));
      main.appendChild(tags);
    }
    if(!opts.sorted && currentRanking().includes(participant.id)){
      const pill = document.createElement('div');
      pill.className = 'rank-pill';
      pill.textContent = t('sorted.pill', {n: currentRanking().indexOf(participant.id) + 1});
      main.appendChild(pill);
    }
  }
  row.appendChild(main);

  const ops = document.createElement('span');
  ops.className = 'ops';
  const button = (label, titleKey, edit, onClick) => {
    const b = document.createElement('button');
    b.className = 'mini';
    b.textContent = label;
    b.title = t(titleKey);
    b.setAttribute('aria-label', b.title);
    b.dataset.edit = edit;
    b.addEventListener('click', (e) => { e.stopPropagation(); onClick(); });
    ops.appendChild(b);
  };
  if(opts.sorted){
    button('▲', 'action.up', 'critical', () => moveInRanking(participant.id, -1));
    button('▼', 'action.down', 'critical', () => moveInRanking(participant.id, 1));
    button('↩', 'action.unsort', 'critical', () => unrank(participant.id));
  }else{
    if(can('participant.rename')) button('✎', 'action.rename', 'normal', () => { editingParticipantId = participant.id; renderAll(); });
    if(currentRanking().includes(participant.id)){
      button('↩', 'action.unsort', 'critical', () => unrank(participant.id));
    }else{
      button('→', 'action.sort', 'critical', () => rank(participant.id));
      if(can('participant.delete')) button('✕', 'action.delete', 'normal', async () => {

        if(ok) perform({type:'participant.delete', participantId:participant.id});
      });
    }
  }
  row.appendChild(ops);
  return row;
}

  const s = S();

  const role = kindRole(s, w.captureKind);
  document.getElementById('sortedTitle').textContent = role === 'start' ? t('sorted.titleStart')
    : role === 'split' ? t('sorted.titleSplit', {kind: kindLabel(w.captureKind)}) : t('sorted.title');
  sortedList.innerHTML = '';
  document.getElementById('sortedCount').textContent = w.ranking.length;
  document.getElementById('sortedEmpty').hidden = w.ranking.length > 0;
  w.ranking.forEach((id, i) => {
    const participant = participantById(id);
    if(participant) sortedList.appendChild(buildParticipantRow(participant, {sorted:true, rankIndex:i}));

function moveInRanking(id, dir){
  const w = currentWorkset();
  if(!w) return;
  const ranking = w.ranking;
  const i = ranking.indexOf(id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= ranking.length) return;
  // Moving up: insert before the previous participant. Moving down: insert before the participant after next.
  const beforeId = dir < 0 ? ranking[j] : (ranking[j + 1] !== undefined ? ranking[j + 1] : null);
  perform({type:'workset.ranking.move', worksetId:w.id, participantId:id, beforeId});
}

// Drag & drop with pointer events (mouse + touch). The listeners live on the document
// for the duration of a drag so the row keeps following the pointer off the handle.
let dragCtx = null;
function onDragMove(e){
  if(!dragCtx) return;
  const siblings = [...sortedList.querySelectorAll('.sorted-row')].filter(r => r !== dragCtx.row);
  let placed = false;
  for(const r of siblings){
    const rect = r.getBoundingClientRect();
    if(e.clientY < rect.top + rect.height / 2){ sortedList.insertBefore(dragCtx.row, r); placed = true; break; }
  }
  if(!placed) sortedList.appendChild(dragCtx.row);
}
function endDrag(){
  if(!dragCtx) return;
  const {row, originalNext} = dragCtx;
  dragCtx = null;
  row.classList.remove('dragging');
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', endDrag);
  document.removeEventListener('pointercancel', endDrag);
  const next = row.nextElementSibling;
  const beforeId = next ? next.dataset.id : null;
  const w = currentWorkset();
  if(w && beforeId !== originalNext) perform({type:'workset.ranking.move', worksetId:w.id, participantId:row.dataset.id, beforeId});
  renderSorted();
}
function initSortedDrag(handle){
  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const row = handle.closest('.sorted-row');
    const next = row.nextElementSibling;
    dragCtx = {row, originalNext: next ? next.dataset.id : null};
    row.classList.add('dragging');
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', endDrag);
    document.addEventListener('pointercancel', endDrag);
  });
}

  const q = rankSearch.value.trim();
  rankSearchResults.innerHTML = '';
  if(!q){ rankSearchResults.hidden = true; currentMatches = []; selectedMatchId = null; rankSearch.removeAttribute('aria-activedescendant'); return; }
  const ranking = currentRanking();
  currentMatches = S().participants
    .filter(b => !ranking.includes(b.id))
    .map(b => ({b, score:fuzzyScore(q, b.name)}))
    .filter(x => x.score >= 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 8)
    .map(x => x.b);
  if(!currentMatches.length){
    const d = document.createElement('div');
    d.className = 'search-empty';
    d.textContent = t('sorted.noMatch');
    rankSearchResults.appendChild(d);
  }
  if(!currentMatches.some(b => b.id === selectedMatchId)) selectedMatchId = null;
  currentMatches.forEach((b, i) => {
    const d = document.createElement('div');
    d.className = 'res' + (b.id === selectedMatchId ? ' sel' : '');
    d.id = 'rankMatch' + i;
    d.setAttribute('role', 'option');
    d.setAttribute('aria-selected', b.id === selectedMatchId ? 'true' : 'false');
    d.textContent = b.name;
    d.addEventListener('mousedown', e => e.preventDefault());
    d.addEventListener('click', () => { addFromSearch(b.id); rankSearch.focus(); });
    rankSearchResults.appendChild(d);
    if(b.id === selectedMatchId){
      rankSearch.setAttribute('aria-activedescendant', d.id);
      requestAnimationFrame(() => d.scrollIntoView({block: 'nearest'}));
    }
  });
  if(!selectedMatchId) rankSearch.removeAttribute('aria-activedescendant');
  rankSearchResults.hidden = false;
}
/** Moves the selection; without one, both directions start at the first match. */
function moveSearchSelection(step){
  if(!currentMatches.length) return;
  const i = currentMatches.findIndex(b => b.id === selectedMatchId);
  selectedMatchId = currentMatches[i < 0 ? 0 : (i + step + currentMatches.length) % currentMatches.length].id;
  renderSearchResults();
}
function addFromSearch(participantId){
  rank(participantId);
  rankSearch.value = '';
  renderSearchResults();
}
rankSearch.addEventListener('input', renderSearchResults);
rankSearch.addEventListener('keydown', (e) => {
  const selected = currentMatches.find(b => b.id === selectedMatchId) || currentMatches[0];
  if(e.key === 'Enter'){ e.preventDefault(); if(selected) addFromSearch(selected.id); }
  else if(e.key === 'ArrowDown'){ e.preventDefault(); moveSearchSelection(1); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); moveSearchSelection(-1); }
  // Tab picks up the list, but only while nothing is selected — otherwise it still leaves the field.
  else if(e.key === 'Tab' && !e.shiftKey && !selectedMatchId && currentMatches.length){ e.preventDefault(); moveSearchSelection(1); }
  else if(e.key === 'Escape'){ rankSearch.value = ''; renderSearchResults(); rankSearch.blur(); }
});

const SORT_FIELDS = ['manual', 'alpha', 'time', 'elapsed'];
// Elapsed times need a start: until one is recorded the option is hidden and sorts like finish time.
const hasStarts = () => S().captures.some(c => kindRole(S(), c.kind) === 'start');
const sortField = () => (prefs.sortField === 'elapsed' && !hasStarts() ? 'time' : prefs.sortField);
function setFilter(which){
  if(which === 'all'){ prefs.filterOpen = false; prefs.filterHideSorted = false; }
  else if(which === 'open') prefs.filterOpen = !prefs.filterOpen;
  else prefs.filterHideSorted = !prefs.filterHideSorted;
  savePrefs(); renderParticipants();
}
function setSortField(field){ prefs.sortField = field; savePrefs(); renderParticipants(); }
function cycleSortField(){
  const fields = hasStarts() ? SORT_FIELDS : SORT_FIELDS.filter(f => f !== 'elapsed');
  setSortField(fields[(fields.indexOf(sortField()) + 1) % fields.length]);
}
function toggleSortDir(){ prefs.sortDir = prefs.sortDir === 'asc' ? 'desc' : 'asc'; savePrefs(); renderParticipants(); }

function renderParticipants(){
  const s = S();
  document.querySelectorAll('#filterSeg button').forEach(b => {
    const f = b.dataset.f;
    b.classList.toggle('active', f === 'all' ? (!prefs.filterOpen && !prefs.filterHideSorted) : (f === 'open' ? prefs.filterOpen : prefs.filterHideSorted));
  });
  const field = sortField();
  document.querySelectorAll('#sortFieldSeg button').forEach(b => b.classList.toggle('active', b.dataset.sf === field));
  document.querySelector('#sortFieldSeg [data-sf="elapsed"]').hidden = !hasStarts();
  document.getElementById('sortDirBtn').textContent = prefs.sortDir === 'desc' ? '↓' : '↑';

  // Filter by group (members through nested groups too), once there are groups.
  const filterBar = document.getElementById('groupFilterBar');
  filterBar.hidden = !s.groups.length;
  const groupFilter = s.groups.length && findGroup(s, prefs.groupFilter) ? prefs.groupFilter : '';
  if(s.groups.length) fillGroupSelect(document.getElementById('groupFilter'), s, t('groups.filterAll'), groupFilter);

  let list = s.participants.map((b, i) => ({b, i}));
  if(groupFilter){ const ids = groupParticipantIds(s, groupFilter); list = list.filter(x => ids.has(x.b.id)); }
  const ranking = currentRanking();
  if(prefs.filterHideSorted) list = list.filter(x => !ranking.includes(x.b.id));
  if(prefs.filterOpen) list = list.filter(x => !participantCaptureInfo(x.b.id));
  const dir = prefs.sortDir === 'desc' ? -1 : 1;
  if(field === 'alpha'){
    list.sort((x, y) => dir * x.b.name.localeCompare(y.b.name, locale(), {numeric:true}));
  }else if(field === 'time' || field === 'elapsed'){
    const elapsed = field === 'elapsed';
    list.sort((x, y) => {
      const kx = timeSortKey(x.b.id, prefs.sortDir, elapsed), ky = timeSortKey(y.b.id, prefs.sortDir, elapsed);
      if(kx === null && ky === null) return x.i - y.i;
      if(kx === null) return 1;
      if(ky === null) return -1;
      return dir * (kx - ky);
    });
  }else{
    list.sort((x, y) => dir * (x.i - y.i));
  }

  participantList.innerHTML = '';
  document.getElementById('participantCount').textContent = s.participants.length;
  const empty = document.getElementById('participantEmpty');
  empty.hidden = list.length > 0;
  empty.textContent = s.participants.length === 0 ? t('participants.empty') : t('participants.emptyView');
  list.forEach(x => participantList.appendChild(buildParticipantRow(x.b, {sorted:false})));
}

const importFile = document.getElementById('importFile');

function parseCsvParticipants(text){
  const names = [];
  text.split(/\r\n|\n|\r/).map(l => l.trim()).filter(Boolean).forEach((line, i) => {
    const delim = line.includes(';') ? ';' : (line.includes(',') ? ',' : null);
    let first = (delim ? line.split(delim)[0] : line).replace(/^"(.*)"$/, '$1');
    first = cleanText(first).slice(0, 60);
    if(i === 0 && new RegExp(t('import.headerPattern'), 'i').test(first)) return;
    if(first) names.push(first);
  });
  return names;
}
importFile.addEventListener('change', async () => {
  const file = importFile.files[0];
  if(!file) return;
  try{
    const names = parseCsvParticipants(await file.text());
    const seen = new Set(S().participants.map(b => nameKey(b.name)));
    const participants = [];
    for(const name of names){
      if(seen.has(nameKey(name))) continue;
      seen.add(nameKey(name));
      participants.push({id:uid(), name});
    }
    if(participants.length){
      if(perform({type:'participants.add', participants})) toast(t('import.done', {n:participants.length}));
    }else{
      toast(t('import.none'));
    }
  }catch(err){
    toast(t('import.error'));
  }
  importFile.value = '';
});

// Digit shortcuts keep pointing at the same participants for a moment after one was used.
// In a dense finish the operator types the order the participants were ranked in (2-1-3),
// without having to re-read the badges after every capture shifted the ranking.
const SHORTCUT_HOLD_MS = 5000;
let shortcutHold = null;   // {ids: [participantId], timer} while the mapping is frozen

/** Participant ids for the keys 1–9: the frozen mapping if one is held, else the ranking. */
function shortcutIds(){
  return shortcutHold ? shortcutHold.ids : currentRanking().slice(0, 9);
}
/** Freezes the current mapping (or extends the freeze) for SHORTCUT_HOLD_MS. */
function holdShortcuts(){
  const ids = shortcutIds();
  if(shortcutHold) clearTimeout(shortcutHold.timer);
  shortcutHold = {ids, timer: setTimeout(() => { shortcutHold = null; renderAll(); }, SHORTCUT_HOLD_MS)};
}

function recordTime(participantId){
  const w = currentWorkset();
  // Without an explicit participant the capture goes to the first sorted participant (if any).
  const target = participantId !== undefined ? participantId : ((w && w.ranking[0]) || null);
  const kind = effectiveKind();
  const capture = {id:uid(), ts:Date.now(), tzOffset:currentTzOffset(), targets: target ? [{type:'participant', id:target}] : [], kind, worksetId: w ? w.id : null};
  if(perform({type:'capture.add', capture})){
    // A one-shot kind applies to this capture only.
    if(nextKind){ nextKind = null; renderAll(); }
    const participant = target ? participantById(target) : null;
    toast((kind === DEFAULT_KIND ? t('captures.recorded') : t('captures.recordedKind', {kind: kindLabel(kind)}))
      + (participant ? ' – ' + participant.name : '') + ': ' + fmtTime(capture.ts, capture.tzOffset));
  }
}

const LONG_PRESS_MS = 550;
let kindPress = null;
kindSeg.addEventListener('pointerdown', (e) => {

});

// Letters for the two input fields and the participant list's filters and sorting.
// They are listed in the shortcuts dialog and stay the same in every language.
const LIST_SHORTCUTS = {
  // The search lives in the ranking panel, shown only on a station: join or create one first.
  f: () => {
    if(!currentWorkset() && !performOnWorkset(null)) return;
    rankSearch.focus();
    rankSearch.select();
  },
  n: () => { participantInput.focus(); participantInput.select(); },
  a: () => setFilter('all'),
  o: () => setFilter('open'),
  h: () => setFilter('hide'),
  s: () => cycleSortField(),
  d: () => toggleSortDir(),
};
document.addEventListener('keydown', (e) => {
  if(!dialogEl.hidden || !shortcutsEl.hidden || !stationDialog.hidden || drawer.classList.contains('open') || !kindMenu.hidden
    || !document.getElementById('membersDialog').hidden) return;
  const el = document.activeElement;
  const tag = (el && el.tagName) || '';
  if(['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) || (el && el.isContentEditable)) return;
  if(e.key === 'Escape' && nextKind){ e.preventDefault(); armNextKind(null); return; }
  // K: next sticky kind · Shift+K: next kind for the next capture only.
  if(e.key.toLowerCase() === 'k' && !e.ctrlKey && !e.metaKey && !e.altKey && !e.repeat){
    e.preventDefault();
    if(!S().archived) cycleKind(e.shiftKey);
    return;
  }
  if(e.code === 'Space' && !e.repeat){
    e.preventDefault();
    recordTime();
    return;
  }
  // Undo / redo. e.key, not e.code: the shortcut follows the keyboard layout (Z/Y on QWERTZ).
  const mod = APPLE ? e.metaKey && !e.ctrlKey : e.ctrlKey && !e.metaKey;
  const key = e.key.toLowerCase();
  if(mod && !e.altKey && (key === 'z' || (key === 'y' && !APPLE && !e.shiftKey))){
    e.preventDefault();
    if(!e.repeat) stepHistory(key === 'y' || e.shiftKey);
    return;
  }
  if(/^(Digit|Numpad)0$/.test(e.code) && !e.repeat){
    e.preventDefault();
    recordTime(null);
    return;
  }
  if(!e.ctrlKey && !e.metaKey && !e.altKey && !e.repeat){
    const action = LIST_SHORTCUTS[e.key.toLowerCase()];
    if(action){ e.preventDefault(); action(); return; }
  }
  const m = /^(Digit|Numpad)([1-9])$/.exec(e.code);
  if(m && !e.repeat){
    const participantId = shortcutIds()[parseInt(m[2], 10) - 1];
    if(participantId && currentRanking().includes(participantId)){
      e.preventDefault();
      holdShortcuts();
      recordTime(participantId);
    }
  }
});

const capList = document.getElementById('capList');
/** Kinds present among the captures, in picker order (unknown ids only show under "All"). */
function capturedKinds(s){
  const present = new Set(s.captures.map(c => c.kind));
  return allKinds(s).filter(k => present.has(k));
}
/** Captures name their station only once they come from more than one. */
function stationsShown(s){
  return new Set(s.captures.map(c => c.worksetId).filter(Boolean)).size > 1;
}
function renderCaptures(){
  const s = S();
  const facts = captureFacts();
  const stations = stationsShown(s);
  const unlocked = kindsUnlocked();
  const kinds = capturedKinds(s);
  const typed = s.captures.some(c => c.kind !== DEFAULT_KIND);

    else{

    }

  })));

  const pendingIds = backend.pendingCaptureIds();

  desc.forEach((c) => {
    const f = facts.get(c.id);

    // Places count within a kind; a marker (e.g. a protest) has none.

    const mid = document.createElement('span');

    // The date is part of every capture; it is only spelled out when it isn't today's.
    if(!isToday(c.ts, c.tzOffset)){
      const day = document.createElement('span');

    }
    const delta = document.createElement('div');
    delta.className = 'cap-delta';
    // A marker has no sequence: no delta to the previous one.
    delta.textContent = f.role === 'marker' ? '' : (f.prev ? '+' + fmtDelta(c.ts - f.prev.ts) : t('captures.first'))
      + (f.elapsed !== null ? ' · ' + t('captures.elapsed', {time: fmtDelta(f.elapsed)}) : '');
    mid.append(time, delta);

    if(unlocked){

/*
 * A capture's targets: participants and, once there are groups, groups. One (or none): a select
 * that replaces the assignment, as always. Several — a protest, a recall, a dead heat — are
 * chips with ✕ each. Once a capture has a target, a small "+" select adds another one.
 * Select values are ref keys ('participant:id', 'group:id').
 */
function buildTargetControls(s, c, editable){
  const targets = c.targets;
  const parseKey = (key) => { const i = key.indexOf(':'); return {type:key.slice(0, i), id:key.slice(i + 1)}; };
  const nameOf = (r) => {
    if(r.type === 'group'){ const g = findGroup(s, r.id); return g ? g.name : t('groups.deleted'); }
    const p = participantById(r.id);
    return p ? p.name : t('captures.deletedParticipant');
  };
  const option = (value, text, selected = false) => {
    const o = document.createElement('option');
    o.value = value;
    o.textContent = text;
    o.selected = selected;
    return o;
  };
  // Participants, then one <optgroup> per group type (only once groups exist).
  const fill = (sel, include) => {
    const participants = s.participants.filter(p => include({type:'participant', id:p.id}));
    const blocks = [...s.groupTypes.map(x => ({label:x.name, groups:groupsOfType(s, x.id)})),
      {label:t('groups.untyped'), groups:groupsOfType(s, null)}]
      .map(b => ({label:b.label, groups:b.groups.filter(g => include({type:'group', id:g.id}))})).filter(b => b.groups.length);
    if(!blocks.length){ participants.forEach(p => sel.appendChild(option('participant:' + p.id, p.name))); return; }
    const og = document.createElement('optgroup');
    og.label = t('groups.participants');
    participants.forEach(p => og.appendChild(option('participant:' + p.id, p.name)));
    if(participants.length) sel.appendChild(og);
    blocks.forEach(b => {
      const g = document.createElement('optgroup');
      g.label = b.label;
      b.groups.forEach(x => g.appendChild(option('group:' + x.id, x.name)));
      sel.appendChild(g);
    });
  };
  const out = [];
  if(targets.length > 1){
    const chips = document.createElement('span');
    chips.className = 'target-chips';
    targets.forEach(r => {
      const chip = document.createElement('span');
      chip.className = 'target-chip' + (r.type === 'group' ? ' is-group' : '');
      chip.textContent = nameOf(r);
      const x = document.createElement('button');
      x.type = 'button';
      x.className = 'target-x';
      x.textContent = '✕';
      x.title = t('captures.removeTarget', {name: nameOf(r)});
      x.setAttribute('aria-label', x.title);
      x.dataset.edit = 'critical';
      x.hidden = !editable;
      x.addEventListener('click', () => perform({type:'capture.target.remove', captureId:c.id, target:{type:r.type, id:r.id}}));
      chip.appendChild(x);
      chips.appendChild(chip);
    });
    out.push(chips);
  }else{
    const sel = document.createElement('select');
    sel.className = 'assign';
    sel.dataset.edit = 'critical';
    sel.appendChild(option('', t('captures.chooseParticipant')));
    fill(sel, () => true);
    const current = targets[0];
    if(current && !refExists(s, current)) sel.appendChild(option(refKey(current), nameOf(current)));
    sel.value = current ? refKey(current) : '';
    sel.disabled = !editable;
    sel.addEventListener('change', () => {
      if(!perform({type:'capture.assign', captureId:c.id, targets: sel.value ? [parseKey(sel.value)] : []})) renderCaptures();
    });
    out.push(sel);
  }
  if(editable && targets.length > 0){
    const add = document.createElement('select');
    add.className = 'assign add-target';
    add.dataset.edit = 'critical';
    add.title = t('captures.addTarget');
    add.setAttribute('aria-label', add.title);

    add.addEventListener('change', () => {
      if(!add.value || !perform({type:'capture.target.add', captureId:c.id, target:parseKey(add.value)})) renderCaptures();
    });
    out.push(add);
  }
  return out;
}

// ---------- CSV export ----------
document.getElementById('exportBtn').addEventListener('click', () => exportCsv());
/** Saves the captures of the current state as CSV (also offered before a revoked code's cache goes). */
async function exportCsv(){
  const s = S();
  if(!s.captures.length){ toast(t('export.none')); return; }
  const asc = sortedCaptures(s);
  const cell = (v) => String(v).replace(/;/g, ',');
  // Only finishes: the familiar four columns. With other kinds: places per kind, plus kind and
  // elapsed time; with captures from several stations, the station.
  const typed = s.captures.some(c => c.kind !== DEFAULT_KIND);
  const stations = stationsShown(s);
  const facts = captureFacts();
  const columns = [
    ['place', (c, f, i) => typed ? (f.role === 'marker' ? '' : f.place) : i + 1],
    ['timestamp', (c) => fmtIso(c.ts, c.tzOffset)],
    ['time', (c) => fmtTime(c.ts, c.tzOffset)],
    // What the capture is assigned to: participants and groups by name.
    ['participant', (c) => cell(c.targets.map(r => (r.type === 'group' ? findGroup(s, r.id) : participantById(r.id))).filter(Boolean).map(x => x.name).join(', '))],
    ...(typed ? [['kind', (c) => cell(captureKindText(c))], ['elapsed', (c, f) => f.elapsed !== null ? fmtDelta(f.elapsed) : '']] : []),
    ...(stations ? [['station', (c) => c.worksetId ? cell(worksetLabelById(c.worksetId, s)) : '']] : []),
    // One column per group type (headed by its name): the capture's groups of that type — the
    // ones it targets and the ones its participants are in.
    ...s.groupTypes.map(x => ['groupType', (c) => {
      const ids = captureParticipantIds(c);
      return cell(groupsOfType(s, x.id).filter(g => c.targets.some(r => r.type === 'group' && r.id === g.id)
        || ids.some(id => groupParticipantIds(s, g.id).has(id))).map(g => g.name).join(', '));
    }, cell(x.name)]),
  ];
  let csv = columns.map(([key, , header]) => header || t(`export.col.${key}`)).join(';') + '\n';
  asc.forEach((c, i) => {
    const f = facts.get(c.id);
    csv += columns.map(([, value]) => value(c, f, i)).join(';') + '\n';
  });
  const filename = t('export.filename') + '.csv';
  // Inside claude.ai the page must ask the host to save files; elsewhere a plain download works.
  let downloads = null;
  try{ if(window.claude && window.claude.use) downloads = await window.claude.use('downloads'); }catch(e){}
  if(downloads){
    try{ await downloads.save({filename, data:csv}); toast(t('export.saved')); }
    catch(err){ if(!err || err.code !== 'declined') toast(t('export.failed')); }
    return;
  }
  try{
    const url = URL.createObjectURL(new Blob(['﻿' + csv], {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }catch(e){
    toast(t('export.failed'));
  }
}

function fillRoleSelect(select, role){

function kindNameTaken(name, exceptId){

    || BUILTIN_KINDS.some(k => nameKey(kindLabel(k, s)) === nameKey(name));

function addKind(name, role){

/** Label for the number of members of a group (direct members). */

/** Groups of a type (null: without a type), in their order. */

/** An inline name field committing on change, like the event types' names. */

  const option = (ref, name, hint, disabled) => {
    const label = document.createElement('label');
    label.className = 'member-opt' + (disabled ? ' disabled' : '');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = membersEdit.selected.has(refKey(ref));
    box.disabled = disabled;
    box.addEventListener('change', () => {
      if(box.checked) membersEdit.selected.add(refKey(ref)); else membersEdit.selected.delete(refKey(ref));
    });
    label.append(box, name);
    if(hint){
      const h = document.createElement('span');
      h.className = 'hint';
      h.textContent = hint;
      label.appendChild(h);
    }
    return label;
  };
  // In a type with one group per member, the others of that type a participant is in.
  const otherOfType = (ref) => (type && type.exclusive
    ? s.groups.filter(x => x.id !== g.id && x.typeId === type.id && x.members.some(m => sameTarget(m, ref))).map(x => x.name).join(', ') : '');
  const rows = [];
  const participants = s.participants.filter(p => matches(p.name))
    .sort((a, b) => a.name.localeCompare(b.name, locale(), {numeric:true}));
  if(participants.length){
    const h = document.createElement('h4');
    h.textContent = t('groups.participants');
    rows.push(h, ...participants.map(p => option({type:'participant', id:p.id}, p.name, otherOfType({type:'participant', id:p.id}), false)));
  }
  const groups = s.groups.filter(x => x.id !== g.id && matches(x.name));
  if(groups.length){
    const h = document.createElement('h4');
    h.textContent = t('groups.title');
    rows.push(h, ...groups.map(x => {
      const cycle = groupContains(s, x.id, g.id);
      const typeName = x.typeId && findGroupType(s, x.typeId) ? findGroupType(s, x.typeId).name : '';
      return option({type:'group', id:x.id}, x.name, cycle ? t('groups.cycle') : typeName, cycle);
    }));
  }
  membersList.replaceChildren(...rows);
}
function applyMembers(){
  const s = S();
  const g = membersEdit && findGroup(s, membersEdit.groupId);
  if(!g){ closeMembers(); return; }
  const parse = (key) => { const i = key.indexOf(':'); return {type:key.slice(0, i), id:key.slice(i + 1)}; };
  const current = new Set(g.members.map(refKey));
  const added = [...membersEdit.selected].filter(k => !current.has(k)).map(parse);
  const removed = [...current].filter(k => !membersEdit.selected.has(k)).map(parse);
  const ops = [];
  if(added.length) ops.push({type:'group.members.add', groupId:g.id, refs:added});
  if(removed.length) ops.push({type:'group.members.remove', groupId:g.id, refs:removed});
  // One group per member in an exclusive type: joining this one leaves the others (one step).
  const type = g.typeId ? findGroupType(s, g.typeId) : null;
  if(type && type.exclusive && added.length){
    s.groups.filter(x => x.id !== g.id && x.typeId === type.id).forEach(x => {
      const leave = added.filter(r => x.members.some(m => sameTarget(m, r)));
      if(leave.length) ops.push({type:'group.members.remove', groupId:x.id, refs:leave});
    });
  }
  if(ops.length && !perform(ops)) return;
  closeMembers();
}
membersSearch.addEventListener('input', renderMembers);
document.getElementById('membersOk').addEventListener('click', applyMembers);
document.getElementById('membersCancel').addEventListener('click', closeMembers);
membersDialog.addEventListener('keydown', (e) => { if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); closeMembers(); } });
membersDialog.addEventListener('click', (e) => { if(e.target === membersDialog) closeMembers(); });

// ---------- stations (worksets) ----------
const worksetList = document.getElementById('worksetList');
/** A station name must differ from the other stations' names and labels. */
function worksetNameTaken(name, exceptId){
  return S().worksets.some(w => w.id !== exceptId && nameKey(worksetLabel(w)) === nameKey(name));
}
/*
 * Stations belong to working with several devices: in server mode the section is always there;
 * a local race only shows it once it has more than one (e.g. copied from a server).
 */
function renderWorksets(){
  const s = S();
  const shown = backend.kind === 'server' || s.worksets.length > 1;
  document.getElementById('worksetsSection').hidden = !shown;
  if(!shown) return;
  // Leave the list alone while a name in it is being edited (see renderKinds).
  if(worksetList.contains(document.activeElement) && document.activeElement.matches('input')) return;
  const current = currentWorkset(s);
  const pickButton = (on, onClick) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'mini ws-pick' + (on ? ' on' : '');
    b.textContent = on ? '●' : '○';
    b.title = t('worksets.use');
    b.setAttribute('aria-label', b.title);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.addEventListener('click', onClick);
    return b;
  };
  const restricted = restrictedAccess();
  const codes = backend.accessInfo().codes || [];
  // Defaults and new devices are none of a station code's business.
  document.getElementById('worksetsHelp').hidden = restricted;
  const miniButton = (label, title, onClick) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'mini';
    b.textContent = label;
    b.title = title;
    b.setAttribute('aria-label', title);
    b.dataset.edit = 'normal';
    b.addEventListener('click', onClick);
    return b;
  };
  const rows = s.worksets.map((w, i) => {
    const li = document.createElement('li');
    li.className = 'ws-row';
    const name = document.createElement('input');
    name.className = 'input';
    name.type = 'text';
    name.maxLength = 40;
    name.value = w.name || '';
    name.placeholder = t('worksets.defaultName', {n: w.number});
    name.dataset.edit = 'normal';
    name.readOnly = !can([['workset', w.id], ['rename', null]]);
    name.setAttribute('aria-label', t('worksets.title'));
    name.addEventListener('change', () => {
      const current = findWorkset(S(), w.id);
      if(!current) return;
      const value = cleanText(name.value) || null;
      if(value === current.name) return;
      if(value && worksetNameTaken(value, w.id)){ toast(t('worksets.exists', {name:value})); name.value = current.name || ''; return; }
      if(!perform({type:'workset.rename', worksetId:w.id, name:value})) name.value = current.name || '';
    });
    name.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); name.blur(); }
      else if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); name.value = w.name || ''; name.blur(); }
    });
    name.addEventListener('blur', () => renderWorksets());
    li.append(pickButton(current === w, () => setDeviceWorkset(w.id)), name);
    // Which station is the race's default only matters to those who see all of them.
    if(i > 0 && !restricted && can([['workset', w.id], ['makeDefault', null]])){
      li.append(miniButton('★', t('worksets.makeDefault'), () => perform({type:'workset.makeDefault', worksetId:w.id})));
    }
    if(can([['workset', w.id], ['delete', null]])) li.append(miniButton('✕', t('action.delete'), async () => {
      const ok = await askConfirm({title:t('worksets.deleteTitle'), text:t('worksets.deleteText', {name:worksetLabel(w)}), ok:t('action.delete'), danger:true});
      if(!ok) return;
      // The row goes away with the focused ✕; keep the focus in the drawer (Escape needs it).
      document.getElementById('addWorksetBtn').focus({preventScroll: true});
      perform({type:'workset.delete', worksetId:w.id});
    }));
    // Second line: default, devices on it, and the station's own code to hand out.
    const sub = document.createElement('div');
    sub.className = 'ws-sub';
    const devices = backend.worksetClientCount(w.id);
    const meta = [i === 0 && !restricted ? t('worksets.default') : '', devices ? t('worksets.devices', {n: devices}) : ''].filter(Boolean);
    if(meta.length) sub.append(meta.join(' · '));
    const own = codes.find(c => c.source === 'workset' && c.sourceRef === w.id);
    if(own){
      const code = document.createElement('span');
      code.className = 'ws-code';
      code.textContent = t('worksets.code', {code: own.code});
      const copy = document.createElement('button');
      copy.type = 'button';
      copy.className = 'link-btn';
      copy.textContent = t('worksets.copyLink');
      copy.addEventListener('click', () => copyText(raceLink(backend.serverUrl, own.code)));
      sub.append(code, copy);
    }
    if(sub.childNodes.length) li.append(sub);
    return li;
  });
  if(s.worksets.length){
    const none = document.createElement('li');
    none.className = 'ws-row';
    const label = document.createElement('span');
    label.className = 'ws-none';
    label.textContent = t('worksets.none');
    none.append(pickButton(!current, () => setDeviceWorkset(null)), label);
    rows.push(none);
  }else{
    const empty = document.createElement('li');
    empty.className = 'help';
    empty.style.margin = '0';
    empty.textContent = t('worksets.empty');
    rows.push(empty);
  }
  worksetList.replaceChildren(...rows);
}
document.getElementById('addWorksetBtn').addEventListener('click', () => {
  // A device that never joined a station joins the first one (syncDeviceWorkset); others stay.
  perform({type:'workset.add', workset:{id:uid(), name:null}});
});

function showConnectError(message){
  const el = document.getElementById('connectError');
  el.textContent = message || '';
  el.hidden = !message;
}

function renderSettings(){
  if(!backend) return;
  const sport = S().sport;
  sportSelect.innerHTML = '';
  SPORTS.forEach(code => {
    const o = document.createElement('option');
    o.value = code;
    o.textContent = t(`sport.${code}`);
    o.selected = code === sport;
    sportSelect.appendChild(o);
  });
  renderKinds();
  renderGroups();
  renderWorksets();

  const isServer = backend.kind === 'server';
  document.getElementById('localSection').hidden = isServer;
  document.getElementById('serverSection').hidden = !isServer;

  if(!isServer){
    renderRecent();
    const urlInput = document.getElementById('serverUrlInput');
    if(document.activeElement !== urlInput) urlInput.value = prefs.serverUrl || '';
    urlInput.placeholder = DEFAULT_SERVER_URL || 'https://timing.example.org';
    document.getElementById('serverUrlHelp').textContent = DEFAULT_SERVER_URL
      ? t('settings.serverUrlDefault', {url: DEFAULT_SERVER_URL})
      : t('settings.serverUrlNone');
    if(!DEFAULT_SERVER_URL && !prefs.serverUrl) document.getElementById('advancedLocal').open = true;
    return;
  }

  const {status} = statusInfo();
  const labels = {connecting:'status.connecting', online:'status.online', offline:'status.offline'};
  document.getElementById('srvDot').className = 'dot ' + status;
  document.getElementById('srvStatus').textContent = t(labels[status]);
  const details = [];
  if(status === 'online') details.push(t(backend.transport === 'ws' ? 'settings.transportWs' : 'settings.transportPoll'));
  const clients = backend.clientCount();
  if(clients) details.push(clients === 1 ? t('settings.clientsOne') : t('settings.clientsMany', {n: clients}));
  if(backend.pendingCount()) details.push(t('settings.pendingDetail', {n: backend.pendingCount()}));
  const detailEl = document.getElementById('srvDetail');
  detailEl.textContent = details.join(' · ');
  detailEl.hidden = details.length === 0;

  document.getElementById('srvCode').value = backend.code;
  document.getElementById('srvUrl').value = backend.serverUrl;
  const link = raceLink(backend.serverUrl, backend.code);
  const linkEl = document.getElementById('srvLink');
  linkEl.href = link;
  linkEl.textContent = link;

  const online = status === 'online';
  const archived = S().archived;
  const local = localStore.load();
  const mergeBtn = document.getElementById('mergeBtn');
  // Local data of a newer app version is neither uploaded nor overwritten.
  mergeBtn.disabled = !online || archived || !hasData(local) || localStore.tooNew;
  document.getElementById('mergeHelp').textContent = hasData(local) ? t('settings.mergeHint') : t('settings.mergeEmpty');
  document.getElementById('pullBtn').disabled = !backend.hasSnapshot || localStore.tooNew;
  document.getElementById('archiveAction').hidden = archived;
  document.getElementById('archiveBtn').disabled = !online;
  document.getElementById('archivedInfo').hidden = !archived;
}

document.getElementById('serverUrlInput').addEventListener('change', (e) => {
  const value = normalizeServerUrl(e.target.value);
  prefs.serverUrl = value && value !== DEFAULT_SERVER_URL ? value : null;
  savePrefs();
  renderSettings();
});
document.getElementById('codeInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('connectBtn').click(); }
});

async function withBusy(buttons, fn){
  buttons.forEach(b => { b.disabled = true; });
  try{ await fn(); }finally{ buttons.forEach(b => { b.disabled = false; }); }
}
function requireServerUrl(){
  const url = currentServerUrl();
  if(!url){
    showConnectError(t('err.noServer'));
    document.getElementById('advancedLocal').open = true;
    document.getElementById('serverUrlInput').focus();
  }
  return url;
}

/** Quick-connect entries for the races this browser used last. */
function renderRecent(){
  const all = recentConnections();
  const list = all.slice(0, recentShown);
  const wrap = document.getElementById('recentList');
  document.getElementById('recentField').hidden = list.length === 0;
  wrap.innerHTML = '';
  list.forEach(entry => {
    const row = document.createElement('div');
    row.className = 'recent-row';
    const b = document.createElement('button');
    b.className = 'btn recent-item';
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = (entry.name || entry.code) + (entry.worksetName ? ` (${entry.worksetName})` : '');
    const meta = document.createElement('span');
    meta.className = 'meta';
    // The code is redundant when it is the label; the host matters with several servers.
    meta.textContent = [entry.name || entry.worksetName ? entry.code : '', hostOf(entry.serverUrl)].filter(Boolean).join(' · ');
    b.append(nm, meta);
    b.addEventListener('click', () => {
      showConnectError('');
      withBusy([b], async () => {
        try{ await connectToRace(entry.serverUrl, entry.code); }
        catch(e){ showConnectError(errorMessage(e, entry.code)); }
      });
    });
    const forget = document.createElement('button');
    forget.className = 'mini';
    forget.type = 'button';
    forget.textContent = '✕';
    forget.title = t('settings.recentForget');
    forget.setAttribute('aria-label', forget.title);
    forget.addEventListener('click', () => {
      // The row goes away with the focused ✕; keep the focus in the drawer (Escape needs it).
      document.getElementById('codeInput').focus({preventScroll: true});
      forgetConnection(entry.serverUrl, entry.code);
      renderRecent();
    });
    row.append(b, forget);
    wrap.appendChild(row);
  });
  const rest = all.length - list.length;
  if(rest > 0){
    const more = document.createElement('button');
    more.className = 'link-btn recent-more';
    more.type = 'button';
    more.textContent = t('settings.recentMore', {n: Math.min(rest, RECENT_MAX)});
    more.addEventListener('click', () => {
      recentShown += RECENT_MAX;
      renderRecent();
      // The link is rebuilt (or gone); keep the focus on it or in the drawer.
      (wrap.querySelector('.recent-more') || document.getElementById('codeInput')).focus({preventScroll: true});
    });
    wrap.appendChild(more);
  }
}
/** Host of a server URL, left out when it is the one this page would use anyway. */
function hostOf(serverUrl){
  const current = prefs.serverUrl || DEFAULT_SERVER_URL || '';
  if(serverUrl === current) return '';
  try{ return new URL(serverUrl).host; }catch(e){ return serverUrl; }
}

document.getElementById('connectBtn').addEventListener('click', () => {
  showConnectError('');
  const code = normalizeCode(document.getElementById('codeInput').value);
  if(!code){ showConnectError(t('err.codeEmpty')); return; }
  const serverUrl = requireServerUrl();
  if(!serverUrl) return;
  withBusy([document.getElementById('connectBtn'), document.getElementById('createBtn')], async () => {
    try{
      await connectToRace(serverUrl, code);
      document.getElementById('codeInput').value = '';
    }catch(e){
      showConnectError(errorMessage(e, code));
    }
  });
});

document.getElementById('createBtn').addEventListener('click', () => {
  showConnectError('');
  const serverUrl = requireServerUrl();
  if(!serverUrl) return;
  withBusy([document.getElementById('connectBtn'), document.getElementById('createBtn')], async () => {
    try{
      const created = await api(serverUrl, '/api/races', {method:'POST'});
      await connectToRace(serverUrl, created.code);
    }catch(e){
      showConnectError(errorMessage(e, ''));
    }
  });
});

document.getElementById('resetLocalBtn').addEventListener('click', async () => {
  const ok = await askConfirm({title:t('reset.title'), text:t('reset.text'), ok:t('reset.ok'), danger:true});
  if(!ok) return;
  localStore.load();
  if(localStore.tooNew){ toast(t('lock.outdated')); return; }
  localStore.reset();
  removeKey(KEYS.worksetPrefix + 'local');
  if(backend.kind === 'local'){ loadDeviceWorkset(); backend.reload(); }
  toast(t('reset.done'));
});

document.getElementById('disconnectBtn').addEventListener('click', () => {
  useLocal();
  toast(t('conn.disconnected'));
});

document.getElementById('copyLinkBtn').addEventListener('click', async () => {
  if(!await copyText(document.getElementById('srvLink').href)){
    const range = document.createRange();
    range.selectNodeContents(document.getElementById('srvLink'));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
  }
});
/** Copies a link to the clipboard; false where the browser doesn't allow it. */
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast(t('settings.copied')); return true; }
  catch(e){ toast(text); return false; }
}

document.getElementById('mergeBtn').addEventListener('click', async () => {
  const local = localStore.load();
  if(localStore.tooNew){ toast(t('lock.outdated')); return; }
  const ok = await askConfirm({
    title:t('merge.title'),
    text:t('merge.text', {participants:local.participants.length, captures:local.captures.length, code:backend.code}),
    ok:t('merge.ok'),
  });
  if(!ok || backend.kind !== 'server') return;
  const opId = perform({type:'state.merge', state:mergePayload(local)});
  if(typeof opId === 'string' && await backend.waitFor(opId)){
    toast(t('merge.done'));
    renderSettings();
  }
});

document.getElementById('pullBtn').addEventListener('click', async () => {
  const ok = await askConfirm({title:t('pull.title'), text:t('pull.text', {code:backend.code}), ok:t('pull.ok'), danger:true});
  if(!ok || backend.kind !== 'server') return;
  localStore.load();
  if(localStore.tooNew){ toast(t('lock.outdated')); return; }
  const copy = clone(S());
  copy.archived = false;
  localStore.save(copy);
  // The local data starts over: its device joins the default station again.
  removeKey(KEYS.worksetPrefix + 'local');
  toast(t('pull.done'));
  renderSettings();
});

document.getElementById('archiveBtn').addEventListener('click', async () => {
  const ok = await askConfirm({title:t('archive.title'), text:t('archive.text', {code:backend.code}), ok:t('archive.ok'), danger:true});
  if(!ok) return;
  const opId = perform({type:'race.archive'});
  if(typeof opId === 'string' && await backend.waitFor(opId)) toast(t('archive.done'));
});

// =====================================================================
// Start-up: resume a stored connection or follow a #r=CODE link.
// =====================================================================
function followLink(code){
  const serverUrl = currentServerUrl();
  if(!serverUrl){ toast(t('err.noServer')); openSettings(); return; }
  connectToRace(serverUrl, code, {interactive:false}).catch(e => {
    toast(errorMessage(e, code));
    if(backend.kind === 'local') setFragment(null);
  });
}

(function start(){
  const linkCode = parseFragment();
  const connection = readJson(KEYS.connection);
  const hasConnection = connection && connection.serverUrl && connection.code;
  if(linkCode && !(hasConnection && connection.code === linkCode)){
    setBackend(new LocalBackend(backendHandlers));
    followLink(linkCode);
  }else if(hasConnection){
    useServer(connection.serverUrl, connection.code);
  }else{
    setBackend(new LocalBackend(backendHandlers));
  }
})();

window.addEventListener('hashchange', () => {
  const code = parseFragment();
  if(code && !(backend.kind === 'server' && backend.code === code)) followLink(code);
});
document.getElementById('outdatedReload').addEventListener('click', () => location.reload());
// Another tab changed the local data: pick it up.
window.addEventListener('storage', (e) => {
  if(e.key === KEYS.local && backend.kind === 'local') backend.reload();
});

// Offline start after the first visit (public/sw.js). Only when served by the backend,
// which provides the service worker; needs HTTPS (or localhost).
if('serviceWorker' in navigator && window.TIMER_CONFIG && window.isSecureContext){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker registration failed', e));
  });
}
</script>
