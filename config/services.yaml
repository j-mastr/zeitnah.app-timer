services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $projectDir: '%kernel.project_dir%'
            int $wsPort: '%env(int:WS_PORT)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Regatta\ClientConfig:
        arguments:
            $wsPublicUrl: '%env(default::WS_PUBLIC_URL)%'

    App\Regatta\Database:
        arguments:
            $dsn: '%env(resolve:DATABASE_DSN)%'
            $user: '%env(default::DATABASE_USER)%'
            $password: '%env(default::DATABASE_PASSWORD)%'
